<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221D24" media="(prefers-color-scheme: dark)">
<title>ATL Thrift Guide — by 2nd Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23221D24'/%3E%3Ctext x='32' y='43' text-anchor='middle' fill='%23FFFFFF' font-family='Georgia,serif' font-style='italic' font-weight='700' font-size='42'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,700&family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFFFFF;
  --page-bg:#FFFFFF;
  --cream-card:#F4F2F4;
  --ink:#221D24;
  --ink-soft:#6B6470;
  --body-text:#4A4450;
  --royal:#C5563E;
  --royal-dark:#B44E38;
  --royal-tint:#F3DAD3;
  --gold:#F2C230;
  --gold-tint:#FBEDBE;
  --cobalt:#2452C7;
  --navy:#1B2A4A;
  --sage:#C8D6C4;
  --on-cobalt:#FFFFFF;
  --on-navy:#FFFFFF;
  --on-sage:#221D24;
  --line:#DCD7DD;
  --line-strong:#221D24;
  --danger:#B84A3E;
  --danger-text:#B84A3E;
  --ink-block:#221D24;
  --on-ink-block:#FFFFFF;
  --shadow-none:none;
  --radius-card:20px;
  --radius-pill:999px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, sans-serif;
  --font-mono:'DM Mono', monospace;
}
:root:not([data-theme="light"]) {
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#221D24;
    --page-bg:#221D24;
    --cream-card:#2A252B;
    --ink:#FFFFFF;
    --ink-soft:#C7BEC7;
    --body-text:#E3DAE0;
    --royal:#C5563E;
    --royal-dark:#D9755D;
    --royal-tint:#4A2E28;
    --gold:#F2C230;
    --gold-tint:#4A3E1A;
    --cobalt:#7E9BF0;
    --navy:#B9C6E6;
    --sage:#8FA98B;
    --on-cobalt:#221D24;
    --on-navy:#221D24;
    --on-sage:#221D24;
    --line:#453D46;
    --line-strong:#FFFFFF;
    --danger:#B84A3E;
    --danger-text:#E8857A;
    --ink-block:#36303A;
    --on-ink-block:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --cream:#221D24;
  --page-bg:#221D24;
  --cream-card:#2A252B;
  --ink:#FFFFFF;
  --ink-soft:#C7BEC7;
  --body-text:#E3DAE0;
  --royal:#C5563E;
  --royal-dark:#D9755D;
  --royal-tint:#4A2E28;
  --gold:#F2C230;
  --gold-tint:#4A3E1A;
  --cobalt:#7E9BF0;
  --navy:#B9C6E6;
  --sage:#8FA98B;
  --on-cobalt:#221D24;
  --on-navy:#221D24;
  --on-sage:#221D24;
  --line:#453D46;
  --line-strong:#FFFFFF;
  --danger:#B84A3E;
  --danger-text:#E8857A;
  --ink-block:#36303A;
  --on-ink-block:#FFFFFF;
}
:root{color-scheme:light;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){color-scheme:dark;} }
:root[data-theme="dark"]{color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--page-bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:13.5px;
  line-height:1.55;
  min-height:100vh;
  overflow-x:hidden;
}
img,svg{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;color:var(--ink);}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.app-shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--page-bg);position:relative;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:40;background:var(--page-bg);display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;}
.brand-mark{display:flex;align-items:center;gap:9px;background:none;border:none;padding:0;}
.brand-logo{width:34px;height:34px;border-radius:9px;background:var(--royal);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-logo svg{width:19px;height:19px;}
.brand-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;}
.brand-text .b1{font-family:var(--font-display);font-weight:600;font-size:16.5px;color:var(--ink);}
.brand-text .b2{font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em;}
.top-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--cream-card);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
.icon-btn svg{width:18px;height:18px;}
main.view{flex:1;padding:0 18px 100px;}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
.bottom-nav-inner{max-width:496px;width:100%;display:flex;gap:4px;background:var(--ink-block);border-radius:var(--radius-pill);padding:7px;}
.nav-item{flex:1;background:none;border:none;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;gap:5px;padding:13px 4px;color:#FFFFFF;font-family:var(--font-body);}
.nav-item svg{width:17px;height:17px;}
.nav-item span{font-size:12.5px;font-weight:700;letter-spacing:-.01em;}
.nav-item.active{color:#221D24;background:#FFFFFF;}
.nav-item.build .nav-dot{position:absolute;}
h1,h2,h3{font-family:var(--font-display);font-optical-sizing:auto;margin:0;color:var(--ink);}
p{margin:0;}
.section{margin-top:30px;}
.section:first-child{margin-top:18px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.section-head h2{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);}
.see-all{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--royal);background:none;border:none;padding:0;}
.hero{background:transparent;border-radius:0;padding:6px 0 18px;color:var(--ink);position:relative;overflow:visible;}
.hero .hero-tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;display:inline-block;}
.hero h1{font-family:var(--font-display);font-size:38px;line-height:.98;font-weight:600;letter-spacing:-.03em;color:var(--ink);margin-bottom:12px;}
.hero p.sub{font-size:14.5px;line-height:1.55;color:var(--body-text);max-width:310px;margin-bottom:24px;}
.hero-btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border-radius:var(--radius-pill);padding:13px 20px;font-weight:700;font-size:14.5px;border:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:7px;}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--ink);color:var(--cream);}
@media (hover:hover){.btn-primary:hover{background:var(--royal);}}
.btn-secondary-hero{background:transparent;color:var(--ink);border:2px solid var(--ink);}
@media (hover:hover){.btn-secondary-hero:hover{background:var(--ink);color:var(--cream);}}
.btn-royal{background:var(--royal);color:#FFFFFF;}
.btn-outline{background:transparent;color:var(--ink);border:2px solid var(--line-strong);}
@media (hover:hover){.btn-outline:hover{background:var(--ink);color:var(--cream);}}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:9px 14px;font-size:13px;}
.hscroll{display:flex;gap:13px;overflow-x:auto;margin:0 -18px;padding:0 18px 6px;scrollbar-width:none;}
.hscroll::-webkit-scrollbar{display:none;}
.store-card{background:var(--cream);border:2px solid var(--line-strong);border-radius:var(--radius-card);overflow:hidden;flex-shrink:0;width:236px;}
.store-card.wide{width:100%;flex-shrink:1;}
.store-photo{position:relative;height:130px;}
.store-photo svg{width:100%;height:100%;}
.save-btn{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(34,29,36,.72);border:none;display:flex;align-items:center;justify-content:center;}
.save-btn svg{width:17px;height:17px;stroke:#FFFFFF;fill:none;}
.save-btn.saved svg{fill:var(--gold);stroke:var(--gold);}
.tag-chip{position:absolute;left:10px;bottom:10px;background:var(--cream);color:var(--ink);font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);}
.store-body{padding:13px 14px 15px;}
.store-name{font-family:var(--font-display);font-size:16.5px;font-weight:600;margin-bottom:3px;}
.store-meta{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.dot-sep::before{content:"·";margin:0 1px;}
.store-desc{font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.45;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.pill{font-size:10.5px;font-weight:600;background:var(--royal-tint);color:var(--royal-dark);padding:4px 9px;border-radius:var(--radius-pill);}
.pill.gold{background:var(--gold-tint);color:#8A5A44;}
:root[data-theme="dark"] .pill.gold{color:var(--gold);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.gold{color:var(--gold);}}
.card-cta-row{display:flex;gap:8px;margin-top:12px;}
.card-cta-row .btn{flex:1;}
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap input{width:100%;padding:13px 16px 13px 42px;border-radius:var(--radius-pill);border:2px solid var(--line);background:transparent;font-size:14.5px;color:var(--ink);}
.search-wrap input::placeholder{color:var(--ink-soft);}
.search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-soft);}
.filter-row{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 6px;padding:0 18px 8px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:9px 15px;border-radius:var(--radius-pill);border:1.5px solid var(--line);background:transparent;font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--body-text);white-space:nowrap;}
.chip.active{background:var(--royal);color:#FFFFFF;border-color:var(--royal);}
.view-toggle{display:flex;background:var(--cream-card);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:3px;margin-bottom:16px;}
.view-toggle button{flex:1;border:none;background:none;padding:9px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px;}
.view-toggle button.active{background:var(--royal);color:#FFFFFF;}
.view-toggle svg{width:15px;height:15px;}
.list-stack{display:flex;flex-direction:column;gap:14px;}
.grid-stack{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.grid-card{background:var(--cream);border:2px solid var(--line-strong);border-radius:20px;overflow:hidden;text-align:left;padding:0;cursor:pointer;font-family:inherit;}
.grid-card .gc-photo{position:relative;height:112px;}
.grid-card .gc-body{padding:11px 12px 13px;}
.grid-card .gc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.grid-card .gc-name{font-family:var(--font-display);font-size:15px;font-weight:600;line-height:1.15;letter-spacing:-.01em;color:var(--ink);}
.grid-card .gc-rating{font-family:var(--font-mono);font-size:10px;color:var(--ink);flex-shrink:0;padding-top:2px;white-space:nowrap;}
.grid-card .gc-rating svg{width:9px;height:9px;fill:var(--gold);vertical-align:-1px;margin-right:2px;}
.grid-card .gc-meta{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:5px;}
.chain-toggle{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:20px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-align:left;}
.chain-toggle.on{border-color:var(--line-strong);background:var(--ink-block);color:var(--on-ink-block);}
.chain-toggle .ct-title{font-size:13.5px;font-weight:700;}
.chain-toggle .ct-sub{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px;opacity:.85;}
.chain-toggle.on .ct-sub{color:rgba(255,255,255,.75);}
.chain-toggle .ct-switch{width:46px;height:26px;border-radius:99px;flex-shrink:0;padding:3px;display:flex;justify-content:flex-start;background:var(--line);}
.chain-toggle.on .ct-switch{justify-content:flex-end;background:var(--gold);}
.chain-toggle .ct-knob{width:20px;height:20px;border-radius:99px;background:#FFFFFF;display:block;}
.chain-toggle.on .ct-knob{background:#221D24;}
.map-canvas{position:relative;width:100%;height:340px;border-radius:20px;overflow:hidden;background:var(--sage);margin-bottom:16px;}
.map-pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;}
.map-pin button{width:30px;height:30px;border-radius:50% 50% 50% 4px;background:var(--royal);border:2px solid var(--cream-card);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;}
.map-pin button span{transform:rotate(-45deg);font-size:12px;font-weight:800;color:#FFFFFF;}
.map-pin.gold button{background:var(--gold);}
.map-pin.gold button span{color:#5C3A1E;}
.map-label{position:absolute;font-size:10px;font-weight:700;color:var(--royal-dark);opacity:.55;letter-spacing:.02em;}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state h3{font-size:17px;margin-bottom:6px;color:var(--ink);}
.empty-state p{font-size:13.5px;line-height:1.5;}
.detail-photo{height:220px;border-radius:var(--radius-card);overflow:hidden;position:relative;margin-bottom:16px;}
.detail-photo svg{width:100%;height:100%;}
.back-fab{position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;background:rgba(20,21,42,.4);border:none;display:flex;align-items:center;justify-content:center;}
.back-fab svg{width:18px;height:18px;stroke:#FFFFFF;}
.detail-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.detail-title-row h1{font-size:26px;font-weight:600;}
.rating-badge{background:var(--gold-tint);color:#8A5A44;font-weight:800;font-size:13px;padding:6px 10px;border-radius:12px;display:flex;align-items:center;gap:4px;flex-shrink:0;}
.rating-badge svg{width:13px;height:13px;fill:currentColor;}
.detail-meta-line{font-size:13.5px;color:var(--ink-soft);margin-bottom:14px;}
.detail-cta-row{display:flex;gap:8px;margin-bottom:22px;}
.detail-cta-row .btn{flex:1;padding:12px 10px;font-size:13px;}
.info-block{background:var(--cream-card);border:1px solid var(--line);border-radius:22px;padding:16px 17px;margin-bottom:14px;}
.info-block h3{font-size:14px;margin-bottom:8px;}
.info-block p{font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
.info-row{display:flex;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink-soft);}
.info-row:last-child{border-bottom:none;}
.info-row svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--royal);}
.info-row .lbl{color:var(--ink);font-weight:600;min-width:70px;}
.wizard-card{background:transparent;border:none;padding:0;}
.wizard-step-label{font-size:12.5px;font-weight:700;color:var(--royal);margin-bottom:6px;}
.wizard-q{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:18px;line-height:1.2;}
.option-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.option-tile{display:flex;align-items:center;gap:12px;padding:16px 16px;border-radius:20px;border:2px solid var(--line);background:transparent;text-align:left;}
.option-tile.active{border-color:var(--line-strong);background:var(--ink-block);}
.option-tile .oi{width:36px;height:36px;border-radius:10px;background:var(--cream-card);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.option-tile.active .oi{background:rgba(255,255,255,.14);}
.option-tile .oi svg{width:18px;height:18px;color:var(--royal);}
.option-tile.active .oi svg{color:var(--gold);}
.option-tile .ot-text{flex:1;display:flex;flex-direction:column;gap:4px;}
.option-tile .ot-title{font-family:var(--font-display);font-weight:600;font-size:16.5px;letter-spacing:-.01em;}
.option-tile.active .ot-title{color:var(--on-ink-block);}
.option-tile .ot-sub{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
.option-tile.active .ot-sub{color:rgba(255,255,255,.7);}
.option-tile .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;}
.option-tile.active .check{background:var(--gold);border-color:var(--gold);position:relative;}
.option-tile.active .check::after{content:"";position:absolute;left:6px;top:3px;width:5px;height:9px;border:solid #221D24;border-width:0 2px 2px 0;transform:rotate(45deg);}
.chip-grid{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px;}
.chip-grid-scroll{display:flex;flex-wrap:wrap;align-content:flex-start;gap:9px;max-height:190px;overflow-y:auto;padding-right:8px;}
.chip-grid-scroll::-webkit-scrollbar{width:6px;}
.chip-grid-scroll::-webkit-scrollbar-track{background:transparent;}
.chip-grid-scroll::-webkit-scrollbar-thumb{background:var(--royal);border-radius:999px;}
.chip-grid-scroll::-webkit-scrollbar-thumb:hover{background:var(--royal-dark);}
.chip-grid-scroll{scrollbar-width:thin;scrollbar-color:var(--royal) transparent;}
.chip-grid-scroll.gold::-webkit-scrollbar-thumb{background:var(--gold);}
.chip-grid-scroll.gold::-webkit-scrollbar-thumb:hover{background:#D9A61E;}
.chip-grid-scroll.gold{scrollbar-color:var(--gold) transparent;}
.wizard-progress{display:flex;gap:5px;margin-bottom:20px;}
.wizard-progress span{height:4px;flex:1;background:var(--line);border-radius:4px;}
.wizard-progress span.done{background:var(--royal);}
.wizard-nav{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));z-index:45;max-width:430px;margin:0 auto;padding:12px 20px 0;background:var(--page-bg);}
.wizard-nav .btn[disabled]{opacity:.35;cursor:default;}
body:has(.wizard-nav) .toast{bottom:calc(160px + env(safe-area-inset-bottom));}
.wizard-card{padding-bottom:72px;}
.route-summary-bar{display:flex;justify-content:space-between;background:var(--ink-block);color:var(--on-ink-block);border-radius:20px;padding:17px 19px;margin-bottom:16px;}
.route-summary-bar .rsb-item{text-align:left;}
.route-summary-bar .rsb-num{font-family:var(--font-display);font-size:23px;font-weight:600;}
.route-summary-bar .rsb-num.gold{color:var(--gold);}
.route-summary-bar .rsb-lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:5px;}
.stop-card{display:flex;gap:12px;background:var(--cream-card);border:1px solid var(--line);border-radius:22px;padding:13px;margin-bottom:10px;align-items:flex-start;}
.stop-num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--cream-card);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stop-thumb{width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.stop-thumb svg{width:100%;height:100%;}
.stop-info{flex:1;min-width:0;}
.stop-info .sname{font-weight:700;font-size:14.5px;}
.stop-info .smeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.stop-actions{display:flex;flex-direction:column;gap:5px;}
.stop-actions button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--cream);display:flex;align-items:center;justify-content:center;}
.stop-actions svg{width:13px;height:13px;}
.verified-stamp{display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:#221D24;font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;line-height:1;padding:4px 8px 4px 5px;border-radius:999px;white-space:nowrap;vertical-align:middle;}
.verified-stamp svg{width:13px;height:13px;flex:none;}
.stop-card>svg{width:20px;height:20px;flex-shrink:0;align-self:center;color:var(--royal);}
.travel-line{display:flex;align-items:center;gap:8px;padding:2px 0 2px 14px;font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;}
.travel-line svg{width:13px;height:13px;}
.post-card{background:var(--cream);border:2px solid var(--line-strong);border-radius:22px;overflow:hidden;margin-bottom:16px;}
.post-head{display:flex;align-items:center;gap:10px;padding:13px 14px 10px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--royal);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.post-head .pu{font-weight:700;font-size:13.5px;}
.post-head .pu-meta{font-size:11.5px;color:var(--ink-soft);}
.post-photo{height:230px;position:relative;}
.post-photo svg{width:100%;height:100%;}
.price-tag{position:absolute;top:12px;right:12px;background:var(--gold);color:#5C3A1E;font-weight:800;font-size:13px;padding:6px 11px;border-radius:12px;transform:rotate(3deg);}
.post-body{padding:13px 14px 14px;}
.post-item{font-weight:700;font-size:15px;margin-bottom:2px;}
.post-store{font-size:12.5px;color:var(--royal-dark);font-weight:600;margin-bottom:6px;}
.post-caption{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:11px;}
.post-actions{display:flex;gap:16px;border-top:1px solid var(--line);padding-top:11px;}
.post-actions button{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--ink-soft);font-size:12.5px;font-weight:600;}
.post-actions svg{width:18px;height:18px;fill:none;stroke:currentColor;}
.post-actions button.liked svg{fill:var(--danger);stroke:var(--danger);color:var(--danger);}
.post-actions button.saved-t svg{fill:var(--gold);stroke:var(--gold);color:var(--gold);}
.comments-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.comment-row{display:flex;flex-wrap:wrap;column-gap:8px;row-gap:0;margin-bottom:9px;font-size:12.5px;}
.comment-row b{font-weight:700;}
.comment-row > span{flex:1;min-width:0;overflow-wrap:anywhere;}
.comment-row .c-acts{display:flex;flex:1 0 100%;justify-content:flex-end;margin:-10px -8px -9px 0;}
.comment-row .c-acts button{min-height:40px;padding:0 8px;background:none;border:none;font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
.comment-input-row{display:flex;gap:8px;margin-top:8px;}
.comment-input-row input{flex:1;border:1px solid var(--line);background:var(--cream);border-radius:var(--radius-pill);padding:9px 14px;font-size:13px;color:var(--ink);}
.comment-input-row button{background:var(--royal);color:#FFFFFF;border:none;border-radius:var(--radius-pill);padding:0 16px;font-weight:700;font-size:12.5px;}
.tab-row{display:flex;gap:2px;background:var(--cream-card);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:3px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;}
.tab-row button{flex:1 1 auto;border:none;background:none;padding:10px clamp(4px,2vw,12px);border-radius:var(--radius-pill);font-size:clamp(11px,3.1vw,12.5px);font-weight:700;color:var(--ink-soft);white-space:nowrap;}
.tab-row button.active{background:var(--royal);color:#FFFFFF;}
/* Admin tools tabs: one line that swipes sideways when it doesn't fit. The
   pill border sits on the wrapper so the edge fade never touches it. */
.tab-wrap{background:var(--cream-card);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:3px;margin-bottom:18px;}
.tab-wrap .tab-row{position:relative;background:none;border:none;padding:0;margin:0;-webkit-overflow-scrolling:touch;}
.tab-wrap .tab-row::-webkit-scrollbar{display:none;}
.tab-wrap .tab-row button{flex:1 0 auto;padding:10px 14px;min-height:40px;font-size:12.5px;}
.tab-wrap .tab-row.more-right{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent);}
.tab-wrap .tab-row.more-left{-webkit-mask-image:linear-gradient(to left,#000 82%,transparent);mask-image:linear-gradient(to left,#000 82%,transparent);}
.tab-wrap .tab-row.more-left.more-right{-webkit-mask-image:linear-gradient(to right,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(to right,transparent,#000 18%,#000 82%,transparent);}
.addr-search{position:relative;width:100%;}
.addr-search-input{width:100%;height:48px;box-sizing:border-box;border:1.5px solid var(--line-strong);background:var(--cream-card);border-radius:var(--radius-pill);padding:0 18px;font-family:var(--font-body);font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;}
.addr-search-input::placeholder{color:var(--ink-soft);}
.addr-search-input:focus{outline:none;border-color:var(--royal);}
.addr-search-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;background:var(--page-bg);border:1.5px solid var(--line-strong);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.14);}
.addr-search-item{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;padding:11px 16px;font-family:var(--font-body);cursor:pointer;}
.addr-search-item:hover,.addr-search-item:active{background:var(--cream-card);}
.addr-search-main{display:block;font-size:15px;font-weight:600;color:var(--ink);}
.addr-search-sub{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.addr-search-credit{padding:7px 16px;font-size:11px;color:var(--ink-soft);text-align:right;}
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 22px;}
.profile-avatar{width:78px;height:78px;border-radius:50%;background:var(--royal);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;font-family:var(--font-display);margin-bottom:12px;}
.profile-head h2{font-size:20px;margin-bottom:3px;}
.profile-head .pmeta{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
.profile-stats{display:flex;justify-content:space-between;gap:12px;margin-top:16px;background:var(--ink-block);border-radius:20px;padding:18px;width:100%;max-width:280px;}
.profile-stats div{text-align:center;flex:1;}
.profile-stats button{appearance:none;background:none;border:none;padding:0;margin:0;flex:1;min-height:40px;text-align:center;font:inherit;color:inherit;cursor:pointer;}
.profile-stats .pnum,.profile-stats .plbl{display:block;}
.profile-stats .pnum{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--on-ink-block);}
.profile-stats .pnum.gold{color:var(--gold);}
.profile-stats .plbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:5px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600;}
.settings-row svg{width:17px;height:17px;color:var(--ink-soft);}
.settings-row .sr-left{display:flex;align-items:center;gap:11px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--line-strong);background:var(--cream-card);border-radius:var(--radius-pill);padding:12px 16px;font-size:14.5px;color:var(--ink);}
.form-group textarea{resize:vertical;min-height:70px;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,21,42,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:var(--cream);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
.modal-sheet.center{border-radius:24px;margin:0 18px;max-height:80vh;}
.modal-handle{width:38px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 18px;opacity:.4;}
.modal-title{font-family:var(--font-display);font-size:21px;font-weight:600;margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--ink-soft);margin-bottom:18px;line-height:1.5;}
.photo-upload-box{border:2px dashed var(--line-strong);border-radius:22px;padding:26px;text-align:center;color:var(--ink-soft);margin-bottom:16px;position:relative;overflow:hidden;}
.photo-upload-box svg{width:26px;height:26px;margin-bottom:6px;}
.photo-upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo-preview{width:100%;height:160px;border-radius:22px;overflow:hidden;margin-bottom:14px;}
.photo-preview img{width:100%;height:100%;object-fit:cover;}
.toast{pointer-events:none;width:max-content;max-width:calc(100% - 40px);text-align:center;position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;z-index:200;box-shadow:none;}
.route-tag-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.admin-list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--cream-card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:10px;}
.admin-list-row > div:first-child{flex:1;min-width:0;}
.admin-list-row .ar-name{font-weight:700;font-size:14.5px;line-height:1.3;}
.admin-list-row .ar-name .badge-featured{display:inline-block;vertical-align:middle;}
.admin-list-row .ar-sub{font-size:12px;line-height:1.45;color:var(--ink-soft);margin-top:3px;}
.admin-list-row .ar-actions{display:flex;gap:6px;flex:none;}
.admin-list-row .ar-actions button:not(.btn){width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:center;}
.admin-list-row .ar-actions .btn{min-height:40px;white-space:nowrap;}
.admin-list-row .ar-actions svg{width:15px;height:15px;}
.badge-featured{background:var(--gold);color:#5C3A1E;font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;margin-left:6px;}
.hairline{height:1px;background:var(--line);margin:22px 0;border:none;}
.vote-block{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.follow-block{border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:18px;}
.follow-head{display:flex;align-items:center;justify-content:space-between;}
.follow-head .fh-text{font-size:13px;font-weight:600;}
.follow-head .fh-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.follow-btn{display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--cream);font-weight:700;font-size:12.5px;color:var(--ink);flex-shrink:0;}
.follow-btn.active{background:var(--royal);border-color:var(--royal);color:#FFFFFF;}
.follow-btn svg{width:14px;height:14px;}
.freq-row{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
.freq-chip{font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:var(--radius-pill);border:1px solid var(--line);background:var(--cream);color:var(--ink-soft);}
.freq-chip.active{background:var(--gold-tint);border-color:var(--gold);color:var(--royal-dark);}
.vote-btn{display:flex;align-items:center;gap:7px;padding:13px 16px;border-radius:var(--radius-pill);border:2px solid var(--line);background:transparent;font-family:var(--font-body);font-weight:700;font-size:13.5px;color:var(--ink);}
.vote-btn.active{background:var(--ink);border-color:var(--line-strong);color:var(--cream);}
.sale-card{background:var(--ink);color:var(--cream);border-radius:20px;padding:16px 17px;flex-shrink:0;width:220px;}
.sale-card .sale-date{font-size:10.5px;color:var(--gold);font-weight:700;margin-bottom:8px;}
.sale-card h3{color:var(--cream);font-size:15.5px;margin-bottom:5px;line-height:1.25;}
.sale-card p{font-size:11.5px;color:#C7C7D6;line-height:1.4;margin-bottom:6px;}
.open-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;}
.open-badge.open{background:#DCEEDC;color:#2E6B3E;}
.open-badge.closed{background:#F1E4E1;color:var(--danger);}
.sample-badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.02em;background:rgba(221,165,59,.22);color:var(--gold);padding:3px 8px;border-radius:8px;margin-top:2px;}
.neighborhood-card{background:var(--cream-card);border:1px solid var(--line);border-radius:22px;padding:16px;flex-shrink:0;width:160px;}
.neighborhood-card .nn{font-family:var(--font-display);font-weight:600;font-size:16px;margin-bottom:3px;}
.neighborhood-card .nc{font-size:11.5px;color:var(--ink-soft);}
.curated-route-card{background:var(--ink);color:var(--cream);border-radius:20px;padding:17px 18px;flex-shrink:0;width:230px;}
.curated-route-card .crc-tag{font-size:10.5px;color:var(--gold);font-weight:700;margin-bottom:8px;}
.curated-route-card h3{color:var(--cream);font-size:17px;margin-bottom:6px;}
.curated-route-card p{font-size:12px;color:#C7C7D6;line-height:1.4;margin-bottom:12px;}
.link-btn{background:none;border:none;color:var(--royal);font-weight:700;font-size:13px;padding:0;}
::selection{background:var(--gold-tint);}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}


/* =========================================================
   2ND STUDIO REDESIGN MARRIAGE
   Visual system adapted from the supplied Claude design file.
   Existing application logic and data remain intact.
   ========================================================= */
:root{
  --radius-card:20px;
  --radius-pill:999px;
}
.app-shell{max-width:430px;}
.topbar{padding:18px 20px 12px;}
.brand-mark{gap:0;min-width:190px;}
.brand-monogram{font-family:var(--font-display);font-style:italic;font-weight:700;font-optical-sizing:auto;font-synthesis:none;font-size:30px;line-height:1;letter-spacing:-.045em;text-transform:uppercase;color:var(--ink);}
.brand-rule{width:2px;height:25px;background:var(--royal);margin:0 12px;flex:none;}
.brand-name{font-family:var(--font-mono);font-size:8.5px;font-weight:500;letter-spacing:.24em;line-height:1.55;text-transform:uppercase;color:var(--ink);white-space:nowrap;}
.profile-bubble{width:36px;height:36px;border-radius:999px;border:none;background:var(--ink);color:var(--cream);font-family:var(--font-display);font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;}
main.view{padding:0 20px 116px;}
.bottom-nav{padding:10px 16px calc(16px + env(safe-area-inset-bottom));pointer-events:none;}
.bottom-nav-inner{max-width:398px;gap:4px;padding:7px;pointer-events:auto;}
:root[data-theme="dark"] .bottom-nav-inner{box-shadow:0 0 0 1px #4A424D, 0 8px 24px rgba(0,0,0,.45);}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bottom-nav-inner{box-shadow:0 0 0 1px #4A424D, 0 8px 24px rgba(0,0,0,.45);} }
.nav-item{padding:13px 4px;display:flex;gap:0;position:relative;color:#FFFFFF!important;}
.nav-item::after{display:none;}
.nav-item svg{display:block;width:20px;height:20px;flex:none;}
.nav-item.active{color:#221D24!important;}
.section{margin-top:32px;}
.section-head{margin-bottom:12px;}
.section-head h2,.design-eyebrow{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);}
.see-all{font-size:10.5px;}
.hero{padding:6px 0 18px;}
.hero .hero-tag{font-size:10px;margin-bottom:10px;}
.hero h1{font-size:40px;line-height:.97;font-weight:600;margin-bottom:14px;letter-spacing:-.03em;}
.hero p.sub{font-size:13.5px;line-height:1.55;max-width:34ch;margin-bottom:0;color:var(--body-text);}
.hero-btns{margin-top:0;gap:8px;}
.btn{border-radius:var(--radius-pill);box-shadow:none;}
.btn-primary{background:var(--ink);color:var(--cream);}
@media (hover:hover){.btn-primary:hover{background:var(--royal);}}
.btn-secondary-hero,.btn-outline{border:2px solid var(--ink);}
.btn-royal{background:var(--ink);color:var(--cream);}
@media (hover:hover){.btn-royal:hover{background:var(--royal);}}
/* The one colored call to action: "Build a route" on Home, in the brand terracotta. */
.btn-accent{background:var(--royal);color:#FFFFFF;}
@media (hover:hover){.btn-accent:hover{background:#B84A3E;}}
.btn-ghost{border:1.5px solid var(--line);background:transparent;}
.hscroll{gap:10px;margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px;}
.home-open-card{border:2px solid var(--ink);background:var(--cream);border-radius:20px;overflow:hidden;flex:none;width:238px;text-align:left;color:var(--ink);cursor:pointer;}
.home-open-card .store-photo{height:132px;}
.home-open-card .home-card-body{display:block;padding:12px 13px 14px;}
.home-open-card .home-card-name{display:block;font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.12;letter-spacing:-.015em;}
.home-open-card .home-card-meta{display:block;font-family:var(--font-mono);font-size:9.5px;color:var(--ink-soft);margin-top:5px;letter-spacing:.1em;text-transform:uppercase;}
.home-open-card .save-btn{width:32px;height:32px;top:10px;right:10px;}
.curated-route-card{border:1px solid var(--line);border-radius:20px;padding:18px;width:236px;min-height:164px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;box-shadow:none;background:var(--cream-card);color:var(--ink);}
.curated-route-card h3{font-size:21px;line-height:1.08;letter-spacing:-.02em;}
.curated-route-card p{font-size:12.5px;line-height:1.45;}
.neighborhood-card{border:none!important;border-radius:20px!important;padding:16px 15px!important;width:176px;min-height:88px;text-align:left;box-shadow:none;}
.neighborhood-card .nn{font-size:16px;}
.neighborhood-card .nc{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:inherit;opacity:.8;margin-top:4px;}
.search-wrap{margin:4px 0 14px;}
.search-wrap input{padding:15px 16px 15px 38px;border:2px solid var(--line);font-size:14px;}
.search-wrap svg{left:16px;width:16px;height:16px;}
.filter-row{gap:7px;margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px;}
.chip{border:1.5px solid var(--line);padding:9px 13px;font-size:10.5px;letter-spacing:.12em;}
.chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}
.discover-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.discover-count{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);text-align:right;}
.view-toggle{background:var(--ink-block);border:none;padding:5px;margin-bottom:18px;}
.view-toggle button{padding:11px 4px;color:rgba(255,255,255,.6);}
.view-toggle button.active{background:#FFFFFF;color:#221D24;}
.grid-stack{gap:9px;}
.grid-card{border:2px solid var(--ink);border-radius:20px;box-shadow:none;}
.grid-card .gc-photo{height:112px;}
.grid-card .gc-name{font-size:16px;}
.grid-card .gc-meta{font-size:9.5px;}
.open-badge{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:999px;}
.open-badge.open{background:var(--cream);color:var(--ink);}
.open-badge.closed{background:var(--ink);color:var(--cream);}
.discover-page .map-canvas{height:300px;}
.detail-photo{height:230px;border-radius:20px;margin-bottom:18px;}
.detail-title-row{margin-bottom:8px;}
.detail-title-row h1{font-size:30px;line-height:1.03;letter-spacing:-.03em;}
.rating-badge{background:var(--gold);color:#221D24;font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;border-radius:999px;padding:7px 10px;}
.detail-meta-line{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;}
.detail-cta-row{gap:8px;margin-bottom:18px;}
.detail-cta-row .btn{padding:16px 10px;font-size:14px;}
.detail-editorial{border-top:2px solid var(--ink);padding-top:14px;margin-bottom:16px;}

/* Brand guide compliance: flat colour, two radii, quiet metadata. */
.store-card,.stop-card,.modal-sheet,.modal-sheet.center,.photo-upload-box,.photo-preview,.admin-list-row,.follow-block,.sale-card,.route-summary-bar,.chain-toggle,.option-tile,.map-canvas,.profile-stats{border-radius:20px;box-shadow:none;}
.icon-btn,.save-btn,.back-fab,.profile-avatar,.avatar,.profile-bubble,.stop-num,.stop-actions button,.modal-handle,.wizard-progress span,.chain-toggle .ct-switch,.chain-toggle .ct-knob{border-radius:999px;}
.rating-badge,.price-tag,.badge-featured,.sample-badge,.open-badge,.stop-thumb,.option-tile .oi{border-radius:20px;}
.store-card,.post-card,.grid-card,.home-open-card{background:var(--cream);}
.store-meta,.gc-meta,.home-card-meta,.detail-meta-line,.post-head .pu-meta,.profile-head .pmeta,.route-summary-bar .rsb-lbl,.travel-line,.stop-info .smeta,.sale-date,.sample-badge,.open-badge,.badge-featured{font-family:var(--font-mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;}
.store-meta,.stop-info .smeta{font-size:9.5px;}
.store-desc,.post-caption,.info-block p{font-size:13.5px;line-height:1.55;color:var(--body-text);}
.store-name,.home-card-name,.gc-name,.stop-info .sname,.curated-route-card h3{font-family:var(--font-display);font-weight:600;font-size:17px;}
.btn{font-family:var(--font-body);font-size:14.5px;font-weight:700;}
.pill{font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;background:var(--cream-card);color:var(--ink);border:1px solid var(--line);}
.save-btn.saved svg{fill:#FFFFFF;stroke:#FFFFFF;}
.post-actions button.saved-t svg{fill:var(--royal);stroke:var(--royal);}
.grid-card .gc-rating svg{fill:currentColor;}
.store-meta svg{fill:currentColor!important;}
.price-tag{background:var(--cream);}
.curated-route-card .crc-tag{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--royal);}
.curated-route-card h3{color:var(--ink);}
.curated-route-card p{color:var(--body-text);}
.sale-card{background:var(--cream-card);color:var(--ink);border:1px solid var(--line);}
.sale-card h3{color:var(--ink);}
.sale-card p{color:var(--body-text);}
.sale-card .sale-date{color:var(--royal);}
.events-section{margin:22px 0 28px;padding:20px 0 22px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);}
.events-section .section-head{align-items:center;}
.events-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;}
.events-actions p{font-size:11.5px;line-height:1.45;color:var(--ink-soft);max-width:240px;}
.preview-note{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:11px;}
.preview-note::before{content:"";width:7px;height:7px;border-radius:999px;background:var(--gold);flex:none;}
.sale-card{appearance:none;text-align:left;font-family:var(--font-body);cursor:pointer;min-height:196px;display:flex;flex-direction:column;align-items:flex-start;}
.sale-card:hover{border-color:var(--ink);}
.sale-card .event-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%;margin-bottom:14px;}
.event-date-block{width:50px;min-height:54px;border-radius:14px;background:var(--ink-block);color:var(--on-ink-block);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none;}
.event-date-block .month{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
.event-date-block .day{font-family:var(--font-display);font-size:24px;font-weight:600;}
.event-type{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--royal);padding-top:3px;text-align:right;}
.sale-card h3{font-size:19px;line-height:1.08;letter-spacing:-.015em;margin-bottom:8px;}
.sale-card .event-location{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:7px;}
.sale-card .event-meta{font-size:11.5px;color:var(--ink-soft);margin-top:auto;padding-top:8px;}
.preview-badge{display:inline-flex;font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#221D24;border-radius:999px;padding:4px 7px;}
.events-page{padding-top:4px;}
.events-hero{padding:10px 0 20px;}
.events-hero h1{font-size:38px;line-height:.98;letter-spacing:-.035em;margin-bottom:10px;}
.events-hero p{font-size:13.5px;line-height:1.55;color:var(--body-text);max-width:34ch;}
.event-filter-row{display:flex;gap:7px;overflow-x:auto;margin:0 -20px 18px;padding:0 20px 7px;scrollbar-width:none;}
.event-filter-row::-webkit-scrollbar{display:none;}
.event-list{display:flex;flex-direction:column;gap:11px;}
.event-list-card{appearance:none;width:100%;border:1.5px solid var(--line);background:var(--cream-card);color:var(--ink);border-radius:20px;padding:15px;display:flex;gap:14px;text-align:left;font-family:var(--font-body);align-items:flex-start;}
.event-list-card:hover{border-color:var(--ink);}

.event-list-card h3{font-size:18px;line-height:1.12;margin:1px 0 6px;}

.event-list-card .event-list-meta{display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);line-height:1.5;}
.event-list-card .event-type{margin-left:auto;max-width:92px;}
.events-submit-card{margin-top:22px;background:var(--ink-block);color:var(--on-ink-block);border-radius:20px;padding:20px;}
.events-submit-card h3{color:var(--on-ink-block);font-size:21px;margin-bottom:7px;}
.events-submit-card p{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.72);margin-bottom:14px;}
.events-submit-card .btn{background:var(--gold);color:#221D24;}
.event-detail-date{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--royal);margin-bottom:8px;}

.event-detail-meta div{display:flex;gap:10px;font-size:13px;}
.event-detail-meta b{min-width:68px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding-top:3px;}
.form-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
.form-row .form-group{min-width:0;}
/* iPhone date and time boxes have a wide built-in minimum; keep them inside
   their half of a two-column row, the same height as the other fields. */
.form-group input[type="date"],.form-group input[type="time"]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;min-height:46px;text-align:left;}
.form-group input[type="date"]::-webkit-date-and-time-value,.form-group input[type="time"]::-webkit-date-and-time-value{text-align:left;}
.toast{box-shadow:none;}
[data-action="use-my-location"]{border-radius:999px!important;}
@media (min-width:700px){
  .app-shell{border-left:1px solid var(--line);border-right:1px solid var(--line);}
}

/* "Couldn't load" screen (weak signal at launch, or an outside library didn't download). */
.boot-state{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center;color:var(--ink);background:var(--page-bg);}
.boot-state h1{font-size:30px;line-height:1.05;letter-spacing:-.03em;}
.boot-state p{font-size:14px;line-height:1.55;color:var(--body-text);max-width:30ch;}
.boot-state .btn{min-width:180px;min-height:44px;margin-top:6px;}
/* The bot check couldn't download: a short note with Try again in its place. */
.captcha-failed{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 8px;font-size:12.5px;line-height:1.45;color:var(--body-text);text-align:center;}
.captcha-failed .link-btn{min-height:40px;padding:0 8px;}
/* One-time buttons while their request is running. */
.btn[aria-busy="true"],.link-btn[aria-busy="true"]{opacity:.65;cursor:default;}
.route-resume{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;background:var(--ink-block);color:var(--on-ink-block);border:none;border-radius:20px;padding:13px 15px;margin:0 0 16px;text-align:left;cursor:pointer;font-family:var(--font-body);}
.route-resume .rr-text{display:block;min-width:0;}
.route-resume .rr-eyebrow{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
.route-resume .rr-title{display:block;margin-top:4px;font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.route-resume .rr-sub{display:block;margin-top:2px;font-size:12.5px;opacity:.85;}
.route-resume .rr-go{flex-shrink:0;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--on-ink-block);border-radius:var(--radius-pill);padding:10px 14px;opacity:.9;}
.addr-search-off{width:100%;display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:18px;padding:8px 8px 8px 14px;font-size:13px;line-height:1.4;color:var(--ink-soft);}
.addr-search-off span{flex:1;min-width:0;}
.addr-search-off button{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:var(--radius-pill);border:1.5px solid var(--line-strong);background:transparent;color:var(--ink);font-family:var(--font-body);font-size:13px;font-weight:700;cursor:pointer;}
.addr-search-msg{padding:12px 16px;font-size:13px;line-height:1.4;color:var(--ink-soft);}
.map-pin button{position:relative;}
.map-pin button::after{content:"";position:absolute;inset:-5px;border-radius:50%;}
/* Route stops: fingertip-sized arrows, with Remove kept away from them. */
.stop-actions{gap:4px;flex-shrink:0;}
.stop-actions button{width:40px;height:40px;}
.stop-actions svg{width:16px;height:16px;}
.stop-actions button:disabled{opacity:.3;cursor:default;}
.stop-remove{display:inline-flex;align-items:center;gap:5px;min-height:40px;margin:-4px 0 -10px -2px;padding:0 12px 0 2px;background:none;border:none;font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
.stop-remove svg{width:11px;height:11px;}
/* The small × on stops you added in the builder: same look, 40px to tap. */
.manual-stop-x{position:relative;}
.manual-stop-x::after{content:"";position:absolute;inset:-10px;}
.route-empty{background:var(--cream-card);border:1px solid var(--line);border-radius:20px;padding:28px 18px;margin-bottom:16px;}
.route-empty-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.maps-web-note{font-size:12px;line-height:1.45;color:var(--ink-soft);text-align:center;margin:-4px 8px 12px;}
.add-stop-search input{width:100%;height:44px;box-sizing:border-box;border:1.5px solid var(--line-strong);border-radius:var(--radius-pill);padding:0 18px;font-family:var(--font-body);font-size:16px;background:var(--cream-card);color:var(--ink);-webkit-appearance:none;appearance:none;}
.add-stop-search input::placeholder{color:var(--ink-soft);}
.add-stop-search input:focus{outline:none;border-color:var(--royal);}
.route-start-note{display:block;font-size:12.5px;line-height:1.4;color:var(--on-ink-block);opacity:.8;margin-top:6px;}
/* Long links or unbroken words wrap inside find cards instead of spilling out. */
.post-head .post-who{min-width:0;}
.post-head .pu,.post-item,.post-store,.post-caption{overflow-wrap:anywhere;}
/* Post actions get full-height tap targets; Delete sits at the far right. */
.post-actions{align-items:center;padding-top:2px;}
.post-actions button{min-height:40px;}
.post-actions .post-del{margin-left:auto;font-size:12px;color:var(--danger-text);}
.finds-more{margin:4px 0 16px;}
/* Sheet title row with a close button that stays put while the sheet scrolls
   (top:-24px lines it up with the sheet's top edge, past its 24px padding). */
.sheet-head{position:sticky;top:-24px;z-index:3;display:flex;align-items:center;gap:12px;background:var(--cream);margin:-14px -6px 8px;padding:14px 6px 8px;}
.sheet-head .modal-title{flex:1;min-width:0;margin-bottom:0;}
.sheet-close{width:40px;height:40px;padding:0;}
.sheet-close svg{width:18px;height:18px;}
.ev-status{display:inline-flex;align-items:center;flex:none;font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border-radius:var(--radius-pill);padding:4px 9px;border:1px solid transparent;white-space:nowrap;}
.ev-status-live{background:var(--sage);color:var(--on-sage);}
.ev-status-pending{background:var(--gold-tint);color:var(--ink);}
.ev-status-declined{background:var(--royal-tint);color:var(--ink);}
.ev-status-muted{background:transparent;color:var(--ink-soft);border-color:var(--line);}
.my-event-subs{margin:24px 0 8px;}
.my-event-sub{appearance:none;width:100%;min-height:56px;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--cream-card);color:var(--ink);border-radius:18px;padding:12px 14px;margin-bottom:8px;text-align:left;font-family:var(--font-body);}
.my-event-sub .mes-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.my-event-sub .mes-title{font-weight:700;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

}

// neighborhood instead; the exact spot is still kept, so Google Maps starts
// from where you really are.
function routeStartPos(x){
  if(x.startCoords && !outsideGuideArea(x.startCoords)) return x.startCoords;
  return placeOf(x.start);
}
// The one time the app asks: the first open, right after "Before you start".
// After that, location is only used if it was allowed; iOS never asks again.
async function askLocationOnce(){
  let asked = false;
  try{ asked = localStorage.getItem("atlThrift_location_asked") === "1"; }catch(e){}
  const perm = await locationPermission();
  if(perm === "granted"){ refreshUserLocation(); return; }
  if(asked || perm === "denied") return;
  try{ localStorage.setItem("atlThrift_location_asked","1"); }catch(e){}
  const g = nativeGeo();
  if(g){
    try{ const p = await g.requestPermissions({permissions:["location"]}); if(p.location === "granted") refreshUserLocation(); }catch(e){}
  } else refreshUserLocation();
}
function locationOffToast(){
  toast("Location is off for ATL Thrift Guide. Turn it on in Settings → ATL Thrift Guide → Location.");
}
// A tap on "Near me" on Home.
async function useLocationForHome(){
  if(await locationPermission() === "denied"){ locationOffToast(); return; }
  const coords = await refreshUserLocation();
  if(!coords) toast("Couldn't get your location — try again in a moment.");
}
function milesFrom(coords, s){
  if(!coords || s.lat==null || s.lng==null) return Infinity;
  return milesBetween(coords, s);
}
// ---- Route math: real distances between real places ------------------------
// A place is a store (its own address), a neighborhood name (its center), or
// any {lat, lng}.
function placeOf(x){
  if(!x) return null;
  if(typeof x === "string"){ const n = NEIGHBORHOODS[x]; return n && n.lat!=null ? {lat:n.lat, lng:n.lng} : null; }
  if(x.lat!=null && x.lng!=null) return {lat:x.lat, lng:x.lng};
  if(x.neighborhood) return placeOf(x.neighborhood);
  return null;
}
// Straight-line miles between two places.
function milesBetween(a, b){
  const p = placeOf(a), q = placeOf(b);
  if(!p || !q) return 5;
  const toRad = d=>d*Math.PI/180;
  const dLat = toRad(q.lat-p.lat), dLng = toRad(q.lng-p.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(toRad(p.lat))*Math.cos(toRad(q.lat))*Math.sin(dLng/2)**2;
  return 3958.8*2*Math.asin(Math.sqrt(h));
}
// A rough drive time: roads wind about 30% more than a straight line, city
// streets average around 22 mph and longer hops use the highway, plus a few
// minutes to park. Stores in the same plaza are a 0-minute walk.
function driveMinutes(miles){
  if(miles < 0.15) return 0;
  const road = miles*1.3;
  const mph = road < 5 ? 22 : road < 15 ? 30 : 42;
  return Math.max(4, Math.round(road/mph*60 + 3));
}
// Open now, or opening within the next `mins` minutes today.
function openSoon(s, mins){
  if(isOpenNow(s)===true) return true;
  const rules = parseStoreHours(s.hours);
  if(!rules) return false;
  const { day, mins: m } = atlantaNow();
  return rules.some(r=>r.days.includes(day) && r.openMin > m && r.openMin <= m+mins);
}
// The shortest driving order for a handful of stops: tries every order (at
// most 8 stops, 40,320 orders) from the start, ending at the end point if
// there is one. Longer lists fall back to "nearest next".
function bestStopOrder(startPos, stops, endPos){
  const n = stops.length;
  if(n <= 1) return stops.slice();
  const pts = [startPos, ...stops, endPos];
  const d = pts.map(a=>pts.map(b=>(a && b) ? milesBetween(a,b) : 0));
  const E = n+1;
  if(n > 8){
    const left = stops.map((_,i)=>i+1), out = [];
    let cur = 0;
    while(left.length){ left.sort((a,b)=>d[cur][a]-d[cur][b]); cur = left.shift(); out.push(stops[cur-1]); }
    return out;
  }
  let best = null, bestLen = Infinity;
  const perm = stops.map((_,i)=>i+1), used = new Array(n+2).fill(false), cur = [];
  (function walk(prev, len){
    if(len >= bestLen) return;
    if(cur.length === n){
      const total = len + (endPos ? d[prev][E] : 0);
      if(total < bestLen){ bestLen = total; best = cur.slice(); }
      return;
    }
    for(const i of perm){ if(used[i]) continue; used[i] = true; cur.push(i); walk(i, len + d[prev][i]); cur.pop(); used[i] = false; }
  })(0, 0);
  return best.map(i=>stops[i-1]);
}
async function tryDetectLocation(manual){
  // Opening the route builder gets a fresh, high-accuracy fix every time,
  // unless you picked a start yourself. A precise fix from the last minute
  // is reused rather than asked for again.
  if(!manual && state.startPickedByUser) return;
  if(!manual && state.userCoordsPrecise && Date.now()-(state.userCoordsAt||0) < 60000){
    if(!state.locationDetected && applyStartLocation(state.userCoords)) renderList();
    return;
  }
  const perm = await locationPermission();
  if(perm === "denied"){ if(manual) locationOffToast(); return; }
  // In the iPhone app, opening the route builder only uses location that was
  // already allowed (iOS asked on the first open). Older installs without the
  // native location plugin fall back to the web view, which asks by itself.
  if(!manual && perm !== "granted" && nativeGeo()) return;
  const reqId = state.geoReqId = (state.geoReqId||0) + 1;
  let pos;
  try{ pos = await getPosition(true); }
  catch(err){
    if(manual && reqId === state.geoReqId) toast("Couldn't get your location — pick a starting point below.");
    return;
  }
  // A newer request, or a start the person picked while this one was
  // pending, wins over this answer.
  if(reqId !== state.geoReqId) return;
  setUserCoords(pos, true);
  if(!manual && state.startPickedByUser) return;
  if(applyStartLocation(state.userCoords)){
    if(manual){ state.startPickedByUser = false; toast(outsideGuideArea(state.userCoords) ? `You're outside the Atlanta area, so stops are planned from ${state.builderChoice.start}.` : "Starting from your location."); }
    renderList();
  }
}

// Whether you're signed in comes from the session saved on this phone; the
// server only confirms it. Returns false, and leaves everything as it was,
// when the server couldn't be reached, so a weak signal never looks like
// being signed out (or like losing Insider or admin).
async function refreshSessionAndProfile(){
  const failuresBefore = netFailures;
  const unreachable = (err, status) => netFailures !== failuresBefore || isNetworkError(err, status);
  const { data: sessionData, error: sessionErr } = await sb.auth.getSession();
  if(unreachable(sessionErr)) return false;
  if(!sessionData || !sessionData.session){ state.user = null; state.isAdmin = false; return true; }
  const { data:{ user }, error: userErr } = await sb.auth.getUser();
  if(unreachable(userErr)) return false;
  if(!user){ state.user = null; state.isAdmin = false; return true; }
  const [profileRes, adminRes, memberRes] = await Promise.all([
    sb.from("profiles").select("*").eq("id", user.id).single(),
    sb.rpc("is_admin"), sb.rpc("is_member")
  ]);
  if(unreachable(profileRes.error, profileRes.status) || unreachable(adminRes.error, adminRes.status) || unreachable(memberRes.error, memberRes.status)) return false;
  const profile = profileRes.data;
  const next = {
    id: user.id, email: user.email,
    username: profile?.username || user.email.split("@")[0],
    bio: profile?.bio || "", favCategory: profile?.fav_category || CATEGORIES[0],
    neighborhood: profile?.neighborhood || Object.keys(NEIGHBORHOODS)[0],
    avatarUrl: safeImageSrc(profile?.avatar_url) || "",
    homeStyle: profile?.home_style || null, homeArch: profile?.style_archetype_home || null,
    fashionStyle: profile?.fashion_style || null, fashionArch: profile?.style_archetype_fashion || null,
    styleDetails: profile?.style_details || {},
    followers:[], following:[] // not shown per your call to drop follower counts — kept as empty for any leftover UI references
  };
  // Admin and membership status come from private lists in Supabase,
  // which only the database can change (no passcodes in the app).
  const adminFlag = adminRes.data, memberFlag = memberRes.data;
  next.isAdmin = !!adminFlag;
  next.isMember = !!memberFlag || !!adminFlag;
  next.termsVersion = user.user_metadata?.terms_version || null;
  next.toursSeen = { member: !!user.user_metadata?.tour_member_seen, insider: !!user.user_metadata?.tour_insider_seen };
  state.user = next;
  state.isAdmin = next.isAdmin;
  return true;
}

// Supabase hands back at most 1,000 rows per request, so big tables are read
// a page at a time until a short page says there's nothing left. makeQuery
// must build a fresh, fully ordered query each time so pages don't overlap.
async function selectAllRows(makeQuery){
  const size = 1000, rows = [];
  for(let from = 0; from < 200000; from += size){
    let res;
    try{ res = await makeQuery().range(from, from + size - 1); }
    catch(err){ res = { data:null, error:err }; }
    if(res.error){ console.error("paged load stopped:", res.error.message); return { data: rows, error: res.error }; }
    const page = res.data || [];
    rows.push(...page);
    if(page.length < size) break;
  }
  return { data: rows, error: null };
}
// Find prices are dollars and cents from $0 to $100,000; anything else in the
// table (old rows, odd input) shows as $0 rather than "$-5" or "$1000000".
const FIND_PRICE_MAX = 100000;
function cleanFindPrice(value){
  const n = Number(value);
  if(!Number.isFinite(n) || n < 0 || n > FIND_PRICE_MAX) return 0;
  return Math.round(n*100)/100;
}
// "$12", "$12.50", "$1,200".
function formatFindPrice(value){
  const n = cleanFindPrice(value);
  const cents = Math.round(n*100) % 100 !== 0;
  return "$" + n.toLocaleString("en-US", {minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: 2});
}

// Vote totals per store as {store_id, up, down}, with no account ids. The
// database hands these out through store_vote_counts(); a database that
// doesn't have that function yet falls back to counting the table here.
async function loadStoreVoteCounts(){
  try{
    const res = await sb.rpc("store_vote_counts");
    if(!res.error) return (res.data||[]).map(r=>({ store_id:r.store_id, up:Number(r.up)||0, down:Number(r.down)||0 }));
    const old = await sb.from("store_votes").select("store_id,direction");
    const tally = {};
    (old.data||[]).forEach(v=>{
      if(v.direction!=="up" && v.direction!=="down") return;
      const t = tally[v.store_id] = tally[v.store_id] || { store_id:v.store_id, up:0, down:0 };
      t[v.direction]++;
    });
    return Object.values(tally);
  }catch(e){ return []; }
}

// Startup on a weak signal: anything that doesn't load shows "Couldn't load"
// with Try again (and retries by itself when the signal comes back), instead
// of an empty guide or looking signed out. The saved session is never touched.
const BOOT_TIMEOUT_MS = 15000;
let bootAttempt = 0;
let appBooted = false;   // the guide has loaded at least once
let bootFailed = false;  // the "Couldn't load" screen is up
let lastFreshAt = 0;     // when posts, events and your lists were last loaded
let bootInFlight = false; // an attempt is still loading (maybe slowly)
let bootStartedAt = 0;
// After this long an attempt counts as stuck, and Try again starts over.
const BOOT_STUCK_MS = 60000;
function showBootLoading(){
  const app = document.getElementById("app");
  if(app) app.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-body);color:var(--ink-soft)">Loading ATL Thrift Guide…</div>';
}
async function boot(){
  clearTimeout(window.__bootSlowTimer);
  const attempt = ++bootAttempt;
  bootInFlight = true; bootStartedAt = Date.now();
  appBooted = false; bootFailed = false;
  showBootLoading();
  loadUIPrefs();
  if(!sb){ bootInFlight = false; showBootError(); return; }
  // A request can hang on a weak signal; don't leave "Loading…" up forever.
  // If it finishes after all, the guide still replaces this screen.
  const slowTimer = setTimeout(()=>{ if(attempt === bootAttempt && !appBooted) showBootError(); }, BOOT_TIMEOUT_MS);
  const failuresBefore = netFailures;
  let ok = false;
  try{
    ok = await refreshSessionAndProfile();
    if(ok){
      const [storesOk] = await Promise.all([loadStores(), loadEvents(), loadPosts()]);
      if(storesOk) await loadMyData();
      ok = storesOk && netFailures === failuresBefore;
    }
  }catch(e){ console.error("boot failed:", e); ok = false; }
  clearTimeout(slowTimer);
  if(attempt !== bootAttempt) return; // Try again started a newer attempt
  bootInFlight = false;
  if(!ok){ showBootError(); return; }
  appBooted = true; bootFailed = false;
  lastFreshAt = Date.now();
  render();
  maybeStartMemberTour();
  loadOutdoorTemperature();
  // First open: the terms gate asks once it's accepted (acceptTerms). Anyone
  // who accepted on an earlier version gets the one-time ask here instead.
  if(hasAcceptedTerms()) askLocationOnce();
  checkUnreadFromTeam().then(()=>{ if(state.unreadFromTeam) renderList(); });
  syncTermsToAccount();
  savePendingStyleForSignedIn().then(saved=>{ if(saved && !userIsBusy()) renderList(); }).catch(()=>{});
}

function showBootError(){
  bootFailed = true; appBooted = false;
  const app = document.getElementById("app");
  if(!app) return;
  app.innerHTML = `<div class="boot-state" role="alert">
    <span class="brand-monogram" aria-hidden="true">ATG</span>
    <h1>Couldn't load</h1>

function retryBoot(){

// ---- Coming back to the app -------------------------------------------------
// iOS keeps the app alive in the background. Coming back after a few minutes
// refreshes new finds, events, your lists, the message badge and Insider
// status, and redraws so the date line and open/closed badges are current.
// Nothing reloads or redraws while a sheet is open or you're typing.
const REFRESH_AFTER_MS = 5*60*1000;
let refreshingOnReturn = false;
let returnRetryTimer = null;
function userIsBusy(){

function onAppReturn(){

}
// Waits (quietly) until you're done with whatever is open, then tries again.

async function refreshAfterAway(){
  if(refreshingOnReturn || !appBooted || !sb) return;
  if(userIsBusy()){ retryWhenFree(refreshAfterAway); return; }
  refreshingOnReturn = true;
  const KEEP = ["user","isAdmin","events","posts","likes","comments","blockedIds","storeVotes","storeFollows","savedStoreIds","visitedStoreIds","savedPostIds","savedRouteIds","userRoutes","visitNotes","myUserFollows","unreadFromTeam"];
  const before = {}; KEEP.forEach(k=>{ before[k] = state[k]; });
  const wasUserId = state.user ? state.user.id : null;
  const wasMember = !!(state.user && state.user.isMember);
  const failuresBefore = netFailures;
  try{
    if(!(await refreshSessionAndProfile())) return; // still no signal: keep what's showing
    if(wasUserId && !state.user){
      // The session ended while you were away. The sign-out path does the
      // rest (once, even if Supabase also reports it).
      state.user = before.user; state.isAdmin = before.isAdmin;
      setTimeout(async ()=>{ if(!state.user || signingOut) return; closeModal(); await resetToSignedOut(); toast("You've been signed out."); go("home"); }, 0);
      return;
    }
    const userId = state.user ? state.user.id : null;
    await Promise.all([loadEvents(), loadPosts(), loadMyData(), checkUnreadFromTeam()]);
    // Lost the signal partway through: put back what was showing.
    if(netFailures !== failuresBefore){ Object.assign(state, before); return; }
    // Signed in or out while this was loading: reload your lists for whoever it is now.
    if((state.user ? state.user.id : null) !== userId){ await loadMyData(); return; }
    lastFreshAt = Date.now();

    console.error("refresh failed:", e);
    Object.assign(state, before);
    return;
  }finally{ refreshingOnReturn = false; }
  redrawAfterRefresh(wasMember);
}
function redrawAfterRefresh(wasMember){
  if(userIsBusy()){ retryWhenFree(()=>redrawAfterRefresh(wasMember)); return; }

  // the next time it's drawn.
  // Keeps comments and messages you typed but haven't sent.
  if(!document.getElementById("gmap-canvas")) renderListKeepingDrafts();
  if(state.view==="messages" && state.user) loadThread(state.thread ? state.thread.userId : null);

}

  (async ()=>{
    try{
      // Weather only needs an approximate location. Rounded coordinates avoid
      // sending the user's precise position to the forecast service.
      const lat = Number(here.lat.toFixed(2));
      const lng = Number(here.lng.toFixed(2));
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m&temperature_unit=fahrenheit`;
      const response = await fetch(url);
      if(!response.ok) return;
      const weather = await response.json();
      const temperature = Number(weather?.current?.temperature_2m);
      if(!Number.isFinite(temperature)) return;

  })();

// ---- Screen history: Back returns to where you were ------------------------
// Each screen change adds a browser history entry (same address), so Back,
// and Safari's swipe-back, step through screens inside the app instead of
// leaving it. navStack keeps the last screens with their scroll spots, so
// coming back lands exactly where you left off.
const NAV_KEEP = 30;
let navStack = [];
let navIndex = 0;

function navKey(view, params){ return view + ":" + JSON.stringify(params||{}); }
function navHistoryState(){ return {atg:1, idx:navIndex, view:state.view, params:state.params}; }
// Remembers the current screen's scroll before leaving it. Some screens
// (the quiz) are opened without go(), so the view is refreshed here too.
function saveNavSpot(writeHistory){
  navStack[navIndex] = {view:state.view, params:state.params, scrollY:window.scrollY, rows:captureRowScroll(document.getElementById("view-root"))};
  if(writeHistory){ try{ history.replaceState(navHistoryState(), ""); }catch(e){} }
}
// The screen before this one, if the app opened it (null at the first screen).
function previousNavEntry(){ return navIndex > 0 ? (navStack[navIndex-1] || null) : null; }
function goBack(){
  let st = null; try{ st = history.state; }catch(e){}

  const prev = previousNavEntry();

// A shared store link (app.html?store=<id>) opens that store's page. The
// link is then tidied off the address so it isn't reopened later.
(function startNavHistory(){
  let url;
  try{
    const u = new URL(window.location.href);
    const id = u.searchParams.get("store");
    if(id && /^[A-Za-z0-9_-]{1,64}$/.test(id)){ state.view = "storeDetail"; state.params = {id}; }
    if(u.searchParams.has("store")){ u.searchParams.delete("store"); url = u.pathname + u.search + u.hash; }
  }catch(e){}
  try{ history.replaceState(navHistoryState(), "", url); }catch(e){}
  window.addEventListener("popstate", e=>{
    const st = e.state;
    if(!st || !st.atg) return;
    saveNavSpot(false); // so Forward comes back to the same spot
    // A swipe back while a sheet is open closes the sheet too (not the
    // terms gate or "Set a new password", which have to be finished).
    if(!navOwnBack && activeModal && activeModal.name !== "termsGate" && activeModal.name !== "setNewPassword") closeModal();
    navOwnBack = false;
    navIndex = st.idx;
    const saved = navStack[navIndex];
    go(saved ? saved.view : st.view, saved ? saved.params : st.params, true);
  });
})();

function go(view, params, fromHistory){

  if(view==="messages"){ state.thread = null; setTimeout(()=>loadThread((params||{}).userId || null), 0); }
  if(view==="admin" && state.isAdmin && (!state.adminTab || state.adminTab==="review")) setTimeout(loadAdminData, 0);
  const same = navKey(view, params) === navKey(state.view, state.params);
  state.view = view;
  state.params = params || {};
  const spot = fromHistory ? navStack[navIndex] : null;
  if(!fromHistory && !same){
    // A new screen: drop any "forward" screens and keep the list short.
    navIndex++;

const ALREADY_ON_AFTER_SIGN_IN = {

const votesInFlight = new Set();
async function toggleStoreVote(id, dir){
  requireAuth(async ()=>{
    if(votesInFlight.has(id)) return;
    votesInFlight.add(id);
    try{
    const u = state.user.id;
    const was = getStoreVotes(id).mine;
    // Skips the tally change if a refresh already loaded it from the database.
    const apply = (from, to) => {
      const v = getStoreVotes(id);
      if(v.mine !== from) return;
      if(from) v[from] = Math.max(0, v[from]-1);
      if(to) v[to]++;
      v.mine = to;
    };
    if(was===dir){
      const { error } = await sb.from("store_votes").delete().eq("user_id",u).eq("store_id",id);
      if(error){ toast("Couldn't remove that vote — try again."); return; }
      apply(was, null);
    } else {
      const { error } = await sb.from("store_votes").upsert({user_id:u, store_id:id, direction:dir});
      if(error){ toast("Couldn't record that vote — try again."); return; }
      apply(was, dir);
    }
    renderList();
    } finally { votesInFlight.delete(id); }
  });
}

// A curated route's stops, drive times and browse time, worked out the same
// way whether it's on its card or opened, so the card's time always matches.
const CURATED_BROWSE_MIN = 35;
function curatedRoutePlan(r){
  const ids = r.storeIds.filter(sid=>getStoreById(sid));
  const legs = [];
  let prev = ids.length ? getStoreById(ids[0]) : null;
  ids.forEach((sid,i)=>{
    if(i===0){ legs.push(0); return; }
    const s = getStoreById(sid);
    legs.push(driveMinutes(milesBetween(prev, s)));
    prev = s;
  });
  const totalTravel = legs.reduce((a,b)=>a+b,0);
  const totalBrowse = CURATED_BROWSE_MIN*ids.length;
  return {ids, legs, totalTravel, totalBrowse, totalTime: totalTravel+totalBrowse};
}
// "2h 20m", the same total the route shows once it's opened. Before the
// stores load, the hand-written label stands in.
function curatedTimeLabel(r){
  const p = curatedRoutePlan(r);
  if(!p.ids.length) return r.time;
  return `${Math.floor(p.totalTime/60)}h ${p.totalTime%60}m`;
}
function curatedStopCount(r){
  const n = r.storeIds.filter(sid=>getStoreById(sid)).length;
  return n || r.storeIds.length;
}

function eventDateValue(value){
  if(!value) return null;
  const parts = String(value).slice(0,10).split("-").map(Number);
  if(parts.length!==3 || parts.some(Number.isNaN)) return null;
  return new Date(parts[0],parts[1]-1,parts[2],12,0,0,0);
}
function eventDayParts(ev){
  const d = eventDateValue(ev.startDate);
  if(!d) return {month:"DATE",day:"TBD"};
  return {month:d.toLocaleDateString(undefined,{month:"short"}).toUpperCase(),day:String(d.getDate())};
}
function formatEventDate(ev){
  const start = eventDateValue(ev.startDate);
  const end = eventDateValue(ev.endDate || ev.startDate);
  if(!start) return ev.dateLabel || "Date to be announced";
  const startText = start.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if(!end || start.toDateString()===end.toDateString()) return startText;
  const endText = end.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  return `${startText} to ${endText}`;
}
function formatEventTime(value){
  const parts = /^(\d{1,2}):(\d{2})(?::\d{2})?$/.exec(String(value??"").trim());
  if(!parts) return "";
  const h = Number(parts[1]), m = Number(parts[2]);
  if(h>23 || m>59) return "";
  const d = new Date(2000,0,1,h,m);
  return d.toLocaleTimeString(undefined,{hour:"numeric",minute:m?"2-digit":undefined});
}
function eventTimeRange(ev){
  const start = formatEventTime(ev.startTime);
  const end = formatEventTime(ev.endTime);
  return start && end ? `${start} to ${end}` : (start || end || "Time to be announced");
}

// address is shown too (addressShown), a venue the address already starts
// with isn't repeated.
function eventLocation(ev, addressShown){
  const store = ev.linkedStoreId ? getStoreById(ev.linkedStoreId) : null;
  const repeats = addressShown && ev.venue && ev.address && ev.address.toLowerCase().startsWith(ev.venue.toLowerCase());
  if(repeats) return "";
  return ev.venue || (store ? escapeHtml(store.name) : (addressShown && ev.address ? "" : "Atlanta"));
}
function getUpcomingEvents(){
  const today = new Date(); today.setHours(0,0,0,0);
  const source = EVENTS_PREVIEW_MODE ? SAMPLE_EVENTS : state.events;
  return source.filter(ev=>{
    if(ev.status && ev.status!=="published") return false;
    const end = eventDateValue(ev.endDate || ev.startDate);
    return !end || end >= today;
  }).sort((a,b)=>{
    const ad=eventDateValue(a.startDate), bd=eventDateValue(b.startDate);
    if(!ad && !bd) return 0;
    if(!ad) return 1;
    if(!bd) return -1;
    return ad-bd;
  });
}
// "This weekend" is Friday through Sunday, local time. From Friday to Sunday
// it means the weekend you're in; Monday to Thursday, the one coming up.
function isThisWeekend(ev){
  const start = eventDateValue(ev.startDate), end = eventDateValue(ev.endDate || ev.startDate);
  if(!start || !end) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const day = today.getDay();
  const friday = new Date(today);
  friday.setDate(today.getDate() + (day===0 ? -2 : 5-day));
  const sundayEnd = new Date(friday); sundayEnd.setDate(friday.getDate()+2); sundayEnd.setHours(23,59,59,999);
  return start<=sundayEnd && end>=friday;
}
function filterEvents(events, filter){
  if(filter==="This weekend") return events.filter(isThisWeekend);
  if(filter==="Markets") return events.filter(ev=>/market|flea/i.test(ev.eventType||""));
  if(filter==="Sales") return events.filter(ev=>/sale/i.test(ev.eventType||""));
  if(filter==="Swaps") return events.filter(ev=>/swap/i.test(ev.eventType||""));
  return events;
}

function eventStatusInfo(ev, forAdmin){

// Address search box with our own suggestion list underneath, fed by Google
