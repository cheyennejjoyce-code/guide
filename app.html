    const q = qs[i]; if(!q) return;
    if(q.tot){ q.tot.forEach((pair,j)=>{ const side = pair[p[j]]; if(!side) return; for(const k in side[1]) rows.push({k, q:"This or that", a:side[0], pts:side[1][k]*(q.w||1)}); }); }
    else { const o = q.options[p]; if(!o) return; for(const k in o[1]) rows.push({k, q:q.q, a:o[0], pts:o[1][k]*(q.w||1)}); }
  });
  return (r.dna||[]).map(([k],i)=>({ k, rows: rows.filter(x=>x.k===k).sort((a,b)=>b.pts-a.pts).slice(0, i===0 ? 5 : 3) }));

function scoreStyle(kind, picks){

  const sum = top.reduce((t,k)=>t+sc[k],0) || 1;
  // Percentages: the winner takes whatever rounding leaves over, so it always shows highest.
  const dna = top.map((k,i)=>[k, i===0 ? 0 : Math.floor(sc[k]/sum*100)]);

}
function scoreArchetype(answers){

}

// Pending results are kept per quiz kind, so a guest who takes both the

// Each pending copy also notes who it belongs to (a member's id, or null for
// a guest), when it was made, and which app session made it. A member's own

// On a shared phone, a result someone took signed out only goes to the

// Saves run one at a time, so a slow save can't land after a newer one and

async function pickQuizAnswer(i){

// A second tap while the card is being made (or the share sheet is up)
// would start another share, which the phone rejects with an error.
let sharingStyleCard = false;
async function shareStyleResult(){
  const r = state.quiz && state.quiz.result; if(!r || sharingStyleCard) return;
  sharingStyleCard = true;
  toast("Creating your style card…");
  try{
    const blob = await buildStyleImage(r);
    // Inside the iPhone app, share through the native layer: the share
    // sheet then previews the actual card instead of a generic PNG icon.
    const cap = window.Capacitor;
    if(cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Filesystem && cap.Plugins.Share){
      try{
        const b64 = await new Promise((res, rej)=>{ const fr = new FileReader(); fr.onload = ()=>res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
        const written = await cap.Plugins.Filesystem.writeFile({ path:"my-thrift-style.png", data:b64, directory:"CACHE" });
        await cap.Plugins.Share.share({ files:[written.uri] });
        return;
      }catch(err){ if(err && /cancel/i.test(err.message||"")) return; /* else fall through to the web share */ }
    }
    const file = new File([blob], "my-thrift-style.png", { type:"image/png" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"My thrift style", text:`I'm ${styleTitle(r.kind,r.style,r.arch)}. What's your thrift style? atlthriftguide.com` });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "my-thrift-style.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast("Your style card was saved.");
  }catch(err){ if(err && err.name !== "AbortError") toast("Couldn't create the image — try again."); }
  finally{ sharingStyleCard = false; }
}

async function submitLoginInner(){
  const mode = state.authMode || "signin";
  const email = document.getElementById("login-email").value.trim().toLowerCase();
  const password = document.getElementById("login-password").value;

  if(mode === "signup"){
    const username = cleanUsername(document.getElementById("login-username").value);
    if(!username || !email || !password){ toast("Fill in username, email, and password."); return; }
    if(!USERNAME_RULE.test(username)){ toast("Usernames are 3–20 letters, numbers, periods, or underscores."); return; }
    if(RESERVED_USERNAME.test(username)){ toast("That username is reserved — try another."); return; }
    if(!document.getElementById("signup-agree")?.checked){ toast("Please agree to the Terms of Service and Privacy Policy."); return; }
    if(!/^\S+@\S+\.\S+$/.test(email)){ toast("Enter a valid email address."); return; }
    const pwError = validatePassword(password);
    if(pwError){ toast(pwError); return; }
    const { data: taken } = await sb.rpc("username_taken", { name: username });
    if(taken){ toast("That username is already taken."); return; }
    const captchaToken = await getCaptchaToken();
    const { data, error } = await sb.auth.signUp({ email, password, options:{ captchaToken, data:{ username, terms_version: TERMS_VERSION, terms_accepted_at: new Date().toISOString() } } });
    resetTurnstile();
    if(error){ toast(authErrorMessage(error, error.message || "Couldn't create your account — try again.")); return; }
    // Supabase quietly "succeeds" for an email that already has an account
    // (it returns a user with no identities). Tell them and switch to sign in.
    if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0){
      state.authMode = "signin";
      renderModal();
      const emailField = document.getElementById("login-email");
      if(emailField) emailField.value = email;
      const pwField = document.getElementById("login-password");
      if(pwField) pwField.value = password;
      toast("An account with this email already exists. Sign in instead.");
      return;
    }
    if(data && data.session){
      // Email confirmation is switched off in Supabase, so they're in right away.
      await finishAuth("Account created — welcome, @{u}!");
      return;
    }
    // Email confirmation is on: they need the code we just emailed.
    state.verifyEmail = email;
    openModal("verifyEmail");
  } else {
    if(!email || !password){ toast("Enter your email and password."); return; }
    const captchaToken = await getCaptchaToken();
    const { error } = await sb.auth.signInWithPassword({ email, password, options:{ captchaToken } });
    resetTurnstile();
    if(error){
      // No signal, too many tries, or the bot check get their own words, so
      // a right password is never called wrong.
      const other = authErrorMessage(error, null);
      if(other){ toast(other); return; }
      if(error.code === "email_not_confirmed" || /confirm/i.test(error.message||"")){
        state.verifyEmail = email;
        const sent = await sendSignupCode(email);
        openModal("verifyEmail");
        if(sent) toast("Confirm your email first — we sent you a new code.");
        return;
      }
      if(error.code === "invalid_credentials" || /invalid login credentials/i.test(error.message||"")){ toast("Incorrect email or password."); return; }
      toast("Couldn't sign you in — try again.");
      return;
    }
    await finishAuth("Signed in as @{u}");
  }
}

let deletingAccount = false;
async function deleteMyAccount(){
  if(!state.user || deletingAccount) return;
  const typed = (document.getElementById("delete-confirm")?.value||"").trim().toUpperCase();
  if(typed !== "DELETE"){ toast("Type DELETE to confirm."); return; }
  deletingAccount = true;
  try{
    // 1. Remove their uploaded find photos and event flyers (their own
    //    folders only), through Storage so the files themselves are deleted.
    const folder = state.user.id;
    for(const bucket of ["post-photos", "event-flyers"]){
      for(let round=0; round<20; round++){
        const { data: files, error: listErr } = await sb.storage.from(bucket).list(folder, { limit: 100 });
        if(listErr || !files || !files.length) break;
        const paths = files.filter(f=>f.name).map(f=>`${folder}/${f.name}`);
        if(!paths.length) break;
        const { error: rmErr } = await sb.storage.from(bucket).remove(paths);
        if(rmErr){ console.error(bucket + " cleanup failed:", rmErr.message); break; }
      }
    }
    // 2. Delete the account; everything else is cleaned up by the database.
    const { error } = await sb.rpc("delete_my_account");
    if(error){ console.error("delete account failed:", error.message); toast("Couldn't delete your account — try again."); return; }
    signingOut = true;
    try{
      try{ await sb.auth.signOut(); }catch(e){}
      closeModal();
      await resetToSignedOut();
    } finally { signingOut = false; }
    toast("Your account has been deleted.");
    go("home");
  } finally {
    deletingAccount = false;
  }
}

// Today's date as YYYY-MM-DD in local time, to compare with event dates.
function localTodayIso(){
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}
// Dates must be real calendar days and times real clock times. An event
// can't end before it starts, and a one-day event can't end before (or
// right at) its start time. Returns what to fix, or null when it's fine.
function eventDateTimeProblem({startDate, endDate, startTime, endTime}){
  const realDate = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v||""); if(!m) return false; const y = +m[1], mo = +m[2], d = +m[3]; const dt = new Date(y, mo-1, d); return y>=2000 && y<=new Date().getFullYear()+2 && dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d; };
  const realTime = v => !v || /^([01]?\d|2[0-3]):[0-5]\d(:[0-5]\d)?$/.test(v);
  const minutes = v => { const [h, m] = String(v).split(":").map(Number); return h*60 + m; };
  if(!realDate(startDate)) return "Check the start date.";
  const end = endDate || startDate;
  if(!realDate(end)) return "Check the end date.";
  if(end < startDate) return "The end date can't be before the start date.";
  if(!realTime(startTime)) return "Check the start time.";
  if(!realTime(endTime)) return "Check the end time.";
  if(startTime && endTime && end===startDate && minutes(endTime) <= minutes(startTime)) return "The end time has to be after the start time.";
  return null;
}

function instagramHandleToUrl(v){
  const t = String(v||"").trim();
  const m = /^@?([A-Za-z0-9_](?:[A-Za-z0-9_.]{0,28}[A-Za-z0-9_])?)$/.exec(t);

}

// Shrinks a phone photo to a reasonable size before upload (max 1600px, JPEG).
function compressImageToBlob(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, (maxDim||1600) / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b ? resolve(b) : reject(new Error("compress failed")), "image/jpeg", quality||0.82);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

let adminPlacePickSeq = 0;
async function initAdminStoreAutocomplete(){
  const container = document.getElementById("as-google-container");
  if(!container || container.dataset.ready) return;
  if(!(window.google && window.google.maps)){ loadGoogleMapsScript(); return; }
  const input = await mountAddressSearch(container, {
    placeholder: "Search for the store on Google",
    fields: ["id","displayName","formattedAddress","location","rating","userRatingCount","nationalPhoneNumber","websiteURI","regularOpeningHours"],
    onSelect: async (place)=>{
      const status = document.getElementById("as-google-status");
      const pick = ++adminPlacePickSeq; // a later pick wins over a slow earlier one
      try{
        const set = (id, v)=>{ if(pick !== adminPlacePickSeq) return; const el = document.getElementById(id); if(el && v!=null && v!=="") el.value = v; };
        // A different listing was picked: forget the old listing's Google-only
        // data first. Phone and website stay unless Google has a replacement.
        if((document.getElementById("as-place")?.value || "") !== place.id){
          ["as-photo","as-rating","as-reviews"].forEach(id=>{ const el = document.getElementById(id); if(el) el.value = ""; });
        }
        // The guide's own name ("Goodwill – Buckhead"), website and phone are
        // kept; Google's only fill empty boxes. A different Google name is
        // offered underneath instead.
        const setIfEmpty = (id, v)=>{ const el = document.getElementById(id); if(el && !el.value.trim()) set(id, v); };
        setIfEmpty("as-name", place.displayName); set("as-addr", place.formattedAddress);
        setIfEmpty("as-phone", place.nationalPhoneNumber); setIfEmpty("as-web", place.websiteURI ? String(place.websiteURI).replace(/^https?:\/\//,"").replace(/\/$/,"") : null);
        adminShowGoogleNameHint(place.displayName);
        const hrs = place.regularOpeningHours && place.regularOpeningHours.weekdayDescriptions;
        const compactHrs = hrs && hrs.length ? googleHoursToCompact(hrs) : null;
        if(compactHrs) set("as-hours", compactHrs);
        const hoursNote = hrs && hrs.length && !compactHrs ? " — couldn't read Google's hours, check the Hours field" : "";
        set("as-place", place.id); if(place.location){ set("as-lat", place.location.lat()); set("as-lng", place.location.lng()); }
        set("as-rating", place.rating); set("as-reviews", place.userRatingCount);
        if(status) status.textContent = "✓ Linked to Google — fetching photo…" + hoursNote;
        // Photo names come from Places API (New); the app's photo endpoint serves them.
        try{
          const r = await fetch(`https://places.googleapis.com/v1/places/${encodeURIComponent(place.id)}?fields=photos&key=${GOOGLE_MAPS_JS_KEY}`, { headers: { "X-Goog-FieldMask":"photos" } });
          const j = r.ok ? await r.json() : null;
          const name = j && j.photos && j.photos[0] && j.photos[0].name;
          if(pick !== adminPlacePickSeq) return;
          if(name) set("as-photo", name);
          if(status) status.textContent = (name ? "✓ Linked to Google, photo found" : "✓ Linked to Google (no photo available)") + hoursNote;
        }catch(e){ if(status) status.textContent = "✓ Linked to Google (photo lookup failed)" + hoursNote; }
      }catch(e){ console.error("google lookup failed", e); if(status) status.textContent = "Couldn't read that place — fill the fields by hand."; }
    }
  });

    const lat = parseFloat(val("as-lat")), lng = parseFloat(val("as-lng"));
    if(!isNaN(lat) && !isNaN(lng)){ row.store_lat = lat; row.store_lng = lng; }
    const rating = parseFloat(val("as-rating")); row.google_rating = isNaN(rating) ? null : rating;
    const reviews = parseInt(val("as-reviews"),10); row.google_review_count = isNaN(reviews) ? null : reviews;
    row.google_photo_name = val("as-photo") || null;
  }
  let error;
  if(id){ ({ error } = await sb.from("stores").update(row).eq("id", id)); }
  else { row.id = "s" + Date.now().toString(36); row.featured = false; ({ error } = await sb.from("stores").insert(row)); }
  if(error){ console.error("store save failed:", error.message); toast("Couldn't save that store — check the fields and try again."); return; }
  closeModal();
  if(!id && placeId && state.admin && state.admin.scan) state.admin.scan.results = state.admin.scan.results.filter(x=>x.id!==placeId);
  await loadStores(); toast(id ? "Store updated." : "Store added."); renderList();
}

document.body.addEventListener("click", handleClick);

// Search boxes re-render the list once typing pauses (not on every key),
// and never in the middle of an IME composition or dictation, which a
// re-render would wipe out. That also keeps the map from being rebuilt on
// every keystroke.
let searchRenderTimer = null;
// Mid-word on a composing keyboard (Android, Japanese, dictation) the box
// itself can't be replaced, so only the results under it are redrawn.
function renderSearchResultsOnly(resultsId){
  const box = document.getElementById(resultsId);
  if(!box) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = renderView();
  const fresh = tmp.querySelector("#"+resultsId);
  if(!fresh) return;
  const rows = captureRowScroll(box);
  box.innerHTML = fresh.innerHTML;
  restoreRowScroll(box, rows);
  renderGoogleMapIfNeeded();
}
function scheduleSearchRender(selector, resultsId, composing){
  clearTimeout(searchRenderTimer);
  searchRenderTimer = setTimeout(()=>{
    const cur = document.querySelector(selector);
    if(composing || (cur && cur.dataset && cur.dataset.composing === "1")){ renderSearchResultsOnly(resultsId); return; }
    const hadFocus = !!cur && document.activeElement === cur;
    const pos = cur ? cur.selectionStart : null;
    renderList();
    if(!hadFocus) return;
    const again = document.querySelector(selector);
    if(again && document.activeElement !== again){ again.focus(); try{ if(pos!=null) again.setSelectionRange(pos,pos); }catch(err){} }
  }, 180);
}
function handleSearchTyping(e){
  const t = e.target; if(!t) return;
  if(t.dataset && t.dataset.action === "search-input"){
    state.searchQuery = t.value;
    scheduleSearchRender('[data-action="search-input"]', "discover-results", !!e.isComposing);
  } else if(t.id === "admin-store-search"){
    state.adminStoreQuery = t.value;
    scheduleSearchRender("#admin-store-search", "admin-store-results", !!e.isComposing);
  }
}
document.addEventListener("input", handleSearchTyping);
document.addEventListener("compositionstart", e=>{ if(e.target && e.target.dataset) e.target.dataset.composing = "1"; });
document.addEventListener("compositionend", e=>{ if(e.target && e.target.dataset){ delete e.target.dataset.composing; handleSearchTyping(e); } });
function attachModalHandlers(){
  renderTurnstile();
  const unameInput = document.getElementById("login-username");
  if(unameInput) unameInput.addEventListener("input", onUsernameInput);
  const codeInput = document.getElementById("verify-code");
  if(codeInput) codeInput.addEventListener("keydown", e=>{ if(e.key==="Enter") submitVerifyCode(); });
  const flyerInput = document.getElementById("es-flyer");
  if(flyerInput){
    flyerInput.addEventListener("change", async e=>{
      const file = e.target.files[0];
      if(!file) return;
      // A newer pick, Remove flyer, or a different form wins over this one.
      const pick = ++flyerPickSeq, form = activeModal;
      const current = () => pick === flyerPickSeq && activeModal === form;
      try{
        const blob = await compressImageToBlob(file, 1600, 0.82);
        if(!current()) return;
        pendingFlyerBlob = blob;
        if(pendingFlyerPreviewUrl){ try{ URL.revokeObjectURL(pendingFlyerPreviewUrl); }catch(err){} }
        pendingFlyerPreviewUrl = URL.createObjectURL(blob);
        const preview = document.getElementById("es-flyer-preview");
        if(preview) preview.innerHTML = flyerPreviewHtml(pendingFlyerPreviewUrl);
      }catch(err){
        if(!current()) return;
        // Nothing is attached now, so don't leave an earlier preview showing.
        clearPendingFlyer();
        toast("Couldn't read that image. Try a different one.");
      }
    });
  }
  const photoInput = document.getElementById("sf-photo");
  if(photoInput){
    photoInput.addEventListener("change", async e=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        // Re-draws the photo as a fresh, smaller JPEG, which also strips
        // hidden data like the GPS location of where it was taken.
        pendingFindPhotoData = await compressImageToBlob(file, 1600, 0.82);
        document.getElementById("sf-preview").innerHTML = `<div class="photo-preview"><img src="${URL.createObjectURL(pendingFindPhotoData)}"></div>`;
      }catch(err){
        pendingFindPhotoData = null;
        toast("Couldn't read that image — try a different one.");
      }
    });
  }
  const avatarInput = document.getElementById("ep-avatar");
  if(avatarInput){
    avatarInput.addEventListener("change", async e=>{
      const file = e.target.files[0];
      if(!file) return;
      let small;
      try{ small = await blobToDataURL(await compressImageToBlob(file, 400, 0.85)); }
      catch(err){ toast("Couldn't read that image — try a different one."); return; }
      {
        pendingAvatarData = small;
        document.getElementById("ep-avatar-preview").innerHTML = `<div style="width:84px;height:84px;border-radius:50%;overflow:hidden;margin:0 auto"><img src="${pendingAvatarData}" style="width:100%;height:100%;object-fit:cover"></div>`;
      }
    });
  }
}
// Enter in any comment box posts the comment, wherever the box was rendered.
// Enter in a search box just closes the keyboard; results are already showing.
document.addEventListener("keydown", e=>{
  // Skip held-key repeats and the Enter that confirms an Asian-language
  // keyboard's word choice (isComposing / keyCode 229).
  if(e.key==="Enter" && !e.repeat && !e.isComposing && e.keyCode!==229 && e.target && e.target.dataset && e.target.dataset.commentInput){
    e.preventDefault();
    submitComment(e.target.dataset.commentInput);
  } else if(e.key==="Enter" && !e.isComposing && e.keyCode!==229 && e.target && (e.target.dataset?.action==="search-input" || e.target.id==="admin-store-search")){
    e.preventDefault();
    e.target.blur();
  }
});

boot();
</script>
