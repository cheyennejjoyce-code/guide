const ATL_BOUNDS = {north:34.25, south:33.55, east:-83.95, west:-84.75};
async function mountAddressSearch(container, {placeholder="Search for an address", fields=["displayName","formattedAddress","location"], onSelect}){
  let places;
  try{
    places = (google.maps.places && google.maps.places.AutocompleteSuggestion) ? google.maps.places : await google.maps.importLibrary("places");
  }catch(e){ return null; }
  const {AutocompleteSuggestion, AutocompleteSessionToken} = places;
  if(!AutocompleteSuggestion) return null;

  container.innerHTML = `<div class="addr-search">
      <input type="text" class="addr-search-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="${escapeHtml(placeholder)}">
      <div class="addr-search-list" role="listbox" hidden></div>
    </div>`;
  const input = container.querySelector(".addr-search-input");
  const list = container.querySelector(".addr-search-list");
  let token = new AutocompleteSessionToken();
  let suggestions = [], timer = null, requestId = 0;

  const close = ()=>{ list.hidden = true; list.innerHTML = ""; suggestions = []; };
  const render = ()=>{
    if(!suggestions.length){ close(); return; }
    list.innerHTML = suggestions.map((sg,i)=>{
      const pr = sg.placePrediction;
      const main = pr.mainText ? pr.mainText.text : pr.text.text;
      const sub = pr.secondaryText ? pr.secondaryText.text : "";
      return `<button type="button" class="addr-search-item" role="option" data-i="${i}"><span class="addr-search-main">${escapeHtml(main)}</span>${sub ? `<span class="addr-search-sub">${escapeHtml(sub)}</span>` : ""}</button>`;
    }).join("") + `<div class="addr-search-credit">Powered by Google</div>`;
    list.hidden = false;
  };
  const search = async ()=>{
    const q = input.value.trim();
    const mine = ++requestId;
    if(q.length < 2){ close(); return; }
    try{
      const res = await AutocompleteSuggestion.fetchAutocompleteSuggestions({input: q, locationBias: ATL_BOUNDS, includedRegionCodes: ["us"], sessionToken: token});
      if(mine !== requestId) return; // a newer keystroke already asked again
      suggestions = (res.suggestions || []).filter(sg=>sg.placePrediction).slice(0, 5);
      render();
    }catch(e){
      console.error("address search failed", e);
      // Say so instead of quietly showing nothing.
      if(mine === requestId){ suggestions = []; list.innerHTML = `<div class="addr-search-msg">Couldn't load suggestions. Check your connection and try again.</div>`; list.hidden = false; }
    }
  };
  const choose = async (i)=>{
    const sg = suggestions[i]; if(!sg) return;
    const pr = sg.placePrediction;
    if(pr.text) input.value = pr.text.text;
    close(); input.blur();
    try{
      const place = pr.toPlace();
      await place.fetchFields({fields});
      token = new AutocompleteSessionToken();
      await onSelect(place);
    }catch(e){ console.error("place lookup failed", e); }
  };

  input.addEventListener("focus", ()=>{ if(suggestions.length) list.hidden = false; });
  input.addEventListener("blur", ()=>{ setTimeout(()=>{ list.hidden = true; }, 200); });
  input.addEventListener("keydown", e=>{
    if(e.key === "Enter"){ e.preventDefault(); if(suggestions.length) choose(0); }
    else if(e.key === "Escape"){ close(); }
  });
  // Keep focus in the box while pressing a suggestion, so blur doesn't hide the list first.
  list.addEventListener("pointerdown", e=>{ if(e.target.closest(".addr-search-item")) e.preventDefault(); });
  list.addEventListener("click", e=>{
    const item = e.target.closest(".addr-search-item");
    if(item) choose(Number(item.dataset.i));
  });
  return input;
}

async function lookUpTypedDestination(text){
  try{
    const places = (google.maps.places && google.maps.places.AutocompleteSuggestion) ? google.maps.places : await google.maps.importLibrary("places");
    const res = await places.AutocompleteSuggestion.fetchAutocompleteSuggestions({input: text, locationBias: ATL_BOUNDS, includedRegionCodes: ["us"], sessionToken: new places.AutocompleteSessionToken()});
    const sg = (res.suggestions || []).find(x=>x.placePrediction);
    if(!sg) return false;
    const place = sg.placePrediction.toPlace();
    await place.fetchFields({fields: ["displayName","formattedAddress","location"]});
    if(!place.location) return false;
    // Same as picking it from the list.
    const c = state.builderChoice;
    c.destinationAddress = place.formattedAddress;
    c.destinationName = place.displayName;
    c.destinationCoords = {lat: place.location.lat(), lng: place.location.lng()};
    c.destination = null;
    c.destTyped = "";
    state.showDestinationPicker = false;
    return true;
  }catch(e){ console.error("end address lookup failed", e); return false; }
}

// Same Google address search as the route builder, used on the
// "Submit an event" form. If Google can't load, the plain text box that
// was there first simply stays, so people can still type an address.
async function initEventAddressAutocomplete(){
  const container = document.getElementById("es-address-container");
  if(!container || container.dataset.ready || container.dataset.mounting) return;
  if(!(window.google && window.google.maps)){ loadGoogleMapsScript(); return; }
  // Whatever was already typed in the plain box carries over to the search box
  // that replaces it, so a slow Google load never wipes it.
  const fallback = document.getElementById("es-address-fallback");
  let fallbackFocused = !!fallback && document.activeElement === fallback;
  if(fallback){ fallback.addEventListener("focus", ()=>{ fallbackFocused = true; }); fallback.addEventListener("blur", ()=>{ fallbackFocused = false; }); }
  container.dataset.mounting = "1";
  const input = await mountAddressSearch(container, {
    placeholder: "Event address",
    fields: ["displayName","formattedAddress"],
    onSelect: (place)=>{
      const hidden = document.getElementById("es-address");
      if(hidden) hidden.value = place.formattedAddress || "";
      // Handy extra: if the venue box is empty, fill it with the place's name.
      const venue = document.getElementById("es-venue");
      if(venue && !venue.value.trim() && place.displayName && place.displayName !== place.formattedAddress){
        venue.value = place.displayName;
      }
    }
  });
  delete container.dataset.mounting;
  if(!input) return;
  container.dataset.ready = "1";
  const typed = fallback ? fallback.value : "";
  if(typed && !input.value){
    input.value = typed;
    if(fallbackFocused){ try{ input.focus(); input.setSelectionRange(typed.length, typed.length); }catch(e){} }
  }
  // Typing after a pick means the earlier pick no longer applies; the typed
  // text is what gets sent unless a new suggestion is picked.
  input.addEventListener("input", ()=>{ const h = document.getElementById("es-address"); if(h) h.value = ""; });
}

// Next and Back in the route builder. A double tap moves one step, not two,
// and an end address you typed but didn't pick is looked up before Next.
let builderLookingUp = false;
async function wizardStep(dir){
  if(routeTapTooSoon("wizard") || builderLookingUp) return;
  if(dir > 0 && state.builderStep === 0){
    const typed = typedDestinationText();
    if(typed){
      builderLookingUp = true;
      let found = false;
      try{ found = await lookUpTypedDestination(typed); }
      finally{ builderLookingUp = false; }
      // You may have moved on while Google answered.
      if(state.view !== "route" || state.builderStep !== 0) return;
      if(!found){ toast("Pick an end address from the list, or clear the box."); return; }
      const c = state.builderChoice;
      toast(`Ending at ${c.destinationName || c.destinationAddress}.`);
    }
  }
  state.builderStep = Math.max(0, Math.min(3, state.builderStep + dir));
  renderList();
}
// A route that starts from your location is built from where you are right
// now: if the last fix is more than two minutes old (or wasn't a precise
// one), get a fresh high-accuracy fix first.
let buildingRoute = false;
async function buildRouteFromHere(){
  if(buildingRoute) return;
  const c = state.builderChoice;
  const fromHere = state.locationDetected && !state.startPickedByUser && c.startCoords;
  buildingRoute = true;
  try{
    if(fromHere && (!state.userCoordsPrecise || Date.now()-(state.userCoordsAt||0) > 120000)){
      toast("Getting your exact location…");
      try{ setUserCoords(await getPosition(true), true); applyStartLocation(state.userCoords); }
      catch(e){ /* no fresh fix: build from the last known spot */ }
    }
    generateRoute();
  } finally { buildingRoute = false; }
}
// How long each trip length can run, driving and shopping together.
const ROUTE_TIME_BUDGET = {"2 hours":120, "Half day":240, "Full day":420};
// How good a shop is, for choosing between shops that are all convenient:
// its Google rating, how many people reviewed it, and the Verified stamp.
// Shops that are open (or opening within the hour) win over ones whose
// hours we can't read, and those win over closed ones.
function storeQuality(s){
  let q = (s.rating || 4) + 0.15*Math.log10(1 + (s.reviewCount || 0)) + (s.verified ? 0.15 : 0);
  if(!openSoon(s, 60)) q -= isOpenNow(s)===null ? 0.6 : 3;
  return q;
}
// Picks `want` stops. With an end point: shops that are on the way (adding
// under about a mile, a little more on long trips) count as equally
// convenient, and the trip is split into stretches from start to finish
// with the best shop in each, so stops spread along the whole drive instead
// of bunching at one end. Without an end point: the best shops among the
// closest ones, each mile away costing a little.
// `seen` holds shops already shown (Shuffle stops); they're used again only
// when nothing else fits. `preferred` marks shops that match every filter.
function pickRouteStops(cands, want, startPos, endPos, seen, preferred){
  if(want <= 0) return [];
  const out = [];
  // Chains can repeat (several Goodwills is fine); "Independent shops only"
  // already leaves them out when that's what you want.
  const score = s => storeQuality(s) - (seen.has(s.id) ? 10 : 0) - (preferred && !preferred.has(s.id) ? 20 : 0);
  if(endPos){
    const direct = milesBetween(startPos, endPos);
    const detour = s => milesBetween(startPos, s) + milesBetween(s, endPos) - direct;
    // How far along the trip a shop sits: 0 at the start, 1 at the end.
    const kx = Math.cos(startPos.lat*Math.PI/180);
    const vx = (endPos.lng-startPos.lng)*kx, vy = endPos.lat-startPos.lat, len2 = (vx*vx + vy*vy) || 1e-9;
    const along = s => Math.min(1, Math.max(0, ((s.lng-startPos.lng)*kx*vx + (s.lat-startPos.lat)*vy)/len2));
    let limit = Math.max(1, 0.12*direct), onWay = [];
    for(;;){
      onWay = cands.filter(s=>detour(s) <= limit);
      if(onWay.length >= want || limit > 8) break;
      limit *= 1.5;
    }
    if(onWay.length < want) onWay = cands.slice().sort((a,b)=>detour(a)-detour(b)).slice(0, want);
    const better = (a,b)=>score(b)-score(a) || detour(a)-detour(b);
    for(let i=0;i<want;i++){
      const lo = i/want, hi = (i+1)/want;
      const stretch = onWay.filter(s=>!out.includes(s)).filter(s=>{ const t = along(s); return t >= lo && (t < hi || (i === want-1 && t <= 1)); });
      if(stretch.length) out.push(stretch.sort(better)[0]);
    }
    // A stretch with no shop: the best remaining on-the-way shops fill in.
    while(out.length < want){
      const rest = onWay.filter(s=>!out.includes(s)).sort(better);
      if(!rest.length) break;
      out.push(rest[0]);
    }
  } else {
    const near = cands.slice().sort((a,b)=>milesBetween(startPos,a)-milesBetween(startPos,b)).slice(0, Math.max(want*3, 8));
    const value = s => score(s) - 0.25*milesBetween(startPos, s);
    while(out.length < want){
      const rest = near.filter(s=>!out.includes(s)).sort((a,b)=>value(b)-value(a));
      if(!rest.length) break;
      out.push(rest[0]);
    }
  }
  return out;
}
// "Shuffle stops": the same trip with a different set of good shops. Shops
// already shown are used again only when nothing else fits, and your own
// hand-picked stops always stay.
function shuffleRoute(){
  const r = state.currentRoute;
  if(!r || !r.createdFrom || r.curated) return;
  const seen = [...new Set([...(r.shuffleSeen||[]), ...r.stops])];
  const before = JSON.stringify(r.stops.slice().sort());
  state.builderChoice = Object.assign({}, r.createdFrom);
  generateRoute({seen});
  const now = state.currentRoute;
  if(JSON.stringify(now.stops.slice().sort()) === before){
    now.shuffleSeen = [];
    toast("That's every good combo for this trip, so here it is again.");
  } else now.shuffleSeen = seen;
}
function generateRoute(opts){
  const c = state.builderChoice;
  const budget = c.budget||[], minRating = c.minRating||0;
  const count = c.time==="2 hours"?2 : c.time==="Half day"?4 : 6;
  // Real places: your exact location (or the center of the neighborhood you
  // picked), each store's own address, and the end point if there is one.
  // From outside the Atlanta area, drive times start at the closest
  // neighborhood (routeStartPos).
  const startPos = routeStartPos(c) || ATLANTA_CENTER;
  const endPos = c.destinationCoords || placeOf(c.destination) || null;
  const direct = endPos ? milesBetween(startPos, endPos) : 0;
  // How far out of the way a store is: its distance from the start, or with
  // an end point, the extra driving it adds on the way there.
  const costOf = s => endPos ? milesBetween(startPos,s) + milesBetween(s,endPos) - direct : milesBetween(startPos,s);
  // Shops that are open (or opening within the hour) come first, then ones
  // whose hours we can't read, then closed ones; closest first within each.
  const openRank = s => openSoon(s, 60) ? 0 : isOpenNow(s)===null ? 1 : 2;
  // Stops the person added by hand come first and are never dropped; they
  // fill slots, so they aren't counted again as filter matches below.
  const manualIds = c.manualStores||[];
  const manual = manualIds.map(id=>getStoreById(id)).filter(Boolean);
  const pool = state.stores.filter(s=>{
    if(manualIds.includes(s.id)) return false;
    if(state.hideChains && s.chain) return false;
    if(c.categories.length && !c.categories.some(cat=>s.categories.includes(cat))) return false;
    return true;
  }).map(s=>({s, cost:costOf(s), rank:openRank(s)}))
    .sort((a,b)=>a.rank-b.rank || a.cost-b.cost)
    .map(x=>x.s);
  const passes = s => (!budget.length || budget.includes(s.priceLevel))
    && (!minRating || (s.rating||0) >= minRating);
  // Only shops that match every choice you made: no padding with shops
  // below your minimum rating or outside your budget.
  const matching = pool.filter(passes);
  // Closed shops are left out whenever enough open ones match (open now or
  // opening within the hour); late at night, when most are closed, all count.
  const openMatching = matching.filter(s=>isOpenNow(s)!==false || openSoon(s, 60));
  const candidates = openMatching.length >= Math.max(1, count - manual.length) ? openMatching : matching;
  state.routeFilterNote = null;
  const wantNew = Math.max(0, count - manual.length);
  const browseMin = c.time==="2 hours"?40 : c.time==="Half day"?35 : 30;
  // The whole trip, driving plus shopping, has to fit the time you picked.
  const budgetMin = ROUTE_TIME_BUDGET[c.time] || 240;
  const tripMinutes = list => {
    let prev = startPos, t = 0;
    list.forEach(s=>{ t += driveMinutes(milesBetween(prev, s)); prev = s; });
    if(endPos) t += driveMinutes(milesBetween(prev, endPos));
    return t + browseMin*list.length;
  };
  let ordered = bestStopOrder(startPos, manual.concat(pickRouteStops(candidates, wantNew, startPos, endPos, new Set((opts && opts.seen) || []))), endPos);
  // Too long: drop the shop whose removal saves the most time (never one you
  // added yourself) until the trip fits...
  while(tripMinutes(ordered) > budgetMin){
    const droppable = ordered.filter(s=>!manualIds.includes(s.id));
    if(!droppable.length) break;
    let best = null, bestT = Infinity;
    droppable.forEach(s=>{ const rest = bestStopOrder(startPos, ordered.filter(x=>x!==s), endPos); const t = tripMinutes(rest); if(t < bestT){ bestT = t; best = rest; } });
    ordered = best;
  }
  // ...then fill any open slots with the best shops that still fit, each
  // extra minute of driving counting against a shop.
  while(ordered.length < manual.length + wantNew){
    const now = tripMinutes(ordered);
    let pick = null, pickVal = -Infinity;
    candidates.forEach(s=>{
      if(ordered.includes(s)) return;
      const trial = bestStopOrder(startPos, ordered.concat([s]), endPos);
      const t = tripMinutes(trial);
      if(t > budgetMin) return;
      const val = storeQuality(s) - (t - now)/20;
      if(val > pickVal){ pickVal = val; pick = trial; }
    });
    if(!pick) break;
    ordered = pick;
  }
  const timeLabel = c.time==="2 hours" ? "2 hours" : c.time==="Half day" ? "a half day" : "a full day";
  // Nothing fits: say so instead of building a route that doesn't work.
  if(!ordered.length){
    const tips = [];
    if(c.time !== "Full day") tips.push("a longer time");
    if(minRating) tips.push("a lower minimum rating");
    if(budget.length) tips.push("another budget");
    if(c.categories.length) tips.push("fewer categories");
    if(state.hideChains) tips.push("turning off Independent shops only");
    if(endPos) tips.push("a closer end point");
    const tryThese = tips.length > 1 ? tips.slice(0,-1).join(", ")+", or "+tips[tips.length-1] : tips[0];
    state.routeBuildError = { key: JSON.stringify(c), msg: `We couldn't fit a good route into ${timeLabel} with these choices.${tryThese ? " Try "+tryThese+"." : ""}` };
    toast("We couldn't fit a good route with these choices.");
    renderList();
    return;
  }
  state.routeBuildError = null;
  if(tripMinutes(ordered) > budgetMin){
    const t = tripMinutes(ordered);
    state.routeFilterNote = `Your own stops take about ${Math.floor(t/60)}h ${t%60}m, more than ${timeLabel}.`;
  } else if(ordered.length < manual.length + wantNew){
    state.routeFilterNote = `Only ${ordered.length} ${ordered.length===1?"stop fits":"stops fit"} ${timeLabel} with these choices. For more stops, pick a longer time or loosen your filters.`;
  }
  // Say so when a stop isn't open right now, so nobody drives to a locked door.
  const closed = ordered.filter(s=>isOpenNow(s)===false && !openSoon(s, 60));
  const closedNote = !closed.length ? "" : closed.length===ordered.length
    ? "These shops are closed right now, so check their hours before you go."
    : `${closed.map(s=>s.name).join(", ")} ${closed.length===1?"is":"are"} closed right now, so check ${closed.length===1?"its":"their"} hours before you go.`;
  const outsideNote = (c.startCoords && outsideGuideArea(c.startCoords))
    ? `You're starting outside the Atlanta area, so drive times start from ${c.start}. Google Maps will start from where you are.` : "";
  const legs = [];
  let prev = startPos, totalTravel = 0;
  ordered.forEach(s=>{
    const mins = driveMinutes(milesBetween(prev, s));
    legs.push(mins);
    totalTravel += mins;
    prev = s;
  });
  if(endPos) totalTravel += driveMinutes(milesBetween(prev, endPos));
  const totalBrowse = browseMin * ordered.length;
  state.currentRoute = {
    id: uid("route_"),
    title: `Your ${c.time} thrift route`,
    start: c.start,
    startCoords: c.startCoords || null,
    destination: c.destination || null,
    destinationAddress: c.destinationAddress || null,
    destinationName: c.destinationName || null,
    destinationCoords: c.destinationCoords || null,
    stops: ordered.map(s=>s.id),
    legs,
    totalTravel,
    totalBrowse,
    totalTime: totalTravel + totalBrowse,
    createdFrom: Object.assign({}, c),
    filterNote: [outsideNote, state.routeFilterNote, closedNote].filter(Boolean).join(" ") || null
  };
  go("routeResults");
}

      </div>

// Every stop removed: no map full of every store, no 0-stop route to save or
// share, just a way to add a stop or start over.
function routeEmptyView(r){
  return `
    <div style="margin-top:8px">

        <p>Add a stop to keep this route going, or start over.</p>
        <div class="route-empty-actions">
          <button class="btn btn-primary" data-action="open-add-stop">${ICONS.plus}Add a stop</button>
          <button class="btn btn-outline" data-action="route-start-over">Start over</button>
        </div>
      </div>
    </div>
  `;
}
// "Start over": a curated route comes back the way it was written; your own
// route goes back to the first question of the builder.
function routeStartOver(){
  const r = state.currentRoute;
  if(r && r.curatedId){ loadCuratedRoute(r.curatedId); return; }
  state.builderStep = 0;
  go("route");
}
// The route maps, minus the "You are here" dot when you're far outside the
// Atlanta area; otherwise the map would center on you, with no stores in view.
function routeMap(list){
  const html = discoverMap(list);
  // The anchors are {here, hereLabel, end, fitHere}: drop only the far-away
  // dot and keep the End pin.
  const a = __pendingMapUserCoords;
  if(a && a.here && outsideGuideArea(a.here)) __pendingMapUserCoords = Object.assign({}, a, {here:null});
  return html;
}
// Google Maps holds 9 stops between start and end in its app, but its
// website on a phone holds only 3. Without the app, say so instead of
// letting the extra stops vanish.
function mapsWebNote(r){
  const stores = r.stops.map(id=>getStoreById(id)).filter(Boolean);
  const between = Math.min(9, (r.destination || r.destinationCoords) ? stores.length : stores.length - 1);
  return between > 3 ? `<p class="maps-web-note">No Google Maps app? Google's website may show only 3 of the ${between} stops in between.</p>` : "";
}

// The Finds feed shows 10 at a time; "Show more finds" adds the next 10
// without redrawing the ones already on screen.
const FINDS_PAGE_SIZE = 10;
function communityFeedPosts(){
  let posts = [...state.posts].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const f = state.communityFilter;
  if(f && f!=="All"){
    if(f==="Under $10") posts = posts.filter(p=>p.price<10);
    else if(f==="Under $25") posts = posts.filter(p=>p.price<25);
    else posts = posts.filter(p=>p.category===f);
  }
  return posts;
}
function findsShownCount(){ return Math.max(FINDS_PAGE_SIZE, state.findsShown||0); }
function findsMoreHtml(left){
  return left > 0 ? `<button class="btn btn-outline btn-block finds-more" id="finds-more" data-action="finds-show-more">Show more finds</button>` : "";
}
function showMoreFinds(){
  const posts = communityFeedPosts();
  const before = findsShownCount();
  state.findsShown = before + FINDS_PAGE_SIZE;
  const feed = document.getElementById("finds-feed");
  const more = document.getElementById("finds-more");
  if(!feed || !more){ renderListKeepingDrafts(); return; }
  feed.insertAdjacentHTML("beforeend", posts.slice(before, state.findsShown).map(p=>postCard(p)).join(""));
  more.outerHTML = findsMoreHtml(posts.length - state.findsShown);
}
function viewCommunity(){
  const filterOpts = ["All","Clothing","Furniture","Home Decor","Vintage","Designer","Under $10","Under $25"];
  const posts = communityFeedPosts();
  const f = state.communityFilter;
  const shown = findsShownCount();
  return `
    <div style="margin-top:16px" id="community-top">
      <div class="section-head" style="align-items:flex-end;margin-bottom:16px"><h2 style="font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1.03;letter-spacing:-.03em;text-transform:none;color:var(--ink)">Finds</h2>
        <button class="btn btn-primary btn-sm" data-action="open-share-find">Share a find</button>
      </div>
      <div class="filter-row">
        ${filterOpts.map(o=>`<button class="chip ${f===o?'active':''}" data-action="set-community-filter" data-f="${o}">${o}</button>`).join("")}
      </div>
      <div id="finds-feed">${posts.slice(0, shown).map(p=>postCard(p)).join("")}</div>
      ${findsMoreHtml(posts.length - shown)}
    </div>
  `;
}

// Following members doesn't lead anywhere yet (no Following feed or member
// pages), so the Follow (+) button stays hidden until it does. The code behind
// it (toggleFollowUser) is kept for then.
const SHOW_FOLLOW_BUTTON = false;
function postCard(p){
  const store = getStoreById(p.store);
  const likes = state.likes[p.id] || [];
  const liked = state.user && likes.includes(state.user.id);
  const comments = (state.comments[p.id] || []).filter(c=>!state.blockedIds.includes(c.userId));
  const own = !!(state.user && p.userId===state.user.id);
  return `
  <div class="post-card">
    <div class="post-head">
      ${avatarHtml(p.user)}
      <div class="post-who" style="flex:1">
        <div class="pu">@${p.user}</div>
        <div class="pu-meta">${timeAgo(p.date)}</div>
      </div>
      ${!SHOW_FOLLOW_BUTTON || own ? "" : `<button class="icon-btn" style="width:32px;height:32px${state.myUserFollows.includes(p.userId)?';background:var(--ink);color:var(--cream)':''}" data-action="follow-user" data-uid="${p.userId}" data-u="${p.user}" aria-label="${state.myUserFollows.includes(p.userId)?'Unfollow':'Follow'}">${state.myUserFollows.includes(p.userId)?ICONS.check:ICONS.plus}</button>`}
    </div>
    <div class="post-photo">${postPhotoHtml(p)}<span class="price-tag">${formatFindPrice(p.price)}</span></div>
    <div class="post-body">
      <div class="post-item">${p.item}</div>
      ${store ? `<button class="post-store" data-action="open-store" data-id="${store.id}" style="background:none;border:none;padding:0;cursor:pointer">Found at ${store.name}</button>` : ''}
      ${p.caption ? `<div class="post-caption">${p.caption}</div>` : ''}
      <div class="post-actions">
        <button class="${liked?'liked':''}" data-action="like-post" data-id="${p.id}">${ICONS.heart}${likes.length}</button>
        <button data-action="toggle-comments" data-id="${p.id}">${ICONS.comment}${comments.length}</button>
        <button data-action="share-post" data-id="${p.id}">${ICONS.share}</button>
        ${state.isAdmin || own ? "" : `<button data-action="open-report" data-type="post" data-id="${p.id}" data-uid="${p.userId||""}" data-uname="${p.user}" style="margin-left:auto;font-size:12px;color:var(--ink-soft)">Report</button>`}
        ${own ? `<button class="post-del" data-action="delete-own-post" data-id="${p.id}" aria-label="Delete this find">Delete</button>` : ""}
        ${state.isAdmin && !own ? `<button data-action="admin-remove-post" data-id="${p.id}" style="font-size:12px;color:var(--danger-text)">Remove</button>` : ""}
      </div>
      <div class="comments-box" id="comments-${p.id}" style="display:${state.openComments===p.id?'block':'none'}">
        ${comments.map(c=>commentRow(c,p)).join("") || `<div class="comment-row" style="color:var(--ink-soft)">No comments yet.</div>`}
        <div class="comment-input-row">
          <input type="text" placeholder="Add a comment" maxlength="1000" data-comment-input="${p.id}">
          <button data-action="add-comment" data-id="${p.id}">Post</button>
        </div>
      </div>
    </div>
  </div>`;
}
// Comment text and names are already HTML-safe in state. Others' comments get
// Report (not for admins, like posts); the author, the find's owner and admins get Delete.
function commentRow(c, p){
  const mine = !!(state.user && c.userId===state.user.id);
  const canReport = !!(state.user && c.id && !mine && !state.isAdmin);
  const canDelete = !!(state.user && c.id && (mine || p.userId===state.user.id || state.isAdmin));
  const acts = (canReport ? `<button data-action="open-report" data-type="comment" data-id="${escapeHtml(c.id)}" data-uid="${escapeHtml(c.userId||"")}" data-uname="${c.user}" aria-label="Report this comment">Report</button>` : "")
    + (canDelete ? `<button data-action="delete-comment" data-id="${escapeHtml(c.id)}" aria-label="Delete this comment">Delete</button>` : "");
  return `<div class="comment-row"><b>@${c.user}</b><span>${c.text}</span>${acts ? `<div class="c-acts">${acts}</div>` : ""}</div>`;
}
function findComment(id){
  for(const k in state.comments){ const c = state.comments[k].find(x=>x.id===String(id)); if(c) return c; }
  return null;
}

function safeImageSrc(v){
  if(!v) return null;
  if(/^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+$/i.test(v)) return v;
  if(/^https:\/\/[^\s"'<>]+$/i.test(v)) return v;
  return null;
}
function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{ const r = new FileReader(); r.onload = ()=>resolve(r.result); r.onerror = reject; r.readAsDataURL(blob); });
}
function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
}
// The reverse, for text that leaves the page as plain text (share sheet,
// toasts) after being stored HTML-safe.
function decodeHtml(value){
  return String(value??"").replace(/&(amp|lt|gt|quot|#039);/g, (m,k)=>({amp:"&",lt:"<",gt:">",quot:'"',"#039":"'"}[k]));
}
function noteDateLabel(value){
  if(!value) return "Visit date not added";
  const parts=String(value).slice(0,10).split("-").map(Number);
  const d=new Date(parts[0],parts[1]-1,parts[2],12);
  return d.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
}

function viewProfileLibrary(){
  if(!state.user) return viewProfile();
  const tab=state.profileLibraryTab||"notes";
  let content="";

    const notes=state.visitNotes.slice().sort((a,b)=>new Date(b.visitedAt)-new Date(a.visitedAt));
    content=`${notes.length?`<div class="note-list">${notes.map(visitNoteCard).join("")}</div>`:`<div class="empty-state"><h3>No shop notes yet</h3><p>Add private notes about stores you have explored.</p></div>`}<button class="btn btn-primary btn-block" style="margin-top:16px" data-action="open-visit-note">Add a shop note</button>`;
  }else if(tab==="stores"){
    const stores=state.savedStoreIds.map(getStoreById).filter(Boolean);
    content=stores.length?`<div class="note-list">${stores.map(compactProfileStore).join("")}</div>`:`<div class="empty-state"><h3>No saved shops yet</h3><p>Bookmark a shop to keep it here.</p></div>`;

    const voteOf = id=>{ const v=state.storeVotes[id]; return !v ? "" : v.mine==="up" ? "Worth it" : v.mine==="down" ? "Not lately" : ""; };
    const ids=[...new Set([...state.visitedStoreIds, ...state.stores.filter(st=>voteOf(st.id)).map(st=>st.id)])];
    const stores=ids.map(getStoreById).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
    content=stores.length?`<div class="note-list">${stores.map(st=>compactProfileStore(st, voteOf(st.id))).join("")}</div>`:`<div class="empty-state"><h3>No visited stores yet</h3><p>Tap Mark as visited on a store page and it will show up here.</p></div>`;
  }else if(tab==="routes"){
    const routes=state.userRoutes.filter(r=>state.savedRouteIds.includes(r.id));
    content=routes.length?`<div class="note-list">${routes.map(profileRouteCard).join("")}</div>`:state.user.isMember?`<div class="empty-state"><h3>No saved routes yet</h3><p>Build a route, then tap Save route to keep it here.</p><button class="btn btn-ghost btn-sm" style="margin-top:12px" data-action="nav" data-view="route">Build a route</button></div>`:`<div class="empty-state"><h3>No saved routes yet</h3><p>Saving routes comes with ATL Guide Insider.</p><button class="btn btn-ghost btn-sm" style="margin-top:12px" data-action="open-membership">See Insider perks</button></div>`;
  }else if(tab==="votes"){
    const mine = state.stores.filter(st=>{ const v=state.storeVotes[st.id]; return v && !!v.mine; });
    const yes = mine.filter(st=>state.storeVotes[st.id].mine==="up");
    const no = mine.filter(st=>state.storeVotes[st.id].mine==="down");
    const sect = (label, arr) => arr.length?`<div style="font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--royal);margin:18px 0 10px">${label}</div><div class="note-list">${arr.map(compactProfileStore).join("")}</div>`:"";
    content = mine.length ? sect("Still worth the trip", yes)+sect("Not lately", no) : `<div class="empty-state"><h3>No votes yet</h3><p>Answer "Still worth the trip?" on a store page and it will be collected here.</p></div>`;
  }else{
    const finds=getLikedFinds();
    content=finds.length?finds.map(postCard).join(""):`<div class="empty-state"><h3>No liked finds yet</h3><p>Like a community find and it will appear here.</p></div>`;
  }
  const heads={
    notes:["Shop Notes","Your private notes from store visits."],
    visited:["Visited Stores","Stores you\u2019ve been to, with your \u201cStill worth the trip?\u201d answer."],
    stores:["Saved Shops","Shops you saved to revisit."],
    routes:["Saved Routes","Routes you saved for your next trip."],
    liked:["Liked Finds","Finds you liked from the community."],
    votes:["My Votes",'Stores you answered "Still worth the trip?" on.']
  };
  const head=heads[tab]||heads.liked;
  return `<div style="margin-top:6px">
    <button class="btn btn-ghost btn-sm" data-action="nav" data-view="profile" style="margin-bottom:16px">${ICONS.back}Back to profile</button>
    <div class="profile-library-head"><div><h1>${head[0]}</h1><p>${head[1]}</p></div></div>
    ${content}
  </div>`;
}

async function checkUnreadFromTeam(){
  if(!state.user){ state.unreadFromTeam = 0; return; }
  const { data } = await sb.from("support_messages").select("id").eq("user_id", state.user.id).eq("sender","admin").eq("read_by_member", false);
  state.unreadFromTeam = (data||[]).length;
}
// Each load gets a number; a load that finishes after a newer one started, or
// after you've left this conversation, is dropped, including its mark-as-read.
let threadLoadSeq = 0;
async function loadThread(userId){
  if(!state.user) return;
  const uid = userId || state.user.id;
  if(uid !== state.user.id && !state.isAdmin) return;
  const req = ++threadLoadSeq;
  const current = ()=> !!state.user && req === threadLoadSeq && state.view === "messages" && ((state.params && state.params.userId) || state.user.id) === uid;
  // The newest 300, so a long thread still shows the latest replies.
  const { data, error } = await sb.from("support_messages").select("*").eq("user_id", uid).order("created_at",{ascending:false}).limit(300);
  if(!current()) return;
  if(error){ console.error("thread failed:", error.message); state.thread = { userId:uid, messages:[], error:true }; renderList(); return; }
  let name = null;
  if(uid !== state.user.id){ const { data: prof } = await sb.from("profiles").select("username").eq("id", uid).maybeSingle(); name = prof && prof.username; }
  if(!current()) return;
  state.thread = { userId:uid, name, messages:(data||[]).slice().reverse().map(m=>({ id:m.id, sender:m.sender, kind:m.kind||"message", body:escapeHtml(m.body), at:m.created_at })) };
  // mark what we just read
  if(state.isAdmin && uid !== state.user.id) sb.from("support_messages").update({ read_by_admin:true }).eq("user_id", uid).eq("sender","member").eq("read_by_admin",false).then(()=>{});
  else { sb.from("support_messages").update({ read_by_member:true }).eq("user_id", uid).eq("sender","admin").eq("read_by_member",false).then(()=>{}); state.unreadFromTeam = 0; }
  renderListKeepingDrafts();
  // Open at the newest message.
  const list = document.getElementById("msg-list"); if(list) list.scrollTop = list.scrollHeight;
}
let sendingMessage = false;
async function sendMessage(){
  const t = state.thread; if(!t || !state.user || sendingMessage) return;
  const box = document.getElementById("msg-input");
  const body = (box?.value||"").trim();
  if(!body){ toast("Type a message first."); return; }
  if(body.length > 2000){ toast("Keep it under 2,000 characters."); return; }
  sendingMessage = true;
  try{
    const asAdmin = state.isAdmin && t.userId !== state.user.id;
    const { error } = await sb.from("support_messages").insert({ user_id:t.userId, sender: asAdmin ? "admin" : "member", body });
    if(error){ console.error("send failed:", error.message); toast(dbErrorMessage(error, "Couldn't send — try again.")); return; }
    box.value = "";
    await loadThread(t.userId);
    const list = document.getElementById("msg-list"); if(list) list.scrollTop = list.scrollHeight;
  } finally { sendingMessage = false; }
}

// ---- Admin: scan Google for stores we don't have yet ----------------------
const SCAN_TYPES = ["thrift store","vintage clothing store","consignment shop","antique store"];
const SCAN_AREAS = ["Decatur","Kirkwood","East Atlanta","Little Five Points","Old Fourth Ward","Midtown","Buckhead","West Midtown","Virginia-Highland","Grant Park","College Park","Marietta","Chamblee","Tucker","Smyrna","Sandy Springs"];
function scanHiddenIds(){
  let local = [];
  try{ local = JSON.parse(localStorage.getItem("atlThrift_scan_hidden")||"[]"); }catch(e){}
  const remote = (state.admin && state.admin.scanHiddenDb) || [];
  return [...new Set([...local, ...remote])];
}
function normName(n){ return String(n||"").toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\b(the|store|shop|llc|inc)\b/g,"").trim(); }
// Background Google jobs only redraw while the admin Stores tab is on screen,
// so they never wipe something being typed elsewhere (like a message reply).
function adminStoresTabShowing(){ return state.view==="admin" && (state.adminTab||"review")==="stores"; }
function rerenderAdminStores(){ if(adminStoresTabShowing()) renderList(); }
async function adminScanStores(){
  if(!state.isAdmin) return;
  state.admin = state.admin || {};
  if(state.admin.scan && state.admin.scan.running) return;
  const scan = state.admin.scan = { running:true, done:0, total:SCAN_TYPES.length*SCAN_AREAS.length, results:[], error:null };
  renderList();
  const havePlace = new Set(state.stores.map(s=>s.googlePlaceId).filter(Boolean));
  const haveName = new Set(state.stores.map(s=>normName(s.name)));
  const hidden = new Set(scanHiddenIds());
  const seen = new Map();
  const jobs = []; SCAN_TYPES.forEach(t=>SCAN_AREAS.forEach(a=>jobs.push({t,a})));
  const run = async (job)=>{
    try{
      const r = await fetch("https://places.googleapis.com/v1/places:searchText", { method:"POST",
        headers:{ "Content-Type":"application/json", "X-Goog-Api-Key":GOOGLE_MAPS_JS_KEY,
          "X-Goog-FieldMask":"places.id,places.displayName,places.formattedAddress,places.rating,places.userRatingCount,places.location,places.nationalPhoneNumber,places.websiteUri,places.regularOpeningHours.weekdayDescriptions,places.photos,places.businessStatus,places.primaryTypeDisplayName" },
        body: JSON.stringify({ textQuery:`${job.t} in ${job.a}, GA`, maxResultCount:20, locationBias:{ rectangle:{ low:{latitude:33.45,longitude:-84.9}, high:{latitude:34.35,longitude:-83.85} } } }) });
      if(!r.ok){ if(!scan.error) scan.error = `Google returned ${r.status}`; return; }
      const j = await r.json();
      (j.places||[]).forEach(pl=>{
        if(!pl.id || seen.has(pl.id)) return;
        if(pl.businessStatus && pl.businessStatus !== "OPERATIONAL") return;
        const name = pl.displayName && pl.displayName.text || "";
        if(havePlace.has(pl.id) || haveName.has(normName(name)) || hidden.has(pl.id)) return;
        seen.set(pl.id, { id:pl.id, name, address:pl.formattedAddress||"", rating:pl.rating||null, reviews:pl.userRatingCount||0,
          lat:pl.location && pl.location.latitude, lng:pl.location && pl.location.longitude, phone:pl.nationalPhoneNumber||"", website:pl.websiteUri||"",
          hours:(()=>{ const w = pl.regularOpeningHours && pl.regularOpeningHours.weekdayDescriptions; return (w && googleHoursToCompact(w)) || ""; })(), photo:(pl.photos && pl.photos[0] && pl.photos[0].name)||"",
          kind:(pl.primaryTypeDisplayName && pl.primaryTypeDisplayName.text)||job.t, area:job.a });
      });
    }catch(e){ if(!scan.error) scan.error = "Couldn't reach Google — check the connection and the Maps key."; }
    finally{ scan.done++; if(scan.done % 4 === 0) rerenderAdminStores(); }
  };
  // four searches at a time
  for(let i=0;i<jobs.length;i+=4){ await Promise.all(jobs.slice(i,i+4).map(run)); }
  scan.results = [...seen.values()].sort((a,b)=>((b.rating||0)*Math.log10((b.reviews||0)+10)) - ((a.rating||0)*Math.log10((a.reviews||0)+10)));
  scan.running = false; rerenderAdminStores();
}
function adminScanHtml(){
  const sc = state.admin && state.admin.scan; if(!sc) return "";
  if(sc.running) return `<div class="card" style="background:var(--cream-card);border-radius:18px;padding:14px 16px;margin-bottom:12px"><div style="font-weight:700;color:var(--ink)">Scanning Google…</div><div class="ar-sub">${sc.done} of ${sc.total} searches done</div></div>`;
  const rows = sc.results;
  return `<div style="background:var(--cream-card);border-radius:18px;padding:14px 16px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="font-weight:700;color:var(--ink)">${rows.length} ${rows.length===1?"store":"stores"} not in the guide yet</div><button class="btn btn-ghost btn-sm" data-action="admin-scan-clear">Clear</button></div>
    ${sc.error ? `<div class="ar-sub" style="color:var(--danger-text)">${escapeHtml(sc.error)}</div>` : ""}
    <div class="ar-sub" style="margin-bottom:8px">Add opens the store form already filled in from Google. Hide keeps a place off future scans.</div>
    ${rows.slice(0,60).map(r=>`<div class="admin-list-row" style="background:var(--cream);align-items:flex-start">
      <div style="flex:1;min-width:0"><div class="ar-name">${escapeHtml(r.name)}${r.rating?` <span style="font-family:var(--font-mono);font-size:10px;color:var(--ink-soft)">★ ${r.rating} (${r.reviews})</span>`:""}</div><div class="ar-sub">${escapeHtml(r.kind)} · found near ${escapeHtml(r.area)}</div><div class="ar-sub">${escapeHtml(r.address)}</div></div>
      <div class="ar-actions" style="flex-direction:column;gap:6px"><button class="btn btn-royal btn-sm" data-action="admin-scan-add" data-pid="${escapeHtml(r.id)}">Add</button><button class="btn btn-ghost btn-sm" data-action="admin-scan-hide" data-pid="${escapeHtml(r.id)}">Hide</button></div>
    </div>`).join("")}
    ${rows.length>60 ? `<div class="ar-sub">Showing the top 60.</div>` : ""}
  </div>`;
}
function adminScanAdd(pid){
  const r = state.admin && state.admin.scan && state.admin.scan.results.find(x=>x.id===pid); if(!r) return;
  const hood = Object.keys(NEIGHBORHOODS).includes(r.area) ? r.area
    : ((r.lat!=null && r.lng!=null && nearestNeighborhood(r.lat, r.lng)) || Object.keys(NEIGHBORHOODS)[0]);
  const k = r.kind.toLowerCase();
  const type = /antique/.test(k) ? "Antique Store" : /vintage/.test(k) ? "Vintage Boutique" : /consign/.test(k) ? "Consignment" : "Thrift Store";
  openModal("adminStoreForm", { prefill:{ name:r.name, address:r.address, neighborhood:hood, type, phone:r.phone, website:String(r.website||"").replace(/^https?:\/\//,"").replace(/\/$/,""), hours:r.hours,
    googlePlaceId:r.id, lat:r.lat, lng:r.lng, rating:r.rating, reviewCount:r.reviews, photoName:r.photo, categories:guessScanCategories(k, r.name), tags:[], bestFor:[], description:"", tips:"", priceLevel:1, color:"royal", chain:false } });
}
// A starting guess for a store found by the scan, from Google's kind of
// place and the name. The admin checks or unchecks before saving.
function guessScanCategories(kind, name){
  const k = String(kind||"").toLowerCase(), n = String(name||"").toLowerCase();
  let cats;
  if(/antique/.test(k)) cats = ["Furniture","Home Decor","Accessories"];
  else if(/vintage/.test(k)) cats = ["Clothing","Vintage","Accessories"];
  else if(/consign/.test(k)) cats = ["Clothing","Designer","Accessories"];
  else cats = ["Clothing","Furniture","Home Decor","Books"];
  if(/furniture/.test(n) && !cats.includes("Furniture")) cats.push("Furniture");
  if(/book/.test(n) && !cats.includes("Books")) cats.push("Books");
  if(/vintage/.test(n) && !cats.includes("Vintage")) cats.push("Vintage");
  if(/designer|luxury|couture/.test(n) && !cats.includes("Designer")) cats.push("Designer");
  return CATEGORIES.filter(c=>cats.includes(c));
}
// One sweep over every store that's linked to a Google listing: pull fresh
// hours (converted to the badge format), rating, review count, and phone.
let refreshingGoogle = false;
async function adminRefreshFromGoogle(){
  if(!state.isAdmin || refreshingGoogle) return;
  const linked = state.stores.filter(s=>s.googlePlaceId);
  if(!linked.length){ toast("No stores are linked to Google yet."); return; }
  refreshingGoogle = true;
  toast(`Refreshing ${linked.length} stores from Google…`);
  let updated = 0, failed = 0;
  const mismatched = [];
  // Words two names must share to count as the same business ("Labels" and
  // "Label" count as one word).
  const IGNORE = ["atlanta","antique","vintage","thrift","market","resale","consignment","boutique","goodwill"];
  const words = n => normName(n).split(" ").map(w=>w.replace(/s$/,"")).filter(w=>w.length>2 && !IGNORE.includes(w));
  const streetNo = a => (String(a||"").match(/^\s*(\d+)/)||[])[1] || null;
  for(const st of linked){
    try{
      const resp = await fetch(`https://places.googleapis.com/v1/places/${encodeURIComponent(st.googlePlaceId)}?key=${GOOGLE_MAPS_JS_KEY}`, {
        headers: { "X-Goog-FieldMask": "displayName,formattedAddress,regularOpeningHours,rating,userRatingCount,nationalPhoneNumber" }
      });
      if(!resp.ok){ failed++; continue; }
      const place = await resp.json();
      const gName = place.displayName && place.displayName.text;
      if(gName){
        const a = words(st.name), b = words(gName);
        const sameName = normName(st.name) === normName(gName) || a.some(w=>b.includes(w)) || (!a.length && !b.length);
        // Chain listings are often just "Goodwill Thrift Store", so a matching
        // street number also counts; a different street number never does.
        const nA = streetNo(st.address), nB = streetNo(place.formattedAddress);
        const sameAddr = !!nA && nA === nB, otherAddr = !!nA && !!nB && nA !== nB;
        if(otherAddr || (!sameName && !sameAddr)){ mismatched.push({ id: st.id, name: st.name, google: gName }); continue; } // don't copy another business's data
      }
      const row = {};
      const compact = googleHoursToCompact(place.regularOpeningHours && place.regularOpeningHours.weekdayDescriptions);
      if(compact) row.hours = compact;
      if(place.rating != null) row.google_rating = place.rating;
      if(place.userRatingCount != null) row.google_review_count = place.userRatingCount;
      if(place.nationalPhoneNumber) row.phone = place.nationalPhoneNumber;
      if(!Object.keys(row).length){ continue; }
      const { error } = await sb.from("stores").update(row).eq("id", st.id);
      if(error){ failed++; continue; }
      if(row.hours) st.hours = row.hours;
      if(row.google_rating != null) st.rating = row.google_rating;
      if(row.google_review_count != null) st.reviewCount = row.google_review_count;
      if(row.phone) st.phone = row.phone;
      updated++;
    }catch(e){ failed++; }
  }
  refreshingGoogle = false;
  state.admin = state.admin || {};
  state.admin.googleMismatch = mismatched;
  toast(`Refreshed ${updated} of ${linked.length} stores${failed ? ` (${failed} failed)` : ""}${mismatched.length ? ` — ${mismatched.length} look linked to the wrong business` : ""}.`);
  rerenderAdminStores();
}
function adminScanHide(pid){
  const ids = scanHiddenIds(); if(!ids.includes(pid)) ids.push(pid);
  try{ localStorage.setItem("atlThrift_scan_hidden", JSON.stringify(ids)); }catch(e){}
  state.admin = state.admin || {};
  state.admin.scanHiddenDb = [...new Set([...(state.admin.scanHiddenDb||[]), pid])];
  // Saved to the database too, so the hide follows the admin account.
  sb.from("scan_hidden_places").upsert({place_id:pid}).then(({error})=>{ if(error) console.error("scan hide sync failed:", error.message); });
  if(state.admin && state.admin.scan) state.admin.scan.results = state.admin.scan.results.filter(x=>x.id!==pid);
  renderList();
}
// ---- Admin review: pending events, store suggestions, reports, sign-ups ----
async function loadAdminData(){
  if(!state.isAdmin) return;
  state.admin = state.admin || {};
  // Redraws only the Admin screen, and not while you're typing; the data is
  // kept for the next time it's drawn.
  const redrawAdmin = ()=>{ if(state.view === "admin" && !isTypingInField()) renderList(); };
  state.admin.loading = true; redrawAdmin();
  const msgLimit = state.admin.msgLimit || 400;
  const MSG_COLS = "user_id, sender, kind, body, created_at, read_by_admin, profiles!support_messages_user_id_fkey(username)";
  const [subs, reps, signups, hiddenScan, msgs, unreadMsgs] = await Promise.all([
    sb.from("store_submissions").select("*").eq("status","pending").order("created_at",{ascending:false}),
    sb.from("reports").select("*").eq("status","open").order("created_at",{ascending:false}),
    sb.rpc("admin_recent_signups", { days: 30 }),
    sb.from("scan_hidden_places").select("place_id"),
    sb.from("support_messages").select(MSG_COLS).order("created_at",{ascending:false}).limit(msgLimit),
    // Unread member messages are fetched on their own, so an older unread
    // conversation never falls off the list or out of the count.
    sb.from("support_messages").select(MSG_COLS).eq("sender","member").eq("read_by_admin",false).order("created_at",{ascending:false}).limit(1000),
    // New submissions show up here without restarting the app.
    loadEvents()
  ]);
  const convos = {};
  const convoFor = m => convos[m.user_id] || (convos[m.user_id] = { userId:m.user_id, name:m.profiles?.username||"member", last:m.body, at:m.created_at, unread:0, feedback:false });
  (msgs.data||[]).forEach(convoFor); // newest first, so the first row seen is the latest message
  const unreadRows = unreadMsgs.error ? (msgs.data||[]).filter(m=>m.sender==="member" && !m.read_by_admin) : (unreadMsgs.data||[]);
  unreadRows.forEach(m=>{ const c = convoFor(m); c.unread++; if(m.kind==="feedback") c.feedback = true; });
  state.admin.msgsCapped = (msgs.data||[]).length >= msgLimit;
  state.admin.convos = Object.values(convos).sort((a,b)=>(b.unread-a.unread) || (b.at>a.at?1:-1));
  state.admin.scanHiddenDb = (hiddenScan.data||[]).map(r=>r.place_id);
  state.admin.storeSubs = subs.data || [];
  state.admin.reports = reps.data || [];
  state.admin.signups = signups.data || [];
  state.admin.loading = false; state.admin.loaded = true;
  redrawAdmin();
}
function adminTargetLabel(r){
  const tid = String(r.target_id??"");
  if(r.target_type==="store"){ const s = getStoreById(tid); return s ? s.name : "Store " + tid; }
  // Post and event text is already HTML-safe in state; the caller escapes this
  // label, so it's decoded here to keep "&" from showing up as "&amp;".
  if(r.target_type==="post"){ const p = state.posts.find(x=>String(x.id)===tid); return p ? `Post: ${decodeHtml(p.item)} (@${decodeHtml(p.user)})` : "Post " + tid.slice(0,8); }
  if(r.target_type==="event"){ const e = state.events.find(x=>String(x.id)===tid); return e ? `Event: ${decodeHtml(e.title)}` : "Event " + tid.slice(0,8); }
  if(r.target_type==="comment"){ const c = findComment(tid); if(!c) return "Comment (not loaded here, may already be deleted)"; const t = decodeHtml(c.text); return `Comment: ${t.length>60 ? t.slice(0,60)+"…" : t} (@${decodeHtml(c.user)})`; }
  return String(r.target_type??"") + " " + tid.slice(0,8);
}
// View and Remove buttons for a report, by what was reported. Remove for
// posts and events also resolves the report; comments use the existing path.
function adminReportActions(r){
  const id = String(r.target_id??""), rid = escapeHtml(r.id);
  const b = (action, label, extra) => `<button class="btn btn-ghost btn-sm" data-action="${action}" data-id="${escapeHtml(id)}"${extra||""}>${label}</button>`;
  let html = "";
  if(r.target_type==="store" && getStoreById(id)) html = b("open-store", "View");
  else if(r.target_type==="event" && state.events.some(e=>String(e.id)===id)) html = b("view-event", "View") + b("admin-report-remove", "Remove", ` data-type="event" data-report="${rid}"`);
  else if(r.target_type==="post" && state.posts.some(p=>String(p.id)===id)) html = b("admin-report-view", "View", ` data-type="post"`) + b("admin-report-remove", "Remove", ` data-type="post" data-report="${rid}"`);
  else if(r.target_type==="comment" && id) html = (findComment(id) ? b("admin-report-view", "View", ` data-type="comment"`) : "") + b("admin-remove-comment", "Remove", ` data-report="${rid}"`);
  return html + `<button class="btn btn-ghost btn-sm" data-action="admin-resolve-report" data-id="${rid}">Resolve</button>`;
}

  const repsHtml = a.loading ? empty("Loading…") : (a.reports||[]).length ? a.reports.map(r=>`
    <div class="admin-list-row" style="align-items:flex-start">
      <div style="flex:1;min-width:0"><div class="ar-name">${escapeHtml(r.reason)}</div><div class="ar-sub">${escapeHtml(adminTargetLabel(r))}</div>${r.details?`<div class="ar-sub" style="margin-top:4px;white-space:normal">${escapeHtml(r.details)}</div>`:""}<div class="ar-sub">${timeAgo(r.created_at)}</div></div>
      <div class="ar-actions" style="flex-direction:column;gap:6px">${adminReportActions(r)}</div>

}
async function adminSetEventStatus(id, status){
  if(!state.isAdmin) return;
  const { error } = await sb.from("events").update({ status }).eq("id", id);
  if(error){ toast("Couldn't update that event."); return; }

// Remove a reported post or event for everyone, then close its report.
let removingReported = false;
async function adminRemoveReported(type, id, reportId){
  if(!state.isAdmin || !id || removingReported || (type!=="post" && type!=="event")) return;
  const what = type==="post" ? "post" : "event";
  if(!confirm(`Remove this ${what} for everyone? This can't be undone.`)) return;
  removingReported = true;
  try{
    const post = type==="post" ? state.posts.find(p=>String(p.id)===String(id)) : null;
    const ev = type==="event" ? state.events.find(e=>String(e.id)===String(id)) : null;
    const { data, error } = await sb.from(type==="post" ? "posts" : "events").delete().eq("id", id).select("id");
    if(error){ console.error("remove reported failed:", error.message); toast(`Couldn't remove that ${what}. Try again.`); return; }
    // The photo or flyer file goes too, so its link stops working.
    if((data||[]).length){
      if(post) removeUploadedFile("post-photos", post.photoDataUrl, post.userId);
      if(ev) removeUploadedFile("event-flyers", ev.flyerUrl, ev.submittedBy);
    }
    if(type==="post") state.posts = state.posts.filter(p=>String(p.id)!==String(id));
    else await loadEvents();
    if(reportId){
      const { error: rErr } = await sb.from("reports").update({ status:"resolved" }).eq("id", reportId);
      if(!rErr && state.admin) state.admin.reports = (state.admin.reports||[]).filter(x=>x.id!==reportId);
    }
    toast((data||[]).length ? (type==="post" ? "Post removed." : "Event removed.") : `That ${what} was already gone. Report resolved.`);
    renderList();
  } finally { removingReported = false; }
}
// Opens Finds at the reported post (and its comments, for a reported comment).
function adminViewReported(type, id){
  const c = type==="comment" ? findComment(id) : null;
  const postId = type==="post" ? String(id) : (c ? c.postId : null);
  if(!postId || !state.posts.some(p=>String(p.id)===postId)){ toast("That isn't loaded here. It may have been deleted."); return; }
  state.communityFilter = "All";
  // Finds shows 10 at a time, so show enough to include this post.
  const idx = communityFeedPosts().findIndex(p=>String(p.id)===postId);
  if(idx >= 0) state.findsShown = Math.max(findsShownCount(), Math.ceil((idx+1)/FINDS_PAGE_SIZE)*FINDS_PAGE_SIZE);
  if(type==="comment") state.openComments = postId;
  go("community");
  const box = document.getElementById("comments-"+postId);
  const card = box && box.closest(".post-card");
  if(!card) return;
  // Below the sticky top bar, not under it.
  const bar = document.querySelector(".topbar");
  const top = card.getBoundingClientRect().top + window.scrollY - ((bar && bar.offsetHeight) || 64) - 8;
  window.scrollTo(0, Math.max(0, top));
}

// Sales tab order: upcoming live events first (soonest first), then pending,

function adminSortedSales(){
  const key = ev => String(ev.startDate||"9999-12-31");
  return state.events.slice().sort((a,b)=>{
    const ra = eventStatusInfo(a, true).rank, rb = eventStatusInfo(b, true).rank;
    if(ra!==rb) return ra-rb;
    return ra===4 ? key(b).localeCompare(key(a)) : key(a).localeCompare(key(b));
  });
}

// Members can delete their own finds (not edit them). The row goes first,
// which also clears its likes, comments and saves; then the photo is removed
// from storage so it stops loading for anyone who kept the link.
const postDeletesInFlight = new Set();
// The file behind a find photo or event flyer link, only when it sits in
// the uploader's own folder: a link pointing at someone else's file never
// gets that file removed.
function uploadPathIn(bucket, url, ownerId){
  const base = `${SUPABASE_URL}/storage/v1/object/public/${bucket}/`;
  if(!ownerId || !String(url||"").startsWith(base)) return null;
  let path = String(url).slice(base.length).split(/[?#]/)[0];
  try{ path = decodeURIComponent(path); }catch(err){ return null; }
  return path.startsWith(ownerId + "/") && path.length > ownerId.length + 1 ? path : null;
}
// Removes a find photo or event flyer through Storage, which deletes the
// file itself. Resolves to false only when Storage reports a problem; an
// empty answer means the file was already gone (or isn't yours to remove).
async function removeUploadedFile(bucket, url, ownerId){
  const path = uploadPathIn(bucket, url, ownerId);
  if(!path) return true;
  try{
    const { error } = await sb.storage.from(bucket).remove([path]);
    if(error){ console.error(bucket + " file delete failed:", error.message); return false; }
    return true;
  }catch(err){ console.error(bucket + " file delete failed:", err && err.message); return false; }
}
async function deleteOwnPost(id){
  if(!state.user || !id || postDeletesInFlight.has(id)) return;
  const p = state.posts.find(x=>x.id===id);
  if(!p || p.userId!==state.user.id) return;
  const name = decodeHtml(p.item);
  if(!confirm(`Delete your find "${name.length>40 ? name.slice(0,40)+"…" : name}"? This can't be undone.`)) return;
  postDeletesInFlight.add(id);
  let res = {};
  try{ res = await sb.from("posts").delete().eq("id", id).eq("user_id", state.user.id).select("id"); }
  catch(err){ res = { error: err }; }
  finally{ postDeletesInFlight.delete(id); }
  if(res.error || !(res.data||[]).length){
    if(res.error) console.error("post delete failed:", res.error.message);
    toast("Couldn't delete that find — try again.");
    return;
  }
  const photoGone = await removeUploadedFile("post-photos", p.photoDataUrl, state.user.id);
  state.posts = state.posts.filter(x=>x.id!==id);
  delete state.likes[id];
  delete state.comments[id];
  state.savedPostIds = state.savedPostIds.filter(x=>x!==id);
  if(state.openComments===id) state.openComments = null;
  toast(photoGone ? "Find deleted." : "Find deleted. Message the team to clear its photo.");
  renderListKeepingDrafts();
}
async function adminRemovePost(id){
  if(!state.isAdmin) return;
  if(!confirm("Remove this post for everyone?")) return;
  const post = state.posts.find(p=>p.id===id);
  const { data, error } = await sb.from("posts").delete().eq("id", id).select("id");
  if(error){ toast("Couldn't remove that post — try again."); return; }
  // Its photo file goes too (only once the post is really gone), so the
  // link stops working.
  if(post && (data||[]).length) removeUploadedFile("post-photos", post.photoDataUrl, post.userId);
  state.posts = state.posts.filter(p=>p.id!==id);
  toast("Post removed.");
  renderList();
}
// The comment's author, the owner of the find it's on, and admins can delete it.
// Asking for the deleted row back shows whether the database actually allowed it.
const commentDeletesInFlight = new Set();
async function deleteComment(id, reportId){
  if(!state.user || !id || commentDeletesInFlight.has(id)) return;
  const c = findComment(id);
  const post = c && state.posts.find(p=>p.id===c.postId);
  if(!state.isAdmin && !(c && (c.userId===state.user.id || (post && post.userId===state.user.id)))) return;
  const who = !c ? "this comment" : c.userId===state.user.id ? "your comment" : `@${decodeHtml(c.user)}'s comment`;
  const said = c ? decodeHtml(c.text) : "";
  if(!confirm(`Delete ${who}${said ? `: "${said.length>40 ? said.slice(0,40)+"…" : said}"` : ""}?`)) return;
  commentDeletesInFlight.add(id);
  let res = {};
  try{ res = await sb.from("comments").delete().eq("id", id).select("id"); }
  catch(err){ res = { error: err }; }
  finally{ commentDeletesInFlight.delete(id); }
  if(res.error || !(res.data||[]).length){ if(res.error) console.error("comment delete failed:", res.error.message); toast(!res.error && !c ? "Couldn't delete that comment. It may already be gone." : "Couldn't delete that comment — try again."); return; }
  Object.keys(state.comments).forEach(k=>{ state.comments[k] = state.comments[k].filter(x=>x.id!==String(id)); });
  if(reportId && state.isAdmin){
    const { error } = await sb.from("reports").update({ status:"resolved" }).eq("id", reportId);
    if(!error && state.admin) state.admin.reports = (state.admin.reports||[]).filter(x=>x.id!==reportId);
  }
  toast("Comment deleted.");
  renderListKeepingDrafts();
}

// Shops you could add, closest to the route first (the nearest of its stops,
// its start and its end). Typing narrows the list by name, neighborhood or
// category, and "Independent shops only" holds here too.
function addStopResults(){
  const r = state.currentRoute;
  if(!r) return "";
  const q = state.addStopQuery || "";
  const pts = r.stops.map(id=>getStoreById(id)).filter(Boolean);
  if(!r.curated){ const st = routeStartPos(r); if(st) pts.push(st); }
  const end = r.destinationCoords || placeOf(r.destination);
  if(end) pts.push(end);
  if(!pts.length) pts.push(placeOf(r.start) || state.userCoords || ATLANTA_CENTER);
  const list = state.stores
    .filter(s=>!r.stops.includes(s.id) && !(state.hideChains && s.chain)
      && matchesSearch(q, [s.name, s.neighborhood, s.type, ...(s.categories||[])]))
    .map(s=>({s, miles: Math.min(...pts.map(p=>milesBetween(p, s)))}))
    .sort((a,b)=>a.miles-b.miles);
  if(!list.length){
    const msg = q.trim() ? `No shops match that search.${state.hideChains ? " Independent shops only is on." : ""}`
      : state.hideChains ? "No more independent shops to add." : "Every shop is already on this route.";
    return `<p style="color:var(--ink-soft);font-size:13px">${msg}</p>`;
  }
  return list.map(({s, miles})=>`<div class="stop-card" data-action="confirm-add-stop" data-id="${s.id}">
          <div class="stop-thumb">${photoOrArt(s)}</div>
          <div class="stop-info"><div class="sname">${escapeHtml(s.name)}</div><div class="smeta">${escapeHtml(s.neighborhood)} · ${miles < 0.1 ? "Right by your route" : (miles < 10 ? miles.toFixed(1) : Math.round(miles))+" mi from your route"}</div></div>
          ${ICONS.plus}
        </div>`).join("");
}

function attachGlobalHandlers(){
  // Search input events arrive via the delegated document listener below,
  // so they survive every re-render.
}
// Rows that scroll sideways (and the start/end chip boxes) keep their place
// when the same screen redraws, so a tapped chip or bookmark doesn't jump
// out of sight. Rows are matched by class and order on the screen.
const KEEP_SCROLL_ROWS = ".hscroll,.filter-row,.event-filter-row,.chip-grid-scroll,.tab-row";
let renderedViewKey = null;
function eachScrollRow(root, fn){
  if(!root) return;
  const seen = {};
  root.querySelectorAll(KEEP_SCROLL_ROWS).forEach(el=>{
    const k = el.className + "#" + (seen[el.className] = (seen[el.className]||0) + 1);
    fn(el, k);
  });
}
function captureRowScroll(root){
  const out = {};
  eachScrollRow(root, (el,k)=>{ if(el.scrollLeft || el.scrollTop) out[k] = [el.scrollLeft, el.scrollTop]; });
  return out;
}
function restoreRowScroll(root, saved){
  if(saved) eachScrollRow(root, (el,k)=>{ const v = saved[k]; if(v){ el.scrollLeft = v[0]; el.scrollTop = v[1]; } });
  fitTabRows(root);
}
// Swipeable tab rows open with the selected tab in view, and fade whichever
// edge has more tabs so the end tab never looks jammed against the border.
function fitTabRows(root){
  if(!root) return;
  root.querySelectorAll(".tab-wrap .tab-row").forEach(row=>{
    const on = row.querySelector(".active");
    if(on && !row.scrollLeft){
      const over = on.offsetLeft + on.offsetWidth - row.clientWidth;
      if(over > 0) row.scrollLeft = over + 3;
    }
    const edges = ()=>{
      const max = row.scrollWidth - row.clientWidth;
      row.classList.toggle("more-left", row.scrollLeft > 2);
      row.classList.toggle("more-right", row.scrollLeft < max - 2);
    };
    row.addEventListener("scroll", edges, {passive:true});
    edges();
  });
}
// The saved rows, but only when the screen being drawn is the one on display.
function rowScrollIfSameView(root){
  return renderedViewKey === navKey(state.view, state.params) ? captureRowScroll(root) : null;
}
function renderList(){
  const viewRoot = document.getElementById("view-root");
  if(!viewRoot) return; // signed out: the welcome screen is showing instead
  const rows = rowScrollIfSameView(viewRoot);
  viewRoot.innerHTML = renderView();
  renderedViewKey = navKey(state.view, state.params);
  restoreRowScroll(viewRoot, rows);
  renderGoogleMapIfNeeded();
  initDestinationAutocomplete();
}

function ensureBrowsePace(r){
  if(r.browseMin) return;

  // A curated route starts at its first stop, so that leg really is zero.
  let prev = r.curated ? stores[0] : routeStartPos(r);

    const mins = prev ? driveMinutes(milesBetween(prev, s)) : 0;
    legs.push(mins);
    totalTravel += mins;
    prev = s;

  const end = r.destinationCoords || placeOf(r.destination);
  if(end && prev) totalTravel += legMinutes(prev, end);

  const r = state.currentRoute;
  const s = getStoreById(id);
  if(!s || !r){ closeModal(); return false; }
  ensureBrowsePace(r);
  r.stops = r.stops.filter(sid=>getStoreById(sid));
  // Slot the new stop wherever it adds the least driving — between the
  // start, the existing stops, and the end point — not just at the end.
  const here = r.stops.map(sid=>getStoreById(sid)).filter(Boolean);
  const anchors = [r.curated ? null : routeStartPos(r), ...here];
  const end = r.destinationCoords || placeOf(r.destination);
  let best = r.stops.length, bestCost = Infinity;
  for(let i=0;i<=here.length;i++){
    const from = anchors[i];

    const cost = (from ? milesBetween(from, s) : 0) + (to ? milesBetween(s, to) - (from ? milesBetween(from, to) : 0) : 0);
    if(cost < bestCost){ bestCost = cost; best = i; }

  r.stops.splice(best, 0, id);

// Google Maps takes at most 9 stops between start and end; these are the
// ones the directions link leaves out.
function mapsDroppedStops(r){
  const stores = (r && r.stops || []).map(id=>getStoreById(id)).filter(Boolean);
  return (r && (r.destination || r.destinationCoords)) ? stores.slice(9) : stores.slice(9, Math.max(9, stores.length-1));
}
function buildGoogleMapsUrl(r){
  const stores = r.stops.map(id=>getStoreById(id)).filter(Boolean);
  if(!stores.length) return null;
  // Name + street address for every stop, so Google Maps labels each slot
  // with the store instead of "Dropped pin". Coordinates only as a last
  // resort for a store with no address on file.
  const point = s => s.address ? encodeURIComponent(`${s.name}, ${s.address}`)
    : s.name ? encodeURIComponent(`${s.name}, Atlanta, GA`)
    : `${s.lat},${s.lng}`;
  const startPos = NEIGHBORHOODS[r.start];
  // Your exact GPS position, when we have it, beats the neighborhood's
  // center point every time — that center can be a mile or more off from
  // where you're actually standing.
  // With real GPS we leave the origin out entirely: Google Maps then uses
  // the phone's own position, labeled "Your location" instead of a pin.
  // Curated routes do the same: they start wherever you are, not in the
  // middle of the first stop's neighborhood. (Your coordinates never go in
  // the link itself, so a shared link doesn't give away where you were.)
  const IN_CITY = ["Downtown","Midtown","Buckhead","Cheshire Bridge","Virginia-Highland","Poncey-Highland","Little Five Points","Reynoldstown","West End","Upper Westside","South Atlanta"];
  const origin = (r.startCoords || r.curated || r.startFromLocation) ? null : encodeURIComponent(IN_CITY.includes(r.start) ? `${r.start}, Atlanta, GA` : `${r.start}, GA`);
  // Stops are separated by an encoded "|" (%7C), as Google's docs ask. A bare
  // "|" can cut the link short once it's handed to another app or pasted
  // into a message, which quietly drops every stop after it.
  let destination, waypoints, wpStores;
  if(r.destinationCoords){
    // A searched end address: show its name when we have one, so the last
    // slot reads "Ponce City Market" instead of a dropped pin.
    destination = r.destinationAddress
      ? encodeURIComponent(r.destinationName && r.destinationName!==r.destinationAddress ? `${r.destinationName}, ${r.destinationAddress}` : r.destinationAddress)
      : `${r.destinationCoords.lat},${r.destinationCoords.lng}`;
    waypoints = stores.map(point).join("%7C");
    wpStores = stores;
  } else if(r.destination){
    const destPos = NEIGHBORHOODS[r.destination];
    destination = destPos ? `${destPos.lat},${destPos.lng}` : encodeURIComponent(r.destination + ", Atlanta, GA");
    waypoints = stores.map(point).join("%7C");
    wpStores = stores;
  } else {
    const last = stores[stores.length-1];
    destination = point(last);
    waypoints = stores.slice(0,-1).map(point).join("%7C");
    wpStores = stores.slice(0,-1);
  }
  let url = `https://www.google.com/maps/dir/?api=1${origin ? `&origin=${origin}` : ""}&destination=${destination}&travelmode=driving`;
  // When the final destination is a store with a known Google listing, pin
  // that exact business so Maps shows its real card.
  if(!r.destinationCoords && !r.destination){
    const last = stores[stores.length-1];
    if(last.googlePlaceId) url += `&destination_place_id=${encodeURIComponent(last.googlePlaceId)}`;
  }
  if(wpStores && wpStores.length > 9){
    wpStores = wpStores.slice(0, 9);
    waypoints = wpStores.map(point).join("%7C");
  }
  if(waypoints) url += `&waypoints=${waypoints}`;
  // Pin each stop to its exact Google listing, so Maps can't snap a store
  // to a same-named branch elsewhere. Only valid when every stop has one.
  if(waypoints && wpStores.every(x=>x.googlePlaceId)){
    url += `&waypoint_place_ids=${wpStores.map(x=>encodeURIComponent(x.googlePlaceId)).join("%7C")}`;
  }
  return url;
}
function buildRouteShareText(r){
  if(!r) return "Check out my thrift route from ATL Thrift Guide.";
  const stores = r.stops.map(id=>getStoreById(id)).filter(Boolean);
  const lines = stores.map((s,i)=>`${i+1}. ${s.name} — ${s.neighborhood}`);
  const hrs = Math.floor(r.totalTime/60), mins = r.totalTime%60;
  const mapsUrl = buildGoogleMapsUrl(r);

  if(/captcha/i.test(msg)) return window.turnstile ? "Bot check didn't pass — please try again." : "Couldn't load the security check. Check your connection and try again.";
  if(isNetworkError(error)) return "Can't reach the server. Check your connection and try again.";
  if(error && (error.status === 429 || /rate limit|too many/i.test(msg))) return "Too many tries. Wait a minute, then try again.";
  return fallback;
}

async function submitForgotPassword(){
  if(sendingReset) return;
  const email = (document.getElementById("forgot-email")?.value||"").trim().toLowerCase();
  if(!email){ toast("Enter your email first."); return; }
  sendingReset = true;
  const done = markButtonBusy("submit-forgot-password", "Sending…");
  try{
    const captchaToken = await getCaptchaToken();
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + "/app.html", captchaToken });
    resetTurnstile();
    if(error){ toast(authErrorMessage(error, "Couldn't send that — try again.")); return; }
    closeModal();
    toast("Check your email for a reset link.");
  } finally { sendingReset = false; done(); }
}
let savingNewPassword = false;
async function submitNewPassword(){
  if(savingNewPassword) return;
  const pw = document.getElementById("new-password")?.value || "";
  const err = validatePassword(pw);
  if(err){ toast(err); return; }
  savingNewPassword = true;
  const done = markButtonBusy("submit-new-password", "Saving…");
  try{
    const { error } = await sb.auth.updateUser({ password: pw });
    if(error){
      if(error.code === "same_password"){ toast("Pick a password that's different from your old one."); return; }
      if(error.code === "weak_password"){ toast("Pick a stronger password — that one's too easy to guess."); return; }
      const msg = authErrorMessage(error, null);
      if(msg){ toast(msg); return; }
      // The reset link's session has run out. This box can't be closed, so
      // go straight to sending a new link instead of leaving you stuck.
      pendingPasswordRecovery = false;
      closeModal();
      openModal("forgotPassword");
      toast("That reset link has expired. Send yourself a new one.");
      return;
    }
    pendingPasswordRecovery = false;
    if(!(await refreshSessionAndProfile())){ closeModal(); showBootError(); toast("Password updated."); return; }
    await loadMyData();
    lastFreshAt = Date.now();
    // A guest's quiz result from before the reset lands on the account too.
    await savePendingStyleForSignedIn();
    syncTermsToAccount();
    closeModal();
    toast("Password updated — you're signed in.");
    render();
    maybeStartMemberTour();
  } finally { savingNewPassword = false; done(); }
}
// ---- Bot protection (Cloudflare Turnstile) ---------------------------------
// The widget quietly checks for bots on the sign-in, sign-up, and reset forms.
// Supabase verifies the token on its side, so a missing/invalid token is rejected there.
const TURNSTILE_SITE_KEY = "0x4AAAAAAFOYbblOeUYBWSRl";
let turnstileToken = null;
let turnstileWidgetId = null;
const TURNSTILE_SCRIPT_URL = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__onTurnstileLoad";
window.__onTurnstileLoad = function(){ window.__turnstileFailed = false; renderTurnstile(); };
// The bot check's script tag couldn't download (see its onerror).
window.__onTurnstileError = function(){ renderTurnstile(); };
function renderTurnstile(){
  const box = document.getElementById("cf-turnstile");
  if(!box) return;
  if(!window.turnstile){
    // Say so in its place, with Try again, instead of a bot check that never comes.
    if(window.__turnstileFailed) box.innerHTML = `<div class="captcha-failed" role="alert"><span>Couldn't load the security check.</span><button class="link-btn" data-action="retry-turnstile">Try again</button></div>`;
    return;
  }
  if(box.dataset.rendered) return;
  box.dataset.rendered = "1";
  box.innerHTML = "";
  turnstileToken = null;
  try{
    turnstileWidgetId = turnstile.render(box, {
      sitekey: TURNSTILE_SITE_KEY,
      appearance: "interaction-only",
      size: "flexible",
      callback: (token)=>{ turnstileToken = token; },
      "expired-callback": ()=>{ turnstileToken = null; },
      "error-callback": ()=>{ turnstileToken = null; }
    });
  }catch(e){ console.error("turnstile render failed", e); }
}
function resetTurnstile(){
  turnstileToken = null;
  try{ if(window.turnstile && turnstileWidgetId !== null) turnstile.reset(turnstileWidgetId); }catch(e){}
}
// Downloads the bot check again after it failed to load.
let turnstileReloading = false;
function retryTurnstileLoad(){
  if(window.turnstile){ renderTurnstile(); return; }
  if(turnstileReloading) return;
  turnstileReloading = true;
  window.__turnstileFailed = false;
  const box = document.getElementById("cf-turnstile");
  if(box) box.innerHTML = `<div class="captcha-failed" role="status"><span>Loading the security check…</span></div>`;
  const s = document.createElement("script");
  s.src = TURNSTILE_SCRIPT_URL;
  s.async = true;
  s.onload = ()=>{ turnstileReloading = false; };
  s.onerror = ()=>{ turnstileReloading = false; s.remove(); window.__turnstileFailed = true; renderTurnstile(); };
  document.head.appendChild(s);
}
// Waits briefly for the bot check to finish (it usually completes instantly).
async function getCaptchaToken(){
  for(let i=0;i<40 && !turnstileToken && !window.__turnstileFailed;i++){ await new Promise(r=>setTimeout(r,150)); }
  return turnstileToken || undefined;
}

async function acceptTerms(){
  if(!document.getElementById("gate-agree")?.checked){ toast("Check the box to agree and continue."); return; }
  const acceptedAt = new Date().toISOString();
  termsAcceptedThisSession = true;
  try{ localStorage.setItem("atlThrift_terms_version", TERMS_VERSION); localStorage.setItem("atlThrift_terms_accepted_at", acceptedAt); }catch(e){}
  if(state.user){
    state.user.termsVersion = TERMS_VERSION;
    // Saved in the background so a slow signal doesn't make the button look
    // frozen; if it doesn't land, syncTermsToAccount tries again next time.
    try{ Promise.resolve(sb.auth.updateUser({ data:{ terms_version: TERMS_VERSION, terms_accepted_at: acceptedAt } })).catch(()=>{}); }catch(e){}
  }
  closeModal();
  render();
  if(pendingPasswordRecovery){ openModal("setNewPassword"); return; }
  // The one-time location question comes right after this screen, before
  // the welcome tour, so the two never stack.
  await askLocationOnce();
  maybeStartMemberTour();
}
// Agreeing to new Terms while signed out is saved on this phone only; this
// copies it onto the account the next time you're signed in here (sign-in,
// a password reset, or opening the app). Runs in the background.
function syncTermsToAccount(){
  const user = state.user;
  if(!user || !sb || (user.termsVersion || "") >= TERMS_VERSION) return;
  let acceptedHere = termsAcceptedThisSession, acceptedAt = null;
  try{
    if(localStorage.getItem("atlThrift_terms_version") === TERMS_VERSION) acceptedHere = true;
    acceptedAt = localStorage.getItem("atlThrift_terms_accepted_at");
  }catch(e){}
  if(!acceptedHere) return;
  try{
    Promise.resolve(sb.auth.updateUser({ data:{ terms_version: TERMS_VERSION, terms_accepted_at: acceptedAt || new Date().toISOString() } }))
      .then(res=>{ if(res && !res.error && state.user === user) user.termsVersion = TERMS_VERSION; })
      .catch(()=>{});
  }catch(e){}
}

const ARCH_LINES = {

function styleSets(kind){ return kind==="home" ? {styles:HOME_STYLES, qs:HOME_QUESTIONS, extra:HOME_EXTRA, other:FASHION_STYLES} : {styles:FASHION_STYLES, qs:FASHION_QUESTIONS, extra:FASHION_EXTRA, other:HOME_STYLES}; }
// A regular answer is one option; a This-or-That answer is a list of sides picked.
// Concrete questions (room, material, palette…) carry more weight (q.w) than
// abstract ones, so they steer the result and the abstract ones add nuance.
function answerWeights(q, pick){
  const m = q.w || 1;
  if(q.tot){ const out = {}; q.tot.forEach((pair,j)=>{ const w = pair[pick[j]] ? pair[pick[j]][1] : {}; for(const k in w) out[k]=(out[k]||0)+w[k]*m; }); return out; }

  return out;
}
// Which answers pushed each style up, for the "How we got your result" section.
function explainResult(r){
