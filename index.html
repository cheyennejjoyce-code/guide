<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATL Thrift Guide — by 2nd Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FDFAF6;
  --cream-card:#FFFFFF;
  --ink:#2B2530;
  --ink-soft:#8A8496;
  --royal:#B8695E;
  --royal-dark:#8A5A44;
  --royal-tint:#F3D9D4;
  --gold:#C99A4A;
  --gold-tint:#F6E7C9;
  --line:#EEE6D8;
  --line-strong:#DED2C3;
  --danger:#B84A3E;
  --shadow-none:none;
  --radius-card:24px;
  --radius-pill:999px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, sans-serif;
}
:root:not([data-theme="light"]) {
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#241F26;
    --cream-card:#2E2830;
    --ink:#FBF5F0;
    --ink-soft:#C9BFC5;
    --royal:#E8A99E;
    --royal-dark:#F3D9D4;
    --royal-tint:#4A3038;
    --gold:#E0BB79;
    --gold-tint:#463A20;
    --line:#453A42;
    --line-strong:#5A4D55;
  }
}
:root[data-theme="dark"]{
  --cream:#241F26;
  --cream-card:#2E2830;
  --ink:#FBF5F0;
  --ink-soft:#C9BFC5;
  --royal:#E8A99E;
  --royal-dark:#F3D9D4;
  --royal-tint:#4A3038;
  --gold:#E0BB79;
  --gold-tint:#463A20;
  --line:#453A42;
  --line-strong:#5A4D55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
}
img,svg{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.app-shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:40;background:var(--cream);display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;}
.brand-mark{display:flex;align-items:center;gap:9px;background:none;border:none;padding:0;}
.brand-logo{width:34px;height:34px;border-radius:9px;background:var(--royal);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-logo svg{width:19px;height:19px;}
.brand-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;}
.brand-text .b1{font-family:var(--font-display);font-weight:600;font-size:16.5px;color:var(--ink);}
.brand-text .b2{font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em;}
.top-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--cream-card);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
.icon-btn svg{width:18px;height:18px;}
main.view{flex:1;padding:0 18px 100px;}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--cream-card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);}
.bottom-nav-inner{max-width:520px;width:100%;display:flex;}
.nav-item{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;color:var(--ink-soft);}
.nav-item svg{width:22px;height:22px;}
.nav-item span{font-size:10.5px;font-weight:600;}
.nav-item.active{color:var(--royal);}
.nav-item.build .nav-dot{position:absolute;}
h1,h2,h3{font-family:var(--font-display);margin:0;color:var(--ink);}
p{margin:0;}
.section{margin-top:30px;}
.section:first-child{margin-top:18px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.section-head h2{font-size:20px;font-weight:600;}
.see-all{font-size:12.5px;font-weight:600;color:var(--royal);background:none;border:none;padding:0;}
.hero{background:linear-gradient(135deg,var(--royal-tint),var(--gold-tint));border-radius:26px;padding:30px 22px 26px;color:var(--ink);position:relative;overflow:hidden;}
.hero .hero-tag{font-family:var(--font-display);font-style:italic;font-size:13px;font-weight:500;color:var(--royal-dark);margin-bottom:10px;display:inline-block;}
.hero h1{font-family:var(--font-display);font-size:34px;line-height:1.04;font-weight:500;color:var(--ink);margin-bottom:12px;}
.hero p.sub{font-size:14.5px;line-height:1.5;color:var(--ink-soft);max-width:340px;margin-bottom:22px;}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap;}
.btn{border-radius:var(--radius-pill);padding:13px 20px;font-weight:700;font-size:14.5px;border:none;display:inline-flex;align-items:center;gap:7px;}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--ink);color:var(--cream);}
.btn-secondary-hero{background:transparent;color:var(--ink);border:1.5px solid rgba(43,37,48,.3);}
.btn-royal{background:var(--royal);color:#fff;}
.btn-outline{background:var(--cream-card);color:var(--ink);border:1px solid var(--line-strong);}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:9px 14px;font-size:13px;}
.hscroll{display:flex;gap:13px;overflow-x:auto;margin:0 -18px;padding:0 18px 6px;scrollbar-width:none;}
.hscroll::-webkit-scrollbar{display:none;}
.store-card{background:var(--cream-card);border:1px solid var(--line);border-radius:var(--radius-card);overflow:hidden;flex-shrink:0;width:236px;}
.store-card.wide{width:100%;flex-shrink:1;}
.store-photo{position:relative;height:130px;}
.store-photo svg{width:100%;height:100%;}
.save-btn{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(20,21,42,.38);border:none;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.save-btn svg{width:17px;height:17px;stroke:#fff;fill:none;}
.save-btn.saved svg{fill:var(--gold);stroke:var(--gold);}
.tag-chip{position:absolute;left:10px;bottom:10px;background:var(--cream);color:var(--ink);font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);}
.store-body{padding:13px 14px 15px;}
.store-name{font-family:var(--font-display);font-size:16.5px;font-weight:600;margin-bottom:3px;}
.store-meta{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.dot-sep::before{content:"·";margin:0 1px;}
.store-desc{font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.45;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.pill{font-size:10.5px;font-weight:600;background:var(--royal-tint);color:var(--royal-dark);padding:4px 9px;border-radius:var(--radius-pill);}
.pill.gold{background:var(--gold-tint);color:#8A5A44;}
:root[data-theme="dark"] .pill.gold, @media (prefers-color-scheme:dark){.pill.gold{color:var(--gold);}}
.card-cta-row{display:flex;gap:8px;margin-top:12px;}
.card-cta-row .btn{flex:1;}
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap input{width:100%;padding:13px 16px 13px 42px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--cream-card);font-size:14.5px;color:var(--ink);}
.search-wrap input::placeholder{color:var(--ink-soft);}
.search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-soft);}
.filter-row{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 6px;padding:0 18px 8px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:9px 15px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--cream-card);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;}
.chip.active{background:var(--royal);color:#fff;border-color:var(--royal);}
.view-toggle{display:flex;background:var(--cream-card);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:3px;margin-bottom:16px;}
.view-toggle button{flex:1;border:none;background:none;padding:9px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px;}
.view-toggle button.active{background:var(--royal);color:#fff;}
.view-toggle svg{width:15px;height:15px;}
.list-stack{display:flex;flex-direction:column;gap:14px;}
.map-canvas{position:relative;width:100%;height:340px;border-radius:var(--radius-card);overflow:hidden;background:var(--royal-tint);border:1px solid var(--line-strong);margin-bottom:16px;}
.map-pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;}
.map-pin button{width:30px;height:30px;border-radius:50% 50% 50% 4px;background:var(--royal);border:2px solid var(--cream-card);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;}
.map-pin button span{transform:rotate(-45deg);font-size:12px;font-weight:800;color:#fff;}
.map-pin.gold button{background:var(--gold);}
.map-pin.gold button span{color:#5C3A1E;}
.map-label{position:absolute;font-size:10px;font-weight:700;color:var(--royal-dark);opacity:.55;letter-spacing:.02em;}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state h3{font-size:17px;margin-bottom:6px;color:var(--ink);}
.empty-state p{font-size:13.5px;line-height:1.5;}
.detail-photo{height:220px;border-radius:var(--radius-card);overflow:hidden;position:relative;margin-bottom:16px;}
.detail-photo svg{width:100%;height:100%;}
.back-fab{position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;background:rgba(20,21,42,.4);border:none;display:flex;align-items:center;justify-content:center;}
.back-fab svg{width:18px;height:18px;stroke:#fff;}
.detail-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.detail-title-row h1{font-size:26px;font-weight:600;}
.rating-badge{background:var(--gold-tint);color:#8A5A44;font-weight:800;font-size:13px;padding:6px 10px;border-radius:12px;display:flex;align-items:center;gap:4px;flex-shrink:0;}
.rating-badge svg{width:13px;height:13px;fill:currentColor;}
.detail-meta-line{font-size:13.5px;color:var(--ink-soft);margin-bottom:14px;}
.detail-cta-row{display:flex;gap:8px;margin-bottom:22px;}
.detail-cta-row .btn{flex:1;padding:12px 10px;font-size:13px;}
.info-block{background:var(--cream-card);border:1px solid var(--line);border-radius:18px;padding:16px 17px;margin-bottom:14px;}
.info-block h3{font-size:14px;margin-bottom:8px;}
.info-block p{font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
.info-row{display:flex;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink-soft);}
.info-row:last-child{border-bottom:none;}
.info-row svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--royal);}
.info-row .lbl{color:var(--ink);font-weight:600;min-width:70px;}
.wizard-card{background:var(--cream-card);border:1px solid var(--line-strong);border-radius:var(--radius-card);padding:22px 20px;}
.wizard-step-label{font-size:12.5px;font-weight:700;color:var(--royal);margin-bottom:6px;}
.wizard-q{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:18px;line-height:1.2;}
.option-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.option-tile{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:16px;border:1px solid var(--line-strong);background:var(--cream);text-align:left;}
.option-tile.active{border-color:var(--royal);background:var(--royal-tint);}
.option-tile .oi{width:36px;height:36px;border-radius:10px;background:var(--royal-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.option-tile.active .oi{background:var(--royal);}
.option-tile .oi svg{width:18px;height:18px;color:var(--royal);}
.option-tile.active .oi svg{color:#fff;}
.option-tile .ot-text{flex:1;}
.option-tile .ot-title{font-weight:700;font-size:14.5px;}
.option-tile .ot-sub{font-size:12px;color:var(--ink-soft);}
.option-tile .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex-shrink:0;}
.option-tile.active .check{background:var(--royal);border-color:var(--royal);position:relative;}
.option-tile.active .check::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.chip-grid{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px;}
.wizard-progress{display:flex;gap:5px;margin-bottom:20px;}
.wizard-progress span{height:4px;flex:1;background:var(--line);border-radius:4px;}
.wizard-progress span.done{background:var(--royal);}
.wizard-nav{display:flex;gap:10px;}
.route-summary-bar{display:flex;justify-content:space-between;background:var(--royal);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:16px;}
.route-summary-bar .rsb-item{text-align:left;}
.route-summary-bar .rsb-num{font-family:var(--font-display);font-size:20px;font-weight:600;}
.route-summary-bar .rsb-lbl{font-size:10.5px;color:#D6DAFB;text-transform:none;}
.stop-card{display:flex;gap:12px;background:var(--cream-card);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px;align-items:flex-start;}
.stop-num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--cream-card);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stop-thumb{width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.stop-thumb svg{width:100%;height:100%;}
.stop-info{flex:1;min-width:0;}
.stop-info .sname{font-weight:700;font-size:14.5px;}
.stop-info .smeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.stop-actions{display:flex;flex-direction:column;gap:5px;}
.stop-actions button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--cream);display:flex;align-items:center;justify-content:center;}
.stop-actions svg{width:13px;height:13px;}
.travel-line{display:flex;align-items:center;gap:8px;padding:2px 0 2px 14px;font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;}
.travel-line svg{width:13px;height:13px;}
.post-card{background:var(--cream-card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:16px;}
.post-head{display:flex;align-items:center;gap:10px;padding:13px 14px 10px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--royal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.post-head .pu{font-weight:700;font-size:13.5px;}
.post-head .pu-meta{font-size:11.5px;color:var(--ink-soft);}
.post-photo{height:230px;position:relative;}
.post-photo svg{width:100%;height:100%;}
.price-tag{position:absolute;top:12px;right:12px;background:var(--gold);color:#5C3A1E;font-weight:800;font-size:13px;padding:6px 11px;border-radius:12px;transform:rotate(3deg);}
.post-body{padding:13px 14px 14px;}
.post-item{font-weight:700;font-size:15px;margin-bottom:2px;}
.post-store{font-size:12.5px;color:var(--royal-dark);font-weight:600;margin-bottom:6px;}
.post-caption{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:11px;}
.post-actions{display:flex;gap:16px;border-top:1px solid var(--line);padding-top:11px;}
.post-actions button{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--ink-soft);font-size:12.5px;font-weight:600;}
.post-actions svg{width:18px;height:18px;fill:none;stroke:currentColor;}
.post-actions button.liked svg{fill:var(--danger);stroke:var(--danger);color:var(--danger);}
.post-actions button.saved-t svg{fill:var(--gold);stroke:var(--gold);color:var(--gold);}
.comments-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.comment-row{display:flex;gap:8px;margin-bottom:9px;font-size:12.5px;}
.comment-row b{font-weight:700;}
.comment-input-row{display:flex;gap:8px;margin-top:8px;}
.comment-input-row input{flex:1;border:1px solid var(--line);background:var(--cream);border-radius:var(--radius-pill);padding:9px 14px;font-size:13px;color:var(--ink);}
.comment-input-row button{background:var(--royal);color:#fff;border:none;border-radius:var(--radius-pill);padding:0 16px;font-weight:700;font-size:12.5px;}
.tab-row{display:flex;gap:6px;background:var(--cream-card);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:3px;margin-bottom:18px;}
.tab-row button{flex:1;border:none;background:none;padding:10px 4px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.tab-row button.active{background:var(--royal);color:#fff;}
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 22px;}
.profile-avatar{width:78px;height:78px;border-radius:50%;background:var(--royal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;font-family:var(--font-display);margin-bottom:12px;}
.profile-head h2{font-size:20px;margin-bottom:3px;}
.profile-head .pmeta{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
.profile-stats{display:flex;gap:26px;margin-top:6px;}
.profile-stats div{text-align:center;}
.profile-stats .pnum{font-family:var(--font-display);font-size:19px;font-weight:600;}
.profile-stats .plbl{font-size:11px;color:var(--ink-soft);}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600;}
.settings-row svg{width:17px;height:17px;color:var(--ink-soft);}
.settings-row .sr-left{display:flex;align-items:center;gap:11px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--line-strong);background:var(--cream-card);border-radius:14px;padding:12px 14px;font-size:14.5px;color:var(--ink);}
.form-group textarea{resize:vertical;min-height:70px;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,21,42,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:var(--cream);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
.modal-sheet.center{border-radius:24px;margin:0 18px;max-height:80vh;}
.modal-handle{width:38px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 18px;opacity:.4;}
.modal-title{font-family:var(--font-display);font-size:21px;font-weight:600;margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--ink-soft);margin-bottom:18px;line-height:1.5;}
.photo-upload-box{border:2px dashed var(--line-strong);border-radius:18px;padding:26px;text-align:center;color:var(--ink-soft);margin-bottom:16px;position:relative;overflow:hidden;}
.photo-upload-box svg{width:26px;height:26px;margin-bottom:6px;}
.photo-upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo-preview{width:100%;height:160px;border-radius:14px;overflow:hidden;margin-bottom:14px;}
.photo-preview img{width:100%;height:100%;object-fit:cover;}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);}
.route-tag-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.admin-list-row{display:flex;justify-content:space-between;align-items:center;background:var(--cream-card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px;}
.admin-list-row .ar-name{font-weight:700;font-size:14px;}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

function timeAgo(dateStr){
  const d = new Date(dateStr+"T12:00:00");

  const days = Math.round((now-d)/86400000);

const DAY_MAP = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
const UNKNOWN_HOURS_MARKERS = ["call ahead","vary","month","check dates","check location"];
function parseStoreHours(hoursStr){
  let s = hoursStr.replace(/\([^)]*\)/g, '').trim();
  const lower = s.toLowerCase();
  if(UNKNOWN_HOURS_MARKERS.some(k=>lower.includes(k))) return null;
  const segments = s.split(',').map(x=>x.trim()).filter(Boolean);
  const rules = [];
  for(const seg of segments){
    const m = seg.match(/^([A-Za-z]{3})(?:[–-]([A-Za-z]{3}))?\s+(\d{1,2})(?::(\d{2}))?[–-](\d{1,2})(?::(\d{2}))?(?:\s+only)?$/);
    if(!m) return null;
    const [, d1, d2, oh, om, ch, cm] = m;
    if(!(d1 in DAY_MAP)) return null;
    let days;
    if(d2){
      if(!(d2 in DAY_MAP)) return null;
      let start = DAY_MAP[d1], end = DAY_MAP[d2];
      days = []; let i = start, guard=0;
      while(true){ days.push(i); if(i===end || guard>7) break; i=(i+1)%7; guard++; }
    } else {
      days = [DAY_MAP[d1]];
    }
    let openHour = parseInt(oh,10), openMin = om?parseInt(om,10):0;
    let closeHour = parseInt(ch,10), closeMin = cm?parseInt(cm,10):0;
    if(openHour>=1 && openHour<=6) openHour += 12;
    if(closeHour<=openHour || closeHour<=8) closeHour += 12;
    rules.push({days, openMin: openHour*60+openMin, closeMin: closeHour*60+closeMin});
  }
  return rules;
}
// Returns true (open), false (closed), or null (hours aren't reliably parseable —
// e.g. "call ahead", monthly markets — so we don't claim to know either way).
function isOpenNow(store){
  const rules = parseStoreHours(store.hours);
  if(!rules) return null;
  const now = new Date();
  const day = now.getDay();
  const mins = now.getHours()*60+now.getMinutes();
  for(const r of rules){
    if(r.days.includes(day) && mins>=r.openMin && mins<r.closeMin) return true;
  }
  return false;
}
function dist(aKey,bKey){
  const a = NEIGHBORHOODS[aKey], b = NEIGHBORHOODS[bKey];
  if(!a||!b) return 5;
  const dx = a.x-b.x, dy=a.y-b.y;
  return Math.sqrt(dx*dx+dy*dy)*0.55;
}
function nearestNeighborhood(lat,lng){
  let best=null, bestD=Infinity;
  for(const name in NEIGHBORHOODS){
    const p = NEIGHBORHOODS[name];
    if(p.lat==null) continue;
    const dlat=(lat-p.lat)*69;
    const dlng=(lng-p.lng)*57.3;
    const d=dlat*dlat+dlng*dlng;
    if(d<bestD){ bestD=d; best=name; }
  }
  return best;
}
function tryDetectLocation(manual){
  if(state.geoAttempted && !manual) return;
  state.geoAttempted = true;
  if(!("geolocation" in navigator)){
    if(manual) toast("Location isn't available in this browser.");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const nb = nearestNeighborhood(pos.coords.latitude, pos.coords.longitude);
      if(nb){
        state.builderChoice.start = nb;
        // Keep your exact coordinates too — the neighborhood name is just
        // for display and filtering; the real Maps link uses this instead
        // of the neighborhood's center point, which could be a mile+ off.
        state.builderChoice.startCoords = {lat: pos.coords.latitude, lng: pos.coords.longitude};
        state.locationDetected = true;
        if(manual) toast("Starting point set to "+nb+".");
        renderList();
      }
    },
    err=>{

    },

  );
}

async function toggleLike(id){

function getStoreVotes(id){
  if(!state.storeVotes[id]) state.storeVotes[id] = {up:[],down:[]};
  return state.storeVotes[id];
}
function getFollowPref(storeId){
  const f = state.storeFollows[storeId];
  if(!f || !state.user) return null;
  return f[state.user.id] || null;
}
function followerCount(storeId){
  const f = state.storeFollows[storeId];
  return f ? Object.keys(f).length : 0;
}
async function setFollowPref(storeId, freq){
  requireAuth(async ()=>{
    if(!state.storeFollows[storeId]) state.storeFollows[storeId] = {};
    if(freq===null){
      await sb.from("store_follows").delete().eq("user_id",state.user.id).eq("store_id",storeId);
      delete state.storeFollows[storeId][state.user.id];
    } else {
      const { error } = await sb.from("store_follows").upsert({user_id:state.user.id, store_id:storeId, frequency:freq});
      if(error){ toast("Couldn't update that — try again."); return; }
      state.storeFollows[storeId][state.user.id] = freq;
    }
    renderList();
  });
}
async function toggleStoreVote(id, dir){
  requireAuth(async ()=>{
    const v = getStoreVotes(id);
    const u = state.user.id;
    const other = dir==="up" ? v.down : v.up;
    const mine = dir==="up" ? v.up : v.down;
    const wasMine = mine.includes(u);
    const oi = other.indexOf(u);
    if(oi>-1) other.splice(oi,1);
    if(wasMine){
      await sb.from("store_votes").delete().eq("user_id",u).eq("store_id",id);
      const mi = mine.indexOf(u); if(mi>-1) mine.splice(mi,1);
    } else {
      const { error } = await sb.from("store_votes").upsert({user_id:u, store_id:id, direction:dir});
      if(error){ toast("Couldn't record that vote — try again."); return; }
      mine.push(u);
    }
    renderList();
  });
}

function generateRoute(){
  const c = state.builderChoice;
  let candidates = state.stores.filter(s=>{
    if(state.hideChains && s.chain) return false;
    if(c.categories.length && !c.categories.some(cat=>s.categories.includes(cat))) return false;
    return true;
  });
  candidates = candidates.map(s=>Object.assign({}, s, {distance: dist(c.start, s.neighborhood)}));
  const maxMi = c.distance==="5 miles"?5 : c.distance==="10 miles"?10 : c.distance==="20 miles"?20 : 999;
  candidates = candidates.filter(s=>s.distance<=maxMi);
  candidates.sort((a,b)=>a.distance-b.distance);
  const count = c.time==="2 hours"?2 : c.time==="Half day"?4 : 6;
  let picked = candidates.slice(0, count);
  if(picked.length===0) picked = state.stores.slice(0,2);
  let ordered;
  const destPos = c.destination && NEIGHBORHOODS[c.destination];
  if(destPos){
    const startPos = NEIGHBORHOODS[c.start];
    const vx = destPos.x-startPos.x, vy = destPos.y-startPos.y;
    const len2 = (vx*vx+vy*vy) || 1;
    ordered = [...picked].sort((a,b)=>{
      const pa = NEIGHBORHOODS[a.neighborhood], pb = NEIGHBORHOODS[b.neighborhood];
      const ta = ((pa.x-startPos.x)*vx + (pa.y-startPos.y)*vy)/len2;
      const tb = ((pb.x-startPos.x)*vx + (pb.y-startPos.y)*vy)/len2;
      return ta-tb;
    });
  } else {
    ordered = [];
    let currentPos = c.start;
    let pool = [...picked];
    while(pool.length){
      pool.sort((a,b)=>dist(currentPos,a.neighborhood)-dist(currentPos,b.neighborhood));
      const next = pool.shift();
      ordered.push(next);
      currentPos = next.neighborhood;
    }
  }
  const browseMin = c.time==="2 hours"?40 : c.time==="Half day"?35 : 30;
  let totalTravel = 0;
  const legs = [];
  let prev = c.start;
  ordered.forEach(s=>{
    const d = dist(prev, s.neighborhood);
    const mins = Math.max(4, Math.round(d*2.6));
    legs.push(mins);
    totalTravel += mins;
    prev = s.neighborhood;
  });
  if(destPos){
    const finalLeg = Math.max(4, Math.round(dist(prev, c.destination)*2.6));
    totalTravel += finalLeg;
  }
  const totalBrowse = browseMin * ordered.length;
  state.currentRoute = {
    id: uid("route_"),
    title: `Your ${c.time} thrift route`,
    start: c.start,
    startCoords: c.startCoords || null,
    destination: c.destination || null,
    stops: ordered.map(s=>s.id),
    legs,
    totalTravel,
    totalBrowse,
    totalTime: totalTravel + totalBrowse,
    createdFrom: Object.assign({}, c)
  };
  go("routeResults");
}

function handleClick(e){
  const t = e.target.closest("[data-action]");
  if(!t){
    if(e.target.closest(".modal-overlay") && e.target.classList.contains("modal-overlay")){ closeModal(); }
    return;
  }
  const action = t.dataset.action;
  switch(action){
    case "nav": go(t.dataset.view); break;
    case "go-home": go("home"); break;
    case "go-profile": go("profile"); break;
    case "go-back": go("discover"); break;
    case "open-store": go("storeDetail", {id:t.dataset.id}); break;
    case "save-store": toggleSaveStore(t.dataset.id); break;
    case "toggle-visited": toggleVisited(t.dataset.id); break;
    case "vote-store": toggleStoreVote(t.dataset.id, t.dataset.dir); break;
    case "toggle-follow-store": setFollowPref(t.dataset.id, getFollowPref(t.dataset.id) ? null : "weekly"); break;
    case "set-follow-freq": setFollowPref(t.dataset.id, t.dataset.freq); break;
    case "save-post": toggleSavePost(t.dataset.id); break;
    case "like-post": toggleLike(t.dataset.id); break;
    case "toggle-comments": state.openComments = state.openComments===t.dataset.id?null:t.dataset.id; renderList(); break;
    case "add-comment": submitComment(t.dataset.id); break;
    case "follow-user": requireAuth(()=>{ toast("You're now following @"+t.dataset.u); }); break;
    case "share-post": {
      const p = state.posts.find(x=>x.id===t.dataset.id);
      const st = p ? getStoreById(p.store) : null;
      doShare(p ? `${p.item} — $${p.price}${st?', found at '+st.name:''}. Posted on ATL Thrift Guide.` : "Check out this find on ATL Thrift Guide.");
      break;
    }
    case "share-store": {
      const s = getStoreById(t.dataset.id);
      doShare(s ? `${s.name} — ${s.neighborhood}. ${s.description} Found on ATL Thrift Guide.` : "Check out this store on ATL Thrift Guide.");
      break;
    }
    case "share-route": doShareRaw(buildRouteShareText(state.currentRoute)); break;
    case "add-to-route": addStoreToBuilder(t.dataset.id); break;
    case "get-directions": toast("Opening directions isn't available in this prototype yet."); break;
    case "filter-neighborhood":
      state.discoverFilters = [t.dataset.n];
      state.searchQuery = "";
      go("discover");
      break;
    case "scroll-community": go("community"); break;
    case "view-curated-route": loadCuratedRoute(t.dataset.id); break;
    case "toggle-filter": toggleDiscoverFilter(t.dataset.f); break;
    case "set-discover-mode": state.discoverMode = t.dataset.mode; saveState(); renderList(); break;
    case "toggle-hide-chains": state.hideChains = !state.hideChains; saveState(); renderList(); break;
    case "set-start": state.builderChoice.start = t.dataset.n; if(state.builderChoice.destination===t.dataset.n) state.builderChoice.destination=null; state.locationDetected=false; state.builderChoice.startCoords=null; renderList(); break;
    case "use-my-location": tryDetectLocation(true); break;
    case "toggle-destination-picker": state.showDestinationPicker = !state.showDestinationPicker; renderList(); break;
    case "set-destination": state.builderChoice.destination = t.dataset.n || null; state.showDestinationPicker=false; renderList(); break;
    case "set-time": state.builderChoice.time = t.dataset.t; renderList(); break;
    case "set-distance": state.builderChoice.distance = t.dataset.d; renderList(); break;
    case "toggle-category": toggleBuilderCategory(t.dataset.c); break;
    case "wizard-next": state.builderStep = Math.min(3, state.builderStep+1); renderList(); break;
    case "wizard-back": state.builderStep = Math.max(0, state.builderStep-1); renderList(); break;
    case "build-route": generateRoute(); break;
    case "move-stop": moveStop(parseInt(t.dataset.i), t.dataset.dir); break;
    case "remove-stop": removeStop(parseInt(t.dataset.i)); break;
    case "open-in-maps": {
      const url = buildGoogleMapsUrl(state.currentRoute);
      if(url) window.open(url, "_blank"); else toast("No route to open yet.");
      break;
    }
    case "open-add-stop": openModal("addStop"); break;
    case "confirm-add-stop": confirmAddStop(t.dataset.id); break;
    case "save-route": saveCurrentRoute(); break;
    case "set-community-filter": state.communityFilter = t.dataset.f; renderList(); break;
    case "open-share-find": openModal("shareFind", {store: t.dataset.store}); break;
    case "set-saved-tab": state.savedTab = t.dataset.t; renderList(); break;
    case "load-saved-route": state.currentRoute = state.userRoutes.find(r=>r.id===t.dataset.id); go("routeResults"); break;
    case "open-login": openModal("login"); break;
    case "open-forgot-password": openModal("forgotPassword"); break;
    case "submit-forgot-password": submitForgotPassword(); break;
    case "submit-new-password": submitNewPassword(); break;
    case "toggle-auth-mode": state.authMode = (state.authMode==="signup"?"signin":"signup"); renderModal(); break;
    case "close-modal": case "close-modal-bg": closeModal(); break;
    case "submit-login": submitLogin(); break;
    case "open-edit-profile": openModal("editProfile"); break;
    case "submit-edit-profile": submitEditProfile(); break;
    case "submit-find": submitFind(); break;
    case "sign-out": sb.auth.signOut().then(()=>{ state.user=null; loadMyData().then(()=>go("home")); }); break;
    case "admin-login": adminLogin(); break;
    case "set-admin-tab": state.adminTab = t.dataset.t; renderList(); break;
    case "admin-add-store": openModal("adminStoreForm", {}); break;
    case "admin-edit-store": openModal("adminStoreForm", {id:t.dataset.id}); break;
    case "admin-delete-store": adminDeleteStore(t.dataset.id); break;
    case "admin-toggle-featured": adminToggleFeatured(t.dataset.id); break;
    case "admin-delete-post": adminDeletePost(t.dataset.id); break;
    case "admin-add-event": openModal("adminEventForm", {}); break;
    case "admin-edit-event": openModal("adminEventForm", {id:t.dataset.id}); break;
    case "admin-delete-event": toast("Sales/events editing isn't wired to Supabase yet — delete rows in the Table Editor for now."); break;
    case "submit-admin-event": submitAdminEvent(t.dataset.id); break;
    case "submit-admin-store": submitAdminStore(t.dataset.id); break;
  }
}

function loadCuratedRoute(id){
  const r = CURATED_ROUTES.find(x=>x.id===id);
  if(!r) return;
  const legs = [];
  let prev = r.storeIds[0] ? getStoreById(r.storeIds[0]).neighborhood : "Old Fourth Ward";
  r.storeIds.forEach((sid,i)=>{
    if(i===0){ legs.push(0); return; }
    const s = getStoreById(sid);
    legs.push(Math.max(4, Math.round(dist(prev, s.neighborhood)*2.6)));
    prev = s.neighborhood;
  });
  const totalTravel = legs.reduce((a,b)=>a+b,0);
  const totalBrowse = 35*r.storeIds.length;
  state.currentRoute = {
    id: uid("route_"), title:r.title, start: getStoreById(r.storeIds[0]).neighborhood,
    stops:[...r.storeIds], legs, totalTravel, totalBrowse, totalTime: totalTravel+totalBrowse, curated:true
  };
  go("routeResults");
}
function moveStop(i,dir){
  const r = state.currentRoute;
  const j = dir==="up" ? i-1 : i+1;
  if(j<0 || j>=r.stops.length) return;
  [r.stops[i], r.stops[j]] = [r.stops[j], r.stops[i]];
  renderList();
}
function removeStop(i){
  state.currentRoute.stops.splice(i,1);

// Same as doShare, but doesn't tack the app's own link on the end — for
// route shares, which already have a real Google Maps link embedded in
// them. Two links in one message confuses the preview card some apps
// (iMessage included) generate, and grabs the wrong one.
function doShareRaw(text){
  try{
    navigator.clipboard.writeText(text).then(()=>toast("Copied to clipboard."), ()=>toast("Couldn't copy — try again."));
  }catch(e){ toast("Sharing isn't available here."); }
}
function buildGoogleMapsUrl(r){
  const stores = r.stops.map(id=>getStoreById(id)).filter(Boolean);
  if(!stores.length) return null;
  // Coordinates everywhere possible — nothing text-based for a Google→Apple
  // Maps hand-off to fail to decode. Falls back to the text address only
  // for a store that hasn't been geocoded yet (sync-google-data.js not run,
  // or Google had no match for that specific place).
  const point = s => (s.lat!=null && s.lng!=null) ? `${s.lat},${s.lng}` : encodeURIComponent(s.address);
  const startPos = NEIGHBORHOODS[r.start];
  // Your exact GPS position, when we have it, beats the neighborhood's
  // center point every time — that center can be a mile or more off from
  // where you're actually standing.
  const origin = r.startCoords ? `${r.startCoords.lat},${r.startCoords.lng}`
    : startPos ? `${startPos.lat},${startPos.lng}`
    : encodeURIComponent(r.start + ", Atlanta, GA");
  let destination, waypoints;
  if(r.destination){
    const destPos = NEIGHBORHOODS[r.destination];
    destination = destPos ? `${destPos.lat},${destPos.lng}` : encodeURIComponent(r.destination + ", Atlanta, GA");
    waypoints = stores.map(point).join("|");
  } else {
    const last = stores[stores.length-1];
    destination = point(last);
    waypoints = stores.slice(0,-1).map(point).join("|");
  }
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
  if(waypoints) url += `&waypoints=${waypoints}`;
  return url;
}
function buildRouteShareText(r){
  if(!r) return "Check out my thrift route from ATL Thrift Guide.";
  const stores = r.stops.map(id=>getStoreById(id)).filter(Boolean);
  const lines = stores.map((s,i)=>`${i+1}. ${s.name} — ${s.neighborhood}`);
  const hrs = Math.floor(r.totalTime/60), mins = r.totalTime%60;
  const mapsUrl = buildGoogleMapsUrl(r);
  return `My ATL thrift route${r.title?': '+r.title:''}:\n${lines.join('\n')}\nEstimated time: ${hrs}h ${mins}m.${mapsUrl ? '\nDrive it in Google Maps: '+mapsUrl : ''}`;
}

  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  if(error){ toast("Couldn't send that — try again."); return; }
  closeModal();
  toast("Check your email for a reset link.");
}
async function submitNewPassword(){
  const pw = document.getElementById("new-password").value;
  const err = validatePassword(pw);
  if(err){ toast(err); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if(error){ toast("Couldn't update your password — try the reset link again."); return; }
  await refreshSessionAndProfile();
  await loadMyData();
  closeModal();
  toast("Password updated — you're signed in.");
  render();
}
async function submitLogin(){
  const mode = state.authMode || "signup";
  const email = document.getElementById("login-email").value.trim().toLowerCase();
  const password = document.getElementById("login-password").value;

  if(mode === "signup"){
    const unameRaw = document.getElementById("login-username").value.trim();
    const username = unameRaw.replace(/\s+/g,'').toLowerCase();
    if(!username || !email || !password){ toast("Fill in username, email, and password."); return; }
    const pwError = validatePassword(password);
    if(pwError){ toast(pwError); return; }
    const { data: existing } = await sb.from("profiles").select("id").eq("username", username).maybeSingle();
    if(existing){ toast("That username is already taken."); return; }
    const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ username } } });
    if(error){
      // Supabase's own message ("User already registered", etc.) is
      // clearer than anything we'd write ourselves here.
      toast(error.message);
      return;
    }
    await refreshSessionAndProfile();
    await loadMyData();
    closeModal();
    const pending = state.pendingAction;
    state.pendingAction = null;
    toast("Account created — welcome, @"+(state.user?.username||username)+"!");
    render();
    if(pending) pending();
  } else {
    if(!email || !password){ toast("Enter your email and password."); return; }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ toast("Incorrect email or password."); return; }
    await refreshSessionAndProfile();
    await loadMyData();
    closeModal();
    const pending = state.pendingAction;
    state.pendingAction = null;
    toast("Signed in as @"+state.user.username);
    render();
    if(pending) pending();
  }
}
async function submitEditProfile(){
  const bio = document.getElementById("ep-bio").value;
  const favCategory = document.getElementById("ep-cat").value;
  const neighborhood = document.getElementById("ep-n").value;
  const avatarUrl = pendingAvatarData || state.user.avatarUrl;
  const { error } = await sb.from("profiles").update({
    bio, fav_category: favCategory, neighborhood, avatar_url: avatarUrl
  }).eq("id", state.user.id);
  if(error){ toast("Couldn't save your profile — try again."); return; }
  state.user.bio = bio; state.user.favCategory = favCategory; state.user.neighborhood = neighborhood;
  if(pendingAvatarData){ state.user.avatarUrl = pendingAvatarData; pendingAvatarData = null; }
  closeModal();
  render();
}
function submitFind(){
  const item = document.getElementById("sf-item").value.trim();
  const store = document.getElementById("sf-store").value;
  const price = parseFloat(document.getElementById("sf-price").value) || 0;
  const cat = document.getElementById("sf-cat").value;
  const caption = document.getElementById("sf-caption").value.trim();
  if(!item){ toast("Add a short item description first."); return; }
  requireAuth(async ()=>{
    const { data, error } = await sb.from("posts").insert({
      user_id: state.user.id, item, store_id: store||null, price, category: cat, caption,
      photo_url: pendingFindPhotoData || null
    }).select().single();
    if(error){ toast("Couldn't post that find — try again."); return; }
    pendingFindPhotoData = null;
    state.posts.unshift({ id:data.id, user:state.user.username, userId:state.user.id, item, store, price, category:cat, caption, photoDataUrl:data.photo_url, date:(data.created_at||"").slice(0,10) });
    closeModal();
    toast("Find posted.");
    go("community");
  });
}

  else toast("That passcode isn't right.");

document.body.addEventListener("click", handleClick);

function attachModalHandlers(){
  const photoInput = document.getElementById("sf-photo");
  if(photoInput){
    photoInput.addEventListener("change", e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        pendingFindPhotoData = ev.target.result;
        document.getElementById("sf-preview").innerHTML = `<div class="photo-preview"><img src="${ev.target.result}"></div>`;
      };
      reader.readAsDataURL(file);
    });
  }
  const avatarInput = document.getElementById("ep-avatar");
  if(avatarInput){
    avatarInput.addEventListener("change", e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        pendingAvatarData = ev.target.result;
        document.getElementById("ep-avatar-preview").innerHTML = `<div style="width:84px;height:84px;border-radius:50%;overflow:hidden;margin:0 auto"><img src="${pendingAvatarData}" style="width:100%;height:100%;object-fit:cover"></div>`;
      };
      reader.readAsDataURL(file);
    });
  }
  document.querySelectorAll('[data-comment-input]').forEach(inp=>{
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") submitComment(inp.dataset.commentInput); });
  });
}

boot();
